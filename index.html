<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0,
    minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Utica Drive</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three":
      "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
</head>

<body>

<canvas id="game"></canvas>

<div id="loadingScreen">
  <div class="loadingTitle">UTICA DRIVE</div>
  <div id="loadingText">Loading Utica...</div>
  <div class="loadingBar">
    <div id="loadingProgress"></div>
  </div>
</div>

<div id="hud">

  <div id="hudLeft">
    <div class="hudCity">UTICA, NEW YORK</div>
    <div id="streetName">GENESEE STREET</div>

    <div class="money">
      $ <span id="money">00000500</span>
    </div>

    <div>
      ❤️ <span id="health">100</span>
    </div>

    <div id="wanted">
      ☆☆☆☆☆
    </div>

    <div id="gameClock">
      12:00
    </div>

    <div>
      🔫 <span id="ammo">12 / 48</span>
    </div>

    <div class="missionHeader">
      MAIN MISSION
    </div>

    <div id="missionText">
      Find your M4
    </div>

    <div>
      <span id="speed">0</span> MPH
    </div>

    <div id="zoneText">
      DOWNTOWN
    </div>

  </div>

  <div id="miniMapWrap">
    <canvas
      id="miniMap"
      width="180"
      height="180">
    </canvas>
  </div>

</div>

<div id="mobileControls">

  <div id="leftSide">

    <div id="joystick">
      <div id="joystickKnob"></div>
    </div>

    <button
      id="sprintButton"
      class="smallButton">
      🏃
    </button>

  </div>

  <div id="rightSide">

    <button
      id="actionButton"
      class="actionButton">
      🚘 ENTER
    </button>

    <button
      id="attackButton"
      class="smallButton">
      👊
    </button>

    <button
      id="weaponButton"
      class="smallButton">
      🔫
    </button>

    <div id="carControls">

      <button
        id="reverseButton"
        class="pedal reverse">
        REVERSE
      </button>

      <button
        id="gasButton"
        class="pedal gas">
        GAS
      </button>

    </div>

  </div>

</div>

<div id="message"></div>

<script
  type="module"
  src="app.js">
</script>

</body>
</html>
