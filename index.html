<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />

  <title>Utica Drive</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<div id="game"></div>

<div id="loading">
  <div class="loading-title">UTICA DRIVE</div>
  <div id="loadingText">Loading Utica...</div>
  <div class="loading-bar">
    <div></div>
  </div>
</div>

<div id="hud">

  <div id="topLeft">
    <div id="city">UTICA, NEW YORK</div>
    <div id="street">GENESEE STREET</div>

    <div class="hudRow">
      <span class="money">$</span>
      <span id="money">00000500</span>
    </div>

    <div class="hudRow">
      ❤️ <span id="health">100</span>
    </div>

    <div id="wanted">☆☆☆☆☆</div>
  </div>

  <div id="clock">22:27</div>

  <div id="weaponBox">
    <div id="weaponIcon">🔫</div>
    <div id="ammo">12 / 48</div>
  </div>

  <div id="missionBox">
    <div class="missionTitle">MAIN MISSION</div>
    <div id="missionText">Find your M4</div>
  </div>

  <div id="speedBox">
    <span id="speed">0</span>
    <small>MPH</small>
  </div>

  <canvas id="minimap" width="180" height="180"></canvas>

  <div id="walkControls">

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <button id="enterCar" class="round action">
      🚗
      <span>ENTER</span>
    </button>

    <button id="attack" class="round action">👊</button>

    <button id="run" class="round action">🏃</button>

  </div>

  <div id="driveControls">

    <button id="steerLeft" class="driveButton">◀</button>

    <button id="steerRight" class="driveButton">▶</button>

    <button id="brake" class="pedal brake">
      BRAKE
      <span>REVERSE</span>
    </button>

    <button id="gas" class="pedal gas">
      GAS
    </button>

    <button id="exitCar" class="round exit">
      EXIT
    </button>

  </div>

  <div id="notification"></div>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
