<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"

  >

  <title>Utica Drive</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="game"></div>

<div id="topHud">

  <div id="location">UTICA, NEW YORK</div>

  <div id="speed">0 MPH</div>

</div>

<div id="message">

  UTICA DRIVE

  <small>Mobile Open World Prototype</small>

</div>

<div id="controls">

  <button id="left" class="control">◀</button>

  <button id="right" class="control">▶</button>

  <button id="gas" class="control pedal">▲</button>

  <button id="brake" class="control pedal">▼</button>

  <button id="exit" class="action">

    EXIT

  </button>

  <button id="reverse" class="action">

    REVERSE

  </button>

</div>

<script type="importmap">

{

  "imports": {

    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"

  }

}

</script>

<script type="module" src="app.js"></script>

</body>

</html>
