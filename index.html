<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Utica Streets</title>

<style>

html, body {

  margin: 0;

  padding: 0;

  overflow: hidden;

  background: #111;

  font-family: Arial, sans-serif;

  touch-action: none;

}

canvas {

  display: block;

  width: 100vw;

  height: 100vh;

  background: #242424;

}

#hud {

  position: fixed;

  top: 15px;

  left: 15px;

  color: white;

  background: rgba(0,0,0,.65);

  padding: 10px 14px;

  border-radius: 10px;

  font-size: 14px;

  z-index: 10;

}

#wanted {

  color: #ffd700;

  letter-spacing: 2px;

}

#controls {

  position: fixed;

  bottom: 25px;

  left: 0;

  width: 100%;

  height: 170px;

  pointer-events: none;

  z-index: 20;

}

.btn {

  position: absolute;

  width: 68px;

  height: 68px;

  border-radius: 50%;

  border: 2px solid rgba(255,255,255,.6);

  background: rgba(0,0,0,.55);

  color: white;

  font-size: 28px;

  font-weight: bold;

  pointer-events: auto;

  user-select: none;

  -webkit-user-select: none;

}

#left {

  left: 20px;

  bottom: 15px;

}

#right {

  left: 105px;

  bottom: 15px;

}

#gas {

  right: 20px;

  bottom: 65px;

  background: rgba(0,120,0,.7);

}

#brake {

  right: 105px;

  bottom: 15px;

  background: rgba(150,0,0,.7);

}

#city {

  position: fixed;

  top: 15px;

  right: 15px;

  color: white;

  font-weight: bold;

  background: rgba(0,0,0,.55);

  padding: 8px 12px;

  border-radius: 8px;

  z-index: 10;

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <b>UTICA STREETS</b><br>

  Speed: <span id="speed">0</span> MPH<br>

  Cash: $<span id="cash">500</span><br>

  Wanted:

  <span id="wanted">☆☆☆☆☆</span>

</div>

<div id="city">

  UTICA, NEW YORK

</div>

<div id="controls">

  <button class="btn" id="left">◀</button>

  <button class="btn" id="right">▶</button>

  <button class="btn" id="gas">▲</button>

  <button class="btn" id="brake">▼</button>

</div>

<script>

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");

function resize() {

  canvas.width = innerWidth;

  canvas.height = innerHeight;

}

resize();

addEventListener("resize", resize);

const keys = {

  left:false,

  right:false,

  gas:false,

  brake:false

};

function control(id, key) {

  const button = document.getElementById(id);

  button.addEventListener("pointerdown", e => {

    e.preventDefault();

    keys[key] = true;

  });

  button.addEventListener("pointerup", e => {

    e.preventDefault();

    keys[key] = false;

  });

  button.addEventListener("pointercancel", () => {

    keys[key] = false;

  });

  button.addEventListener("pointerleave", () => {

    keys[key] = false;

  });

}

control("left","left");

control("right","right");

control("gas","gas");

control("brake","brake");

const car = {

  x: 0,

  y: 0,

  angle: 0,

  speed: 0

};

let cash = 500;

let wanted = 0;

const blocks = [];

const blockSize = 360;

const roadWidth = 110;

/* Build a large city */

for(let x=-8; x<=8; x++){

  for(let y=-8; y<=8; y++){

    blocks.push({

      x:x*blockSize + roadWidth/2,

      y:y*blockSize + roadWidth/2,

      w:blockSize-roadWidth,

      h:blockSize-roadWidth

    });

  }

}

function drawCity(cameraX,cameraY){

  ctx.fillStyle="#555";

  ctx.fillRect(0,0,canvas.width,canvas.height);

  /* city blocks */

  for(const b of blocks){

    const sx=b.x-cameraX+canvas.width/2;

    const sy=b.y-cameraY+canvas.height/2;

    ctx.fillStyle="#292929";

    ctx.fillRect(sx,sy,b.w,b.h);

    /* sidewalks */

    ctx.strokeStyle="#888";

    ctx.lineWidth=8;

    ctx.strokeRect(

      sx+5,

      sy+5,

      b.w-10,

      b.h-10

    );

    /* buildings */

    ctx.fillStyle="#444";

    ctx.fillRect(

      sx+30,

      sy+30,

      b.w-60,

      b.h-60

    );

    /* windows */

    ctx.fillStyle="#d7b45a";

    for(let wx=50;wx<b.w-50;wx+=45){

      for(let wy=50;wy<b.h-50;wy+=45){

        ctx.fillRect(

          sx+wx,

          sy+wy,

          12,

          12

        );

      }

    }

  }

  /* road lines */

  ctx.strokeStyle="#e7c841";

  ctx.lineWidth=3;

  ctx.setLineDash([25,25]);

  for(let i=-8;i<=8;i++){

    let road=i*blockSize-cameraX+canvas.width/2;

    ctx.beginPath();

    ctx.moveTo(road,0);

    ctx.lineTo(road,canvas.height);

    ctx.stroke();

    let roadY=i*blockSize-cameraY+canvas.height/2;

    ctx.beginPath();

    ctx.moveTo(0,roadY);

    ctx.lineTo(canvas.width,roadY);

    ctx.stroke();

  }

  ctx.setLineDash([]);

}

function update(){

  if(keys.gas)

    car.speed += .12;

  if(keys.brake)

    car.speed -= .16;

  car.speed *= .985;

  if(car.speed > 7)

    car.speed=7;

  if(car.speed < -3)

    car.speed=-3;

  if(Math.abs(car.speed) > .05){

    let steering=.045;

    if(keys.left)

      car.angle -= steering*(car.speed/3);

    if(keys.right)

      car.angle += steering*(car.speed/3);

  }

  car.x += Math.sin(car.angle)*car.speed;

  car.y -= Math.cos(car.angle)*car.speed;

  document.getElementById("speed").textContent =

    Math.round(Math.abs(car.speed)*12);

  document.getElementById("cash").textContent=cash;

  document.getElementById("wanted").textContent =

    "★".repeat(wanted)+"☆".repeat(5-wanted);

}

function drawCar(){

  ctx.save();

  ctx.translate(

    canvas.width/2,

    canvas.height/2

  );

  ctx.rotate(car.angle);

  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.5)";

  ctx.fillRect(-16,-31,36,66);

  /* body */

  ctx.fillStyle="#1976d2";

  ctx.fillRect(-15,-30,30,60);

  /* hood */

  ctx.fillStyle="#0d47a1";

  ctx.fillRect(-13,-28,26,16);

  /* windshield */

  ctx.fillStyle="#9ed9ff";

  ctx.fillRect(-11,-8,22,15);

  /* rear window */

  ctx.fillRect(-11,12,22,10);

  /* headlights */

  ctx.fillStyle="#fff6a8";

  ctx.fillRect(-12,-31,8,4);

  ctx.fillRect(4,-31,8,4);

  ctx.restore();

}

function gameLoop(){

  update();

  ctx.clearRect(

    0,

    0,

    canvas.width,

    canvas.height

  );

  drawCity(car.x,car.y);

  drawCar();

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>

</html>
