<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Utica Drive</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="game"></div>

  <div id="hud">
    <div id="cityName">UTICA, NEW YORK</div>
    <div id="modeText">WALKING</div>
    <div id="speedText">0 MPH</div>
  </div>

  <div id="message">
    WALK TO THE CAR
  </div>

  <div id="controls">

    <button
      id="upBtn"
      class="control-btn up"
      aria-label="Forward"
    >
      ▲
    </button>

    <button
      id="leftBtn"
      class="control-btn left"
      aria-label="Left"
    >
      ◀
    </button>

    <button
      id="rightBtn"
      class="control-btn right"
      aria-label="Right"
    >
      ▶
    </button>

    <button
      id="downBtn"
      class="control-btn down"
      aria-label="Reverse"
    >
      ▼
    </button>

  </div>

  <button id="actionBtn">
    DRIVE
  </button>

  <div id="loading">
    LOADING UTICA...
  </div>

  <div id="errorBox"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
