<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no,
    viewport-fit=cover"
  >

  <title>Utica Drive</title>

  <link rel="stylesheet" href="./style.css?v=10">
</head>

<body>

<canvas id="game"></canvas>

<div id="loading">
  <h1>UTICA DRIVE</h1>
  <div id="loadingText">Starting game...</div>
</div>

<div id="errorBox"></div>

<div id="hud">
  <div>UTICA, NEW YORK</div>
  <div id="street">GENESEE STREET</div>

  <div>$ <span id="money">00000500</span></div>

  <div>❤️ 100</div>

  <div>☆☆☆☆☆</div>

  <div>🔫 12 / 48</div>

  <br>

  <div>MAIN MISSION</div>
  <div id="mission">Find your M4</div>

  <div>
    <span id="speed">0</span> MPH
  </div>
</div>

<div id="controls">

  <div id="joystick">
    <div id="stick"></div>
  </div>

  <button id="enterBtn">
    🚘 ENTER
  </button>

  <button id="runBtn">
    🏃
  </button>

  <button id="attackBtn">
    👊
  </button>

  <button id="reverseBtn">
    REVERSE
  </button>

  <button id="gasBtn">
    GAS
  </button>

</div>

<script>
window.addEventListener("error", function(e) {
  const box = document.getElementById("errorBox");

  box.style.display = "block";

  box.innerHTML =
    "GAME ERROR:<br>" +
    e.message +
    "<br><br>Refresh the page.";
});

window.addEventListener(
  "unhandledrejection",
  function(e) {

    const box =
    document.getElementById("errorBox");

    box.style.display =
    "block";

    box.innerHTML =
    "GAME ERROR:<br>" +
    e.reason;

  }
);
</script>

<script
  type="module"
  src="./app.js?v=10">
</script>

</body>
</html>
