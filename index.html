<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"

        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Utica Open World</title>

  <link

    href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"

    rel="stylesheet"

  />

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

  <style>

    html, body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: #000;

      touch-action: none;

      font-family: Arial, sans-serif;

    }

    #map {

      position: absolute;

      inset: 0;

    }

    #hud {

      position: absolute;

      top: 14px;

      left: 14px;

      z-index: 10;

      color: white;

      background: rgba(0,0,0,.55);

      padding: 10px 14px;

      border-radius: 12px;

      font-size: 14px;

      line-height: 1.5;

      backdrop-filter: blur(5px);

    }

    #title {

      font-size: 19px;

      font-weight: bold;

    }

    #car {

      position: absolute;

      left: 50%;

      top: 50%;

      width: 25px;

      height: 46px;

      transform: translate(-50%, -50%);

      z-index: 8;

      pointer-events: none;

    }

    .car-body {

      position: absolute;

      width: 100%;

      height: 100%;

      background: #1687ff;

      border-radius: 7px 7px 5px 5px;

      box-shadow: 0 0 8px rgba(0,0,0,.8);

    }

    .windshield {

      position: absolute;

      left: 4px;

      top: 9px;

      width: 17px;

      height: 10px;

      background: #142536;

      border-radius: 3px;

    }

    .rearwindow {

      position: absolute;

      left: 4px;

      bottom: 8px;

      width: 17px;

      height: 9px;

      background: #142536;

      border-radius: 3px;

    }

    .light {

      position: absolute;

      width: 5px;

      height: 3px;

      background: #fff6a0;

      top: 1px;

    }

    .light.left { left: 3px; }

    .light.right { right: 3px; }

    #controls {

      position: absolute;

      inset: 0;

      z-index: 20;

      pointer-events: none;

    }

    .btn {

      position: absolute;

      width: 74px;

      height: 74px;

      border-radius: 50%;

      border: 2px solid rgba(255,255,255,.75);

      color: white;

      background: rgba(0,0,0,.46);

      font-size: 34px;

      font-weight: bold;

      display: flex;

      justify-content: center;

      align-items: center;

      user-select: none;

      -webkit-user-select: none;

      touch-action: none;

      pointer-events: auto;

      box-shadow: 0 3px 12px rgba(0,0,0,.3);

    }

    .btn.active {

      background: rgba(30,140,255,.75);

      transform: scale(.95);

    }

    #left {

      left: 20px;

      bottom: 35px;

    }

    #right {

      left: 105px;

      bottom: 35px;

    }

    #forward {

      right: 28px;

      bottom: 115px;

    }

    #back {

      right: 28px;

      bottom: 30px;

    }

    #speedBox {

      position: absolute;

      right: 15px;

      top: 15px;

      color: white;

      background: rgba(0,0,0,.55);

      padding: 10px 14px;

      border-radius: 12px;

      z-index: 10;

      text-align: right;

    }

    #speed {

      font-size: 25px;

      font-weight: bold;

    }

    #status {

      font-size: 11px;

      opacity: .8;

    }

    .maplibregl-ctrl-bottom-right {

      bottom: 2px;

    }

  </style>

</head>

<body>

<div id="map"></div>

<div id="hud">

  <div id="title">UTICA</div>

  Cash: $500<br>

  Wanted: ☆☆☆☆☆

</div>

<div id="speedBox">

  <div><span id="speed">0</span> MPH</div>

  <div id="status">Utica, New York</div>

</div>

<div id="car">

  <div class="car-body"></div>

  <div class="windshield"></div>

  <div class="rearwindow"></div>

  <div class="light left"></div>

  <div class="light right"></div>

</div>

<div id="controls">

  <div class="btn" id="left">◀</div>

  <div class="btn" id="right">▶</div>

  <div class="btn" id="forward">▲</div>

  <div class="btn" id="back">▼</div>

</div>

<script>

  // Downtown Utica, New York

  let longitude = -75.2327;

  let latitude = 43.1009;

  let heading = 0;

  let speed = 0;

  const keys = {

    forward: false,

    back: false,

    left: false,

    right: false

  };

  const map = new maplibregl.Map({

    container: "map",

    style: "https://tiles.openfreemap.org/styles/liberty",

    center: [longitude, latitude],

    zoom: 17,

    pitch: 60,

    bearing: 0,

    attributionControl: true

  });

  map.dragPan.disable();

  map.scrollZoom.disable();

  map.boxZoom.disable();

  map.doubleClickZoom.disable();

  map.keyboard.disable();

  map.touchZoomRotate.disable();

  map.on("load", () => {

    // Attempt to turn mapped buildings into 3D buildings.

    const layers = map.getStyle().layers;

    let labelLayerId;

    for (const layer of layers) {

      if (

        layer.type === "symbol" &&

        layer.layout &&

        layer.layout["text-field"]

      ) {

        labelLayerId = layer.id;

        break;

      }

    }

    try {

      map.addLayer(

        {

          id: "utica-3d-buildings",

          source: "openmaptiles",

          "source-layer": "building",

          filter: ["!=", ["get", "hide_3d"], true],

          type: "fill-extrusion",

          minzoom: 14,

          paint: {

            "fill-extrusion-color": [

              "interpolate",

              ["linear"],

              ["get", "render_height"],

              0, "#cfcfcf",

              50, "#b5b5b5",

              150, "#999999"

            ],

            "fill-extrusion-height": [

              "coalesce",

              ["get", "render_height"],

              8

            ],

            "fill-extrusion-base": [

              "coalesce",

              ["get", "render_min_height"],

              0

            ],

            "fill-extrusion-opacity": 0.9

          }

        },

        labelLayerId

      );

    } catch (err) {

      console.log("3D buildings unavailable:", err);

    }

  });

  function setupButton(id, key) {

    const button = document.getElementById(id);

    function press(e) {

      e.preventDefault();

      keys[key] = true;

      button.classList.add("active");

    }

    function release(e) {

      if (e) e.preventDefault();

      keys[key] = false;

      button.classList.remove("active");

    }

    button.addEventListener("touchstart", press, { passive: false });

    button.addEventListener("touchend", release, { passive: false });

    button.addEventListener("touchcancel", release, { passive: false });

    button.addEventListener("pointerdown", press);

    button.addEventListener("pointerup", release);

    button.addEventListener("pointercancel", release);

    button.addEventListener("pointerleave", release);

    button.addEventListener("mousedown", press);

    button.addEventListener("mouseup", release);

  }

  setupButton("forward", "forward");

  setupButton("back", "back");

  setupButton("left", "left");

  setupButton("right", "right");

  document.addEventListener("touchmove", e => {

    e.preventDefault();

  }, { passive: false });

  function gameLoop() {

    if (keys.forward) {

      speed += 0.035;

    }

    if (keys.back) {

      speed -= 0.045;

    }

    if (!keys.forward && !keys.back) {

      speed *= 0.965;

    }

    speed = Math.max(-0.45, Math.min(speed, 1.0));

    if (Math.abs(speed) < 0.002) {

      speed = 0;

    }

    if (Math.abs(speed) > 0.015) {

      const steeringPower =

        Math.min(Math.abs(speed) * 2.2, 1);

      if (keys.left) {

        heading -= 1.45 * steeringPower *

          (speed >= 0 ? 1 : -1);

      }

      if (keys.right) {

        heading += 1.45 * steeringPower *

          (speed >= 0 ? 1 : -1);

      }

    }

    const radians = heading * Math.PI / 180;

    const movement = speed * 0.0000045;

    latitude += Math.cos(radians) * movement;

    longitude += Math.sin(radians) * movement /

      Math.cos(latitude * Math.PI / 180);

    map.jumpTo({

      center: [longitude, latitude],

      bearing: heading,

      pitch: 60

    });

    document.getElementById("speed").textContent =

      Math.round(Math.abs(speed) * 65);

    requestAnimationFrame(gameLoop);

  }

  gameLoop();

</script>

</body>

</html>
