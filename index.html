<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Utica Drive</title>

  <style>

    html, body {

      margin: 0;

      padding: 0;

      overflow: hidden;

      background: #111;

      font-family: Arial, sans-serif;

      touch-action: none;

    }

    canvas {

      display: block;

    }

    #hud {

      position: fixed;

      top: 12px;

      left: 12px;

      z-index: 10;

      color: white;

      background: rgba(0,0,0,0.55);

      padding: 10px 14px;

      border-radius: 12px;

      font-size: 16px;

      line-height: 1.5;

      backdrop-filter: blur(5px);

    }

    #wanted {

      color: #ffd54a;

      letter-spacing: 3px;

    }

    .control {

      position: fixed;

      z-index: 20;

      width: 76px;

      height: 76px;

      border-radius: 50%;

      border: 2px solid rgba(255,255,255,0.65);

      background: rgba(30,30,30,0.6);

      color: white;

      font-size: 30px;

      display: flex;

      align-items: center;

      justify-content: center;

      user-select: none;

      -webkit-user-select: none;

      backdrop-filter: blur(5px);

    }

    #left {

      left: 18px;

      bottom: 26px;

    }

    #right {

      left: 110px;

      bottom: 26px;

    }

    #gas {

      right: 18px;

      bottom: 112px;

      background: rgba(0,120,0,0.65);

    }

    #brake {

      right: 18px;

      bottom: 26px;

      background: rgba(160,0,0,0.65);

    }

    #message {

      position: fixed;

      top: 100px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 30;

      color: white;

      background: rgba(0,0,0,0.7);

      padding: 12px 18px;

      border-radius: 12px;

      font-size: 18px;

      display: none;

    }

  </style>

</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div>Speed: <span id="speed">0</span> mph</div>

  <div>Cash: $<span id="cash">500</span></div>

  <div>Wanted: <span id="wanted">☆☆☆☆☆</span></div>

</div>

<div id="message"></div>

<div id="left" class="control">◀</div>

<div id="right" class="control">▶</div>

<div id="gas" class="control">▲</div>

<div id="brake" class="control">▼</div>

<script>

const canvas = document.getElementById("game");

const ctx = canvas.getContext("2d");

function resize() {

  canvas.width = innerWidth;

  canvas.height = innerHeight;

}

resize();

addEventListener("resize", resize);

const keys = {

  left: false,

  right: false,

  gas: false,

  brake: false

};

function bindButton(id, key) {

  const el = document.getElementById(id);

  const start = e => {

    e.preventDefault();

    keys[key] = true;

  };

  const end = e => {

    e.preventDefault();

    keys[key] = false;

  };

  el.addEventListener("touchstart", start, { passive: false });

  el.addEventListener("touchend", end, { passive: false });

  el.addEventListener("touchcancel", end, { passive: false });

  el.addEventListener("mousedown", start);

  el.addEventListener("mouseup", end);

  el.addEventListener("mouseleave", end);

}

bindButton("left", "left");

bindButton("right", "right");

bindButton("gas", "gas");

bindButton("brake", "brake");

addEventListener("keydown", e => {

  if (e.key === "ArrowLeft") keys.left = true;

  if (e.key === "ArrowRight") keys.right = true;

  if (e.key === "ArrowUp") keys.gas = true;

  if (e.key === "ArrowDown") keys.brake = true;

});

addEventListener("keyup", e => {

  if (e.key === "ArrowLeft") keys.left = false;

  if (e.key === "ArrowRight") keys.right = false;

  if (e.key === "ArrowUp") keys.gas = false;

  if (e.key === "ArrowDown") keys.brake = false;

});

const world = {

  width: 3000,

  height: 3000

};

const car = {

  x: 1500,

  y: 1500,

  angle: -Math.PI / 2,

  speed: 0,

  width: 28,

  height: 50,

  maxSpeed: 10,

  reverseSpeed: -4,

  accel: 0.18,

  brake: 0.25,

  friction: 0.05,

  turnSpeed: 0.045

};

let cash = 500;

let wanted = 0;

let crashCooldown = 0;

const roads = [];

for (let x = 200; x < world.width; x += 400) {

  roads.push({

    x: x,

    y: 0,

    w: 170,

    h: world.height

  });

}

for (let y = 200; y < world.height; y += 400) {

  roads.push({

    x: 0,

    y: y,

    w: world.width,

    h: 170

  });

}

const buildings = [];

for (let gx = 0; gx < world.width; gx += 400) {

  for (let gy = 0; gy < world.height; gy += 400) {

    const positions = [

      {x: gx + 20, y: gy + 20, w: 150, h: 150},

      {x: gx + 200, y: gy + 20, w: 170, h: 150},

      {x: gx + 20, y: gy + 200, w: 150, h: 170},

      {x: gx + 200, y: gy + 200, w: 170, h: 170}

    ];

    for (const b of positions) {

      buildings.push(b);

    }

  }

}

const police = [];

function spawnPolice() {

  const angle = Math.random() * Math.PI * 2;

  police.push({

    x: car.x + Math.cos(angle) * 500,

    y: car.y + Math.sin(angle) * 500,

    angle: 0,

    speed: 3

  });

}

function addWanted() {

  if (wanted < 5) {

    wanted++;

    showMessage("Police alerted!");

  }

  while (police.length < wanted * 2) {

    spawnPolice();

  }

}

function showMessage(text) {

  const box = document.getElementById("message");

  box.textContent = text;

  box.style.display = "block";

  clearTimeout(showMessage.timer);

  showMessage.timer = setTimeout(() => {

    box.style.display = "none";

  }, 1500);

}

function isOnRoad(x, y) {

  return roads.some(r =>

    x > r.x &&

    x < r.x + r.w &&

    y > r.y &&

    y < r.y + r.h

  );

}

function hitsBuilding(x, y) {

  return buildings.some(b =>

    x > b.x &&

    x < b.x + b.w &&

    y > b.y &&

    y < b.y + b.h

  );

}

function updateCar() {

  if (keys.gas) {

    car.speed += car.accel;

  }

  if (keys.brake) {

    car.speed -= car.brake;

  }

  if (!keys.gas && !keys.brake) {

    if (car.speed > 0) {

      car.speed -= car.friction;

      if (car.speed < 0) car.speed = 0;

    }

    if (car.speed < 0) {

      car.speed += car.friction;

      if (car.speed > 0) car.speed = 0;

    }

  }

  car.speed = Math.min(car.maxSpeed, car.speed);

  car.speed = Math.max(car.reverseSpeed, car.speed);

  if (!isOnRoad(car.x, car.y)) {

    car.speed *= 0.97;

  }

  if (Math.abs(car.speed) > 0.2) {

    const steering =

      car.turnSpeed *

      Math.min(Math.abs(car.speed) / 3, 1);

    if (keys.left) {

      car.angle -= steering * Math.sign(car.speed);

    }

    if (keys.right) {

      car.angle += steering * Math.sign(car.speed);

    }

  }

  const oldX = car.x;

  const oldY = car.y;

  car.x += Math.sin(car.angle) * car.speed;

  car.y -= Math.cos(car.angle) * car.speed;

  if (

    car.x < 0 ||

    car.x > world.width ||

    car.y < 0 ||

    car.y > world.height ||

    hitsBuilding(car.x, car.y)

  ) {

    car.x = oldX;

    car.y = oldY;

    if (crashCooldown <= 0 && Math.abs(car.speed) > 3) {

      addWanted();

      crashCooldown = 60;

    }

    car.speed *= -0.25;

  }

  if (crashCooldown > 0) crashCooldown--;

}

function updatePolice() {

  for (const p of police) {

    const dx = car.x - p.x;

    const dy = car.y - p.y;

    const distance = Math.hypot(dx, dy);

    p.angle = Math.atan2(dx, -dy);

    p.x += Math.sin(p.angle) * p.speed;

    p.y -= Math.cos(p.angle) * p.speed;

    if (distance < 38) {

      car.speed *= 0.92;

      if (Math.random() < 0.01) {

        cash = Math.max(0, cash - 100);

        wanted = Math.max(0, wanted - 1);

        police.splice(

          Math.max(0, police.indexOf(p)),

          1

        );

        showMessage("Busted! -$100");

        break;

      }

    }

  }

  while (police.length > wanted * 2) {

    police.pop();

  }

}

function drawRoads(cameraX, cameraY) {

  ctx.fillStyle = "#417d3c";

  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const r of roads) {

    ctx.fillStyle = "#444";

    ctx.fillRect(

      r.x - cameraX,

      r.y - cameraY,

      r.w,

      r.h

    );

    ctx.strokeStyle = "#777";

    ctx.lineWidth = 3;

    ctx.setLineDash([25, 25]);

    if (r.w > r.h) {

      ctx.beginPath();

      ctx.moveTo(

        r.x - cameraX,

        r.y + r.h / 2 - cameraY

      );

      ctx.lineTo(

        r.x + r.w - cameraX,

        r.y + r.h / 2 - cameraY

      );

      ctx.stroke();

    } else {

      ctx.beginPath();

      ctx.moveTo(

        r.x + r.w / 2 - cameraX,

        r.y - cameraY

      );

      ctx.lineTo(

        r.x + r.w / 2 - cameraX,

        r.y + r.h - cameraY

      );

      ctx.stroke();

    }

    ctx.setLineDash([]);

  }

}

function drawBuildings(cameraX, cameraY) {

  for (const b of buildings) {

    const bx = b.x - cameraX;

    const by = b.y - cameraY;

    if (

      bx > canvas.width ||

      by > canvas.height ||

      bx + b.w < 0 ||

      by + b.h < 0

    ) continue;

    ctx.fillStyle = "#666";

    ctx.fillRect(bx, by, b.w, b.h);

    ctx.fillStyle = "#888";

    ctx.fillRect(

      bx + 7,

      by + 7,

      b.w - 14,

      b.h - 14

    );

    ctx.strokeStyle = "#444";

    ctx.lineWidth = 3;

    ctx.strokeRect(bx, by, b.w, b.h);

  }

}

function drawCar(cameraX, cameraY) {

  const x = car.x - cameraX;

  const y = car.y - cameraY;

  ctx.save();

  ctx.translate(x, y);

  ctx.rotate(car.angle);

  ctx.fillStyle = "#1e90ff";

  ctx.fillRect(

    -car.width / 2,

    -car.height / 2,

    car.width,

    car.height

  );

  ctx.fillStyle = "#bfe5ff";

  ctx.fillRect(

    -car.width / 2 + 5,

    -car.height / 2 + 8,

    car.width - 10,

    12

  );

  ctx.fillStyle = "#111";

  ctx.fillRect(

    -car.width / 2 - 3,

    -18,

    5,

    14

  );

  ctx.fillRect(

    car.width / 2 - 2,

    -18,

    5,

    14

  );

  ctx.fillRect(

    -car.width / 2 - 3,

    7,

    5,

    14

  );

  ctx.fillRect(

    car.width / 2 - 2,

    7,

    5,

    14

  );

  ctx.restore();

}

function drawPolice(cameraX, cameraY) {

  for (const p of police) {

    const x = p.x - cameraX;

    const y = p.y - cameraY;

    ctx.save();

    ctx.translate(x, y);

    ctx.rotate(p.angle);

    ctx.fillStyle = "white";

    ctx.fillRect(-14, -24, 28, 48);

    ctx.fillStyle = "#111";

    ctx.fillRect(-10, -12, 20, 18);

    ctx.fillStyle = "red";

    ctx.fillRect(-10, -27, 8, 5);

    ctx.fillStyle = "blue";

    ctx.fillRect(2, -27, 8, 5);

    ctx.restore();

  }

}

function updateHUD() {

  document.getElementById("speed").textContent =

    Math.round(Math.abs(car.speed) * 7);

  document.getElementById("cash").textContent =

    cash;

  document.getElementById("wanted").textContent =

    "★".repeat(wanted) +

    "☆".repeat(5 - wanted);

}

function loop() {

  updateCar();

  updatePolice();

  const cameraX =

    car.x - canvas.width / 2;

  const cameraY =

    car.y - canvas.height / 2;

  drawRoads(cameraX, cameraY);

  drawBuildings(cameraX, cameraY);

  drawPolice(cameraX, cameraY);

  drawCar(cameraX, cameraY);

  updateHUD();

  requestAnimationFrame(loop);

}

loop();

</script>

</body>

</html>
