<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"

        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Utica Drive</title>

  <link rel="stylesheet" href="style.css" />

  <script type="importmap">

  {

    "imports": {

      "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"

    }

  }

  </script>

</head>

<body>

  <div id="hud">

    <div id="location">UTICA, NEW YORK</div>

    <div id="mode">DRIVING</div>

    <div id="speed">0 MPH</div>

  </div>

  <button id="exitButton">EXIT</button>

  <div id="steering">

    <button id="leftButton">◀</button>

    <button id="rightButton">▶</button>

  </div>

  <div id="pedControls">

    <button id="walkLeft">◀</button>

    <button id="walkForward">▲</button>

    <button id="walkRight">▶</button>

  </div>

  <div id="pedBackControls">

    <button id="walkBack">▼</button>

  </div>

  <div id="driveControls">

    <button id="gasButton">GAS</button>

    <div id="secondaryDriveControls">

      <button id="brakeButton">BRAKE</button>

      <button id="reverseButton">REVERSE</button>

    </div>

  </div>

  <div id="enterVehicleText">TAP DRIVE TO ENTER VEHICLE</div>

  <button id="enterVehicleButton">DRIVE</button>

  <script type="module" src="app.js"></script>

</body>

</html>
