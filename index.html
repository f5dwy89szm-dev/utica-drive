<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#101820" />

  <title>Utica Drive</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div id="game"></div>

  <!-- HUD -->
  <div id="hud">
    <div id="location">UTICA, NEW YORK</div>

    <div id="modeText">WALKING</div>

    <div id="speedText">0 MPH</div>
  </div>

  <!-- WALK CONTROLS -->
  <div id="walkControls">

    <div class="joystick-area">
      <button id="walkForward" class="controlButton arrow up">▲</button>

      <div class="middleRow">
        <button id="walkLeft" class="controlButton arrow">◀</button>
        <button id="walkRight" class="controlButton arrow">▶</button>
      </div>

      <button id="walkBack" class="controlButton arrow down">▼</button>
    </div>

    <button id="driveButton" class="actionButton">
      DRIVE
    </button>

  </div>

  <!-- CAR CONTROLS -->
  <div id="carControls" class="hidden">

    <button id="exitButton" class="actionButton exitButton">
      EXIT
    </button>

    <div class="steering">
      <button id="steerLeft" class="controlButton">
        ◀
      </button>

      <button id="steerRight" class="controlButton">
        ▶
      </button>
    </div>

    <div class="pedals">

      <button id="gasButton" class="pedal gas">
        GAS
      </button>

      <button id="brakeButton" class="pedal brake">
        BRAKE
      </button>

      <button id="reverseButton" class="pedal reverse">
        REVERSE
      </button>

    </div>

  </div>

  <div id="message">
    WALK TO THE CAR
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>

  <script src="app.js"></script>

</body>
</html>
