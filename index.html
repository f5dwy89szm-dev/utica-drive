<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Utica Drive</title>

<style>

html,body{

  margin:0;

  padding:0;

  width:100%;

  height:100%;

  overflow:hidden;

  background:#111;

  touch-action:none;

  font-family:Arial,Helvetica,sans-serif;

}

canvas{

  display:block;

  position:fixed;

  inset:0;

}

#hud{

  position:fixed;

  top:calc(env(safe-area-inset-top) + 22px);

  left:20px;

  right:20px;

  z-index:20;

  display:flex;

  justify-content:space-between;

  color:white;

  font-weight:900;

  font-size:19px;

  text-shadow:0 2px 5px #000;

  pointer-events:none;

}

#status{

  position:fixed;

  top:calc(env(safe-area-inset-top) + 55px);

  left:20px;

  color:#ddd;

  z-index:20;

  font-size:12px;

  pointer-events:none;

}

.control{

  position:fixed;

  z-index:30;

  width:74px;

  height:74px;

  border-radius:50%;

  border:3px solid rgba(255,255,255,.42);

  background:rgba(0,0,0,.50);

  color:white;

  font-size:31px;

  font-weight:bold;

  display:flex;

  align-items:center;

  justify-content:center;

  user-select:none;

  -webkit-user-select:none;

  touch-action:none;

}

.control.active{

  background:rgba(255,255,255,.22);

  transform:scale(.96);

}

#left{

  left:18px;

  bottom:calc(env(safe-area-inset-bottom) + 90px);

}

#right{

  left:104px;

  bottom:calc(env(safe-area-inset-bottom) + 90px);

}

#gas{

  right:18px;

  bottom:calc(env(safe-area-inset-bottom) + 176px);

}

#brake{

  right:18px;

  bottom:calc(env(safe-area-inset-bottom) + 90px);

}

.rectButton{

  position:fixed;

  bottom:calc(env(safe-area-inset-bottom) + 90px);

  height:50px;

  min-width:96px;

  padding:0 14px;

  border-radius:18px;

  border:3px solid rgba(255,255,255,.38);

  background:rgba(0,0,0,.55);

  color:white;

  font-size:16px;

  font-weight:bold;

  z-index:31;

  touch-action:none;

}

#exit{

  left:50%;

  transform:translateX(-105%);

}

#reverse{

  left:50%;

  transform:translateX(5%);

}

#message{

  position:fixed;

  left:50%;

  top:50%;

  transform:translate(-50%,-50%);

  color:white;

  background:rgba(0,0,0,.72);

  padding:12px 18px;

  border-radius:12px;

  font-weight:bold;

  display:none;

  z-index:50;

  text-align:center;

}

</style>

</head>

<body>

<div id="hud">

  <span>UTICA, NEW YORK</span>

  <span id="speed">0 MPH</span>

</div>

<div id="status">DRIVE</div>

<button class="control" id="left">◀</button>

<button class="control" id="right">▶</button>

<button class="control" id="gas">▲</button>

<button class="control" id="brake">▼</button>

<button class="rectButton" id="exit">EXIT</button>

<button class="rectButton" id="reverse">REVERSE</button>

<div id="message"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

<script>

(function(){

if(typeof THREE === "undefined"){

  document.getElementById("message").style.display="block";

  document.getElementById("message").innerHTML=

  "3D engine did not load.<br>Refresh the page.";

  return;

}

/* -----------------------------

   BASIC WORLD

------------------------------ */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87bde8);

scene.fog = new THREE.Fog(0x87bde8,120,700);

const camera = new THREE.PerspectiveCamera(

  65,

  innerWidth/innerHeight,

  .1,

  1500

);

const renderer = new THREE.WebGLRenderer({

  antialias:true,

  powerPreference:"high-performance"

});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));

renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.prepend(renderer.domElement);

/* -----------------------------

   LIGHTING

------------------------------ */

const hemi = new THREE.HemisphereLight(

  0xd8ecff,

  0x526347,

  2

);

scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff,2.8);

sun.position.set(120,200,70);

sun.castShadow=true;

sun.shadow.mapSize.width=1024;

sun.shadow.mapSize.height=1024;

sun.shadow.camera.left=-180;

sun.shadow.camera.right=180;

sun.shadow.camera.top=180;

sun.shadow.camera.bottom=-180;

scene.add(sun);

/* -----------------------------

   GROUND

------------------------------ */

const grassMaterial =

new THREE.MeshStandardMaterial({

  color:0x658a52,

  roughness:1

});

const ground =

new THREE.Mesh(

  new THREE.PlaneGeometry(1200,1200),

  grassMaterial

);

ground.rotation.x=-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);

/* -----------------------------

   ROADS

------------------------------ */

const roadMaterial =

new THREE.MeshStandardMaterial({

  color:0x303236,

  roughness:.95

});

function makeRoad(x,z,w,h){

  const road =

  new THREE.Mesh(

    new THREE.PlaneGeometry(w,h),

    roadMaterial

  );

  road.rotation.x=-Math.PI/2;

  road.position.set(x,.025,z);

  road.receiveShadow=true;

  scene.add(road);

}

for(let x=-360;x<=360;x+=90){

  makeRoad(x,0,22,800);

}

for(let z=-360;z<=360;z+=90){

  makeRoad(0,z,800,22);

}

/* -----------------------------

   ROAD LINES

------------------------------ */

const lineMaterial =

new THREE.MeshBasicMaterial({

  color:0xffd74a

});

function roadLine(x,z,w,h){

  const line =

  new THREE.Mesh(

    new THREE.PlaneGeometry(w,h),

    lineMaterial

  );

  line.rotation.x=-Math.PI/2;

  line.position.set(x,.04,z);

  scene.add(line);

}

for(let x=-360;x<=360;x+=90){

  for(let z=-380;z<=380;z+=18){

    roadLine(x,z,0.28,9);

  }

}

for(let z=-360;z<=360;z+=90){

  for(let x=-380;x<=380;x+=18){

    roadLine(x,z,9,.28);

  }

}

/* -----------------------------

   SIDEWALKS

------------------------------ */

const sidewalkMat =

new THREE.MeshStandardMaterial({

  color:0xa6a6a2,

  roughness:1

});

function sidewalk(x,z,w,d){

  const s =

  new THREE.Mesh(

    new THREE.BoxGeometry(w,.25,d),

    sidewalkMat

  );

  s.position.set(x,.12,z);

  s.receiveShadow=true;

  scene.add(s);

}

/* -----------------------------

   BUILDINGS

------------------------------ */

const buildingColors=[

  0xc5ab89,

  0xa99785,

  0xc9c3b5,

  0x8b7468,

  0xbb9278,

  0xd0bda7,

  0x787d82

];

function building(x,z,w,d,h){

  sidewalk(x,z,w+5,d+5);

  const mat =

  new THREE.MeshStandardMaterial({

    color:

    buildingColors[

      Math.floor(

        Math.random()*buildingColors.length

      )

    ],

    roughness:.8

  });

  const b =

  new THREE.Mesh(

    new THREE.BoxGeometry(w,h,d),

    mat

  );

  b.position.set(x,h/2+.3,z);

  b.castShadow=true;

  b.receiveShadow=true;

  scene.add(b);

  /* roof */

  const roof =

  new THREE.Mesh(

    new THREE.BoxGeometry(

      w+1,

      .6,

      d+1

    ),

    new THREE.MeshStandardMaterial({

      color:0x4e4b49

    })

  );

  roof.position.set(

    x,

    h+.5,

    z

  );

  roof.castShadow=true;

  scene.add(roof);

  /* windows */

  const windowMat =

  new THREE.MeshStandardMaterial({

    color:0x92b5ca,

    emissive:0x11202a,

    roughness:.3

  });

  const floors=

  Math.max(

    1,

    Math.floor(h/4)

  );

  for(let floor=1;floor<floors;floor++){

    for(let xx=-w/2+3;xx<w/2-1;xx+=4){

      const window =

      new THREE.Mesh(

        new THREE.PlaneGeometry(1.8,1.6),

        windowMat

      );

      window.position.set(

        x+xx,

        floor*4,

        z+d/2+.012

      );

      scene.add(window);

    }

  }

}

/* downtown-style blocks */

for(let x=-315;x<=315;x+=90){

  for(let z=-315;z<=315;z+=90){

    const nearRoadX =

      Math.abs(x%90)<18;

    const nearRoadZ =

      Math.abs(z%90)<18;

    if(

      Math.abs(x)<35 &&

      Math.abs(z)<35

    ) continue;

    const count =

      Math.random()>.45 ? 2 : 1;

    for(let i=0;i<count;i++){

      let bx=x+(Math.random()-.5)*34;

      let bz=z+(Math.random()-.5)*34;

      let w=25+Math.random()*20;

      let d=25+Math.random()*20;

      let downtown =

        Math.abs(x)<160 &&

        Math.abs(z)<160;

      let h = downtown

        ? 28+Math.random()*65

        : 10+Math.random()*22;

      building(

        bx,

        bz,

        w,

        d,

        h

      );

    }

  }

}

/* -----------------------------

   TREES

------------------------------ */

function tree(x,z){

  const trunk =

  new THREE.Mesh(

    new THREE.CylinderGeometry(

      .6,.8,4,8

    ),

    new THREE.MeshStandardMaterial({

      color:0x704629

    })

  );

  trunk.position.set(x,2,z);

  trunk.castShadow=true;

  scene.add(trunk);

  const leaves =

  new THREE.Mesh(

    new THREE.SphereGeometry(

      2.8,

      10,

      8

    ),

    new THREE.MeshStandardMaterial({

      color:0x2d773d

    })

  );

  leaves.position.set(

    x,

    5.2,

    z

  );

  leaves.castShadow=true;

  scene.add(leaves);

}

for(let i=0;i<90;i++){

  let x=

    THREE.MathUtils.randFloatSpread(700);

  let z=

    THREE.MathUtils.randFloatSpread(700);

  let roadX =

    Math.abs(

      ((x+45)%90)-45

    )<18;

  let roadZ =

    Math.abs(

      ((z+45)%90)-45

    )<18;

  if(!roadX && !roadZ){

    tree(x,z);

  }

}

/* -----------------------------

   PLAYER CAR

------------------------------ */

const car = new THREE.Group();

const carBody =

new THREE.Mesh(

  new THREE.BoxGeometry(

    2.3,

    .8,

    4.8

  ),

  new THREE.MeshStandardMaterial({

    color:0x2255cc,

    metalness:.45,

    roughness:.28

  })

);

carBody.position.y=1;

carBody.castShadow=true;

car.add(carBody);

const cabin =

new THREE.Mesh(

  new THREE.BoxGeometry(

    1.9,

    .7,

    2.3

  ),

  new THREE.MeshStandardMaterial({

    color:0x18222d,

    metalness:.25,

    roughness:.2

  })

);

cabin.position.set(

  0,

  1.65,

  -.2

);

cabin.castShadow=true;

car.add(cabin);

const wheelMat =

new THREE.MeshStandardMaterial({

  color:0x101010

});

function wheel(x,z){

  const w =

  new THREE.Mesh(

    new THREE.CylinderGeometry(

      .45,

      .45,

      .35,

      16

    ),

    wheelMat

  );

  w.rotation.z=Math.PI/2;

  w.position.set(

    x,

    .58,

    z

  );

  w.castShadow=true;

  car.add(w);

}

wheel(-1.15,1.45);

wheel(1.15,1.45);

wheel(-1.15,-1.45);

wheel(1.15,-1.45);

car.position.set(0,.05,45);

scene.add(car);

/* -----------------------------

   CHARACTER

------------------------------ */

const player =

new THREE.Group();

const legsMat =

new THREE.MeshStandardMaterial({

  color:0x20242b

});

const shirtMat =

new THREE.MeshStandardMaterial({

  color:0x444b54

});

const skinMat =

new THREE.MeshStandardMaterial({

  color:0x9a6746

});

function personPart(

  geometry,

  material,

  x,y,z

){

  const mesh =

  new THREE.Mesh(

    geometry,

    material

  );

  mesh.position.set(x,y,z);

  mesh.castShadow=true;

  player.add(mesh);

  return mesh;

}

personPart(

  new THREE.BoxGeometry(

    1.25,

    1.7,

    .7

  ),

  shirtMat,

  0,

  2.55,

  0

);

personPart(

  new THREE.SphereGeometry(

    .48,

    16,

    12

  ),

  skinMat,

  0,

  3.78,

  0

);

personPart(

  new THREE.BoxGeometry(

    .45,

    1.8,

    .55

  ),

  legsMat,

  -.35,

  1.05,

  0

);

personPart(

  new THREE.BoxGeometry(

    .45,

    1.8,

    .55

  ),

  legsMat,

  .35,

  1.05,

  0

);

player.visible=false;

scene.add(player);

/* -----------------------------

   CONTROLS

------------------------------ */

let gas=false;

let brake=false;

let left=false;

let right=false;

let reverseMode=false;

let driving=true;

let speed=0;

let heading=0;

let playerHeading=0;

let walkSpeed=0;

const speedDisplay=

document.getElementById("speed");

const statusDisplay=

document.getElementById("status");

function bindButton(id,onDown,onUp){

  const el=

  document.getElementById(id);

  function start(e){

    e.preventDefault();

    el.classList.add("active");

    onDown();

  }

  function stop(e){

    if(e) e.preventDefault();

    el.classList.remove("active");

    onUp();

  }

  el.addEventListener(

    "pointerdown",

    start

  );

  el.addEventListener(

    "pointerup",

    stop

  );

  el.addEventListener(

    "pointercancel",

    stop

  );

  el.addEventListener(

    "pointerleave",

    stop

  );

}

bindButton(

  "gas",

  ()=>gas=true,

  ()=>gas=false

);

bindButton(

  "brake",

  ()=>brake=true,

  ()=>brake=false

);

bindButton(

  "left",

  ()=>left=true,

  ()=>left=false

);

bindButton(

  "right",

  ()=>right=true,

  ()=>right=false

);

/* -----------------------------

   REVERSE

------------------------------ */

document

.getElementById("reverse")

.addEventListener(

"pointerdown",

function(e){

  e.preventDefault();

  if(!driving) return;

  reverseMode=!reverseMode;

  this.textContent=

    reverseMode

    ? "DRIVE"

    : "REVERSE";

  statusDisplay.textContent=

    reverseMode

    ? "REVERSE"

    : "DRIVE";

});

/* -----------------------------

   EXIT / ENTER CAR

------------------------------ */

document

.getElementById("exit")

.addEventListener(

"pointerdown",

function(e){

  e.preventDefault();

  if(driving){

    speed=0;

    driving=false;

    player.visible=true;

    player.position.copy(

      car.position

    );

    player.position.x+=3;

    player.rotation.y=

      car.rotation.y;

    this.textContent="ENTER";

    document

    .getElementById("reverse")

    .style.display="none";

    statusDisplay.textContent=

      "ON FOOT";

  }

  else{

    const distance=

      player.position.distanceTo(

        car.position

      );

    if(distance<7){

      driving=true;

      player.visible=false;

      this.textContent="EXIT";

      document

      .getElementById("reverse")

      .style.display="block";

      statusDisplay.textContent=

        reverseMode

        ? "REVERSE"

        : "DRIVE";

    }

    else{

      const msg=

      document.getElementById(

        "message"

      );

      msg.innerHTML=

        "Move closer to your car.";

      msg.style.display=

        "block";

      setTimeout(()=>{

        msg.style.display=

          "none";

      },1200);

    }

  }

});

/* -----------------------------

   PHYSICS

------------------------------ */

const clock =

new THREE.Clock();

function updateCar(dt){

  const acceleration=16;

  const braking=25;

  const drag=5;

  const maxForward=34;

  const maxReverse=14;

  if(gas){

    if(reverseMode){

      speed -=

        acceleration*dt;

    }

    else{

      speed +=

        acceleration*dt;

    }

  }

  if(brake){

    if(speed>0){

      speed -=

        braking*dt;

      if(speed<0)

        speed=0;

    }

    else if(speed<0){

      speed +=

        braking*dt;

      if(speed>0)

        speed=0;

    }

  }

  if(!gas){

    if(speed>0){

      speed -=

        drag*dt;

      if(speed<0)

        speed=0;

    }

    if(speed<0){

      speed +=

        drag*dt;

      if(speed>0)

        speed=0;

    }

  }

  speed=

    THREE.MathUtils.clamp(

      speed,

      -maxReverse,

      maxForward

    );

  const speedFactor=

    Math.min(

      Math.abs(speed)/12,

      1

    );

  let steeringRate=

    1.5*

    speedFactor;

  if(Math.abs(speed)<.5)

    steeringRate=.35;

  if(left){

    heading +=

      steeringRate*

      dt*

      (speed>=0 ? 1 : -1);

  }

  if(right){

    heading -=

      steeringRate*

      dt*

      (speed>=0 ? 1 : -1);

  }

  car.rotation.y=

    heading;

  car.position.x +=

    Math.sin(heading)*

    speed*

    dt;

  car.position.z +=

    Math.cos(heading)*

    speed*

    dt;

  /* small car lean */

  let targetLean=0;

  if(left)

    targetLean=.045;

  if(right)

    targetLean=-.045;

  car.rotation.z +=

    (

      targetLean-

      car.rotation.z

    )*

    Math.min(

      1,

      dt*7

    );

  speedDisplay.textContent=

    Math.round(

      Math.abs(speed)*2.237

    )+

    " MPH";

}

/* -----------------------------

   WALKING

------------------------------ */

function updatePlayer(dt){

  let moving=false;

  if(gas){

    walkSpeed=5.5;

    moving=true;

  }

  else{

    walkSpeed=0;

  }

  if(brake){

    walkSpeed=-3;

    moving=true;

  }

  if(left)

    playerHeading+=

      2.2*dt;

  if(right)

    playerHeading-=

      2.2*dt;

  player.rotation.y=

    playerHeading;

  if(moving){

    player.position.x +=

      Math.sin(

        playerHeading

      )*

      walkSpeed*

      dt;

    player.position.z +=

      Math.cos(

        playerHeading

      )*

      walkSpeed*

      dt;

  }

  speedDisplay.textContent=

    moving

    ? "WALKING"

    : "ON FOOT";

}

/* -----------------------------

   CAMERA

------------------------------ */

const desiredCamera =

new THREE.Vector3();

const lookTarget =

new THREE.Vector3();

function updateCamera(dt){

  if(driving){

    const behind=10;

    const height=5.2;

    desiredCamera.set(

      car.position.x -

        Math.sin(heading)*

        behind,

      car.position.y+

        height,

      car.position.z -

        Math.cos(heading)*

        behind

    );

    camera.position.lerp(

      desiredCamera,

      1-

      Math.pow(.0005,dt)

    );

    lookTarget.set(

      car.position.x +

        Math.sin(heading)*5,

      car.position.y+1,

      car.position.z +

        Math.cos(heading)*5

    );

    camera.lookAt(

      lookTarget

    );

  }

  else{

    const behind=6;

    const height=4;

    desiredCamera.set(

      player.position.x -

        Math.sin(

          playerHeading

        )*

        behind,

      player.position.y+

        height,

      player.position.z -

        Math.cos(

          playerHeading

        )*

        behind

    );

    camera.position.lerp(

      desiredCamera,

      1-

      Math.pow(.0005,dt)

    );

    lookTarget.set(

      player.position.x,

      player.position.y+

        2,

      player.position.z

    );

    camera.lookAt(

      lookTarget

    );

  }

}

/* -----------------------------

   GAME LOOP

------------------------------ */

function animate(){

  requestAnimationFrame(

    animate

  );

  let dt=

    Math.min(

      clock.getDelta(),

      .035

    );

  if(driving)

    updateCar(dt);

  else

    updatePlayer(dt);

  updateCamera(dt);

  renderer.render(

    scene,

    camera

  );

}

camera.position.set(

  0,

  7,

  34

);

animate();

/* -----------------------------

   RESIZE

------------------------------ */

window.addEventListener(

"resize",

()=>{

  camera.aspect=

    innerWidth/

    innerHeight;

  camera

    .updateProjectionMatrix();

  renderer.setSize(

    innerWidth,

    innerHeight

  );

});

})();

</script>

</body>

</html>
