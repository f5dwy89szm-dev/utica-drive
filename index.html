<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1,

maximum-scale=1,

user-scalable=no,

viewport-fit=cover">

<title>Utica Open World 3D V3</title>

<style>

*{

    box-sizing:border-box;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;

}

html,body{

    margin:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#111;

    touch-action:none;

    font-family:Arial,Helvetica,sans-serif;

}

canvas{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    display:block;

}

/* HUD */

#hud{

    position:fixed;

    left:14px;

    top:max(14px,env(safe-area-inset-top));

    z-index:20;

    color:#fff;

    text-shadow:0 2px 6px #000;

    pointer-events:none;

}

#speed{

    font-size:29px;

    font-weight:900;

}

#status{

    font-size:13px;

    margin-top:1px;

}

#surface{

    font-size:11px;

    opacity:.82;

    margin-top:3px;

}

#mission{

    margin-top:8px;

    max-width:235px;

    padding:8px 10px;

    border-radius:10px;

    background:rgba(0,0,0,.46);

    font-size:12px;

    line-height:1.35;

}

#logo{

    position:fixed;

    right:14px;

    top:max(15px,env(safe-area-inset-top));

    color:white;

    z-index:10;

    font-weight:bold;

    font-size:11px;

    letter-spacing:1px;

    opacity:.75;

    text-shadow:0 2px 5px #000;

    pointer-events:none;

}

/* JOYSTICK */

#stickArea{

    position:fixed;

    left:15px;

    bottom:max(22px,env(safe-area-inset-bottom));

    width:158px;

    height:158px;

    z-index:50;

    touch-action:none;

}

#stickBase{

    position:absolute;

    width:122px;

    height:122px;

    left:18px;

    top:18px;

    border-radius:50%;

    background:rgba(18,18,18,.42);

    border:3px solid rgba(255,255,255,.34);

    box-shadow:

        inset 0 0 22px rgba(255,255,255,.07),

        0 5px 15px rgba(0,0,0,.42);

}

#stick{

    position:absolute;

    width:58px;

    height:58px;

    left:50px;

    top:50px;

    border-radius:50%;

    background:rgba(255,255,255,.84);

    border:3px solid rgba(0,0,0,.42);

    box-shadow:0 4px 11px rgba(0,0,0,.45);

    pointer-events:none;

}

/* VEHICLE CONTROLS */

#vehicleControls{

    position:fixed;

    right:12px;

    bottom:max(18px,env(safe-area-inset-bottom));

    width:205px;

    height:205px;

    z-index:50;

}

.ctrl{

    position:absolute;

    border:none;

    color:#fff;

    font-weight:900;

    touch-action:none;

    -webkit-tap-highlight-color:transparent;

    box-shadow:

        inset 0 0 0 2px rgba(255,255,255,.22),

        0 5px 13px rgba(0,0,0,.42);

}

.ctrl:active{

    transform:scale(.95);

}

#gas{

    right:0;

    bottom:0;

    width:92px;

    height:92px;

    border-radius:50%;

    background:rgba(24,166,67,.83);

    font-size:19px;

}

#brake{

    left:30px;

    bottom:3px;

    width:72px;

    height:72px;

    border-radius:50%;

    background:rgba(206,40,40,.84);

    font-size:13px;

}

#reverse{

    left:0;

    top:52px;

    width:72px;

    height:60px;

    border-radius:17px;

    background:rgba(225,126,22,.86);

    font-size:11px;

}

#handbrake{

    right:4px;

    top:7px;

    width:88px;

    height:49px;

    border-radius:15px;

    background:rgba(28,28,28,.82);

    font-size:10px;

}

/* ACTION */

#action{

    position:fixed;

    right:14px;

    top:max(75px,calc(env(safe-area-inset-top) + 58px));

    z-index:100;

    min-width:110px;

    height:49px;

    padding:0 14px;

    border:2px solid rgba(255,255,255,.28);

    border-radius:14px;

    background:rgba(12,12,12,.82);

    color:#fff;

    font-weight:900;

    font-size:13px;

    touch-action:none;

}

/* ON FOOT */

#run{

    display:none;

    position:fixed;

    right:22px;

    bottom:max(34px,env(safe-area-inset-bottom));

    z-index:50;

    width:84px;

    height:84px;

    border:none;

    border-radius:50%;

    background:rgba(38,96,215,.82);

    color:white;

    font-weight:900;

    font-size:16px;

    touch-action:none;

    box-shadow:

        inset 0 0 0 2px rgba(255,255,255,.23),

        0 5px 12px rgba(0,0,0,.45);

}

</style>

</head>

<body>

<div id="hud">

    <div id="speed">0 MPH</div>

    <div id="status">IN VEHICLE</div>

    <div id="surface">ROAD</div>

    <div id="mission">MISSION: Drive to the yellow checkpoint.</div>

</div>

<div id="logo">UTICA OPEN WORLD V3</div>

<div id="stickArea">

    <div id="stickBase"></div>

    <div id="stick"></div>

</div>

<div id="vehicleControls">

    <button id="reverse" class="ctrl">REVERSE</button>

    <button id="handbrake" class="ctrl">HANDBRAKE</button>

    <button id="brake" class="ctrl">BRAKE</button>

    <button id="gas" class="ctrl">GAS</button>

</div>

<button id="run">RUN</button>

<button id="action">EXIT</button>

<script type="module">

import * as THREE

from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =====================================================

   THREE

===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x84b9e2);

scene.fog = new THREE.Fog(

    0x84b9e2,

    210,

    820

);

const camera = new THREE.PerspectiveCamera(

    65,

    innerWidth / innerHeight,

    .1,

    1300

);

const renderer = new THREE.WebGLRenderer({

    antialias:true,

    powerPreference:"high-performance"

});

renderer.setPixelRatio(

    Math.min(devicePixelRatio,1.45)

);

renderer.setSize(

    innerWidth,

    innerHeight

);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.prepend(renderer.domElement);

/* =====================================================

   LIGHT

===================================================== */

scene.add(

    new THREE.HemisphereLight(

        0xd9edff,

        0x50623c,

        2.2

    )

);

const sun = new THREE.DirectionalLight(

    0xffffff,

    2.25

);

sun.position.set(

    -130,

    220,

    130

);

sun.castShadow = true;

sun.shadow.mapSize.set(

    1024,

    1024

);

sun.shadow.camera.left = -180;

sun.shadow.camera.right = 180;

sun.shadow.camera.top = 180;

sun.shadow.camera.bottom = -180;

scene.add(sun);

/* =====================================================

   WORLD

===================================================== */

const WORLD_HALF = 430;

const ROAD_SPACING = 90;

const ROAD_WIDTH = 28;

const ground = new THREE.Mesh(

    new THREE.PlaneGeometry(920,920),

    new THREE.MeshStandardMaterial({

        color:0x5d7f47,

        roughness:1

    })

);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);

/* =====================================================

   ROADS

===================================================== */

const roads = [];

const roadMat = new THREE.MeshStandardMaterial({

    color:0x343434,

    roughness:.97

});

function createRoad(x,z,w,d){

    const mesh = new THREE.Mesh(

        new THREE.BoxGeometry(w,.08,d),

        roadMat

    );

    mesh.position.set(

        x,

        .04,

        z

    );

    mesh.receiveShadow = true;

    scene.add(mesh);

    roads.push({x,z,w,d});

}

for(let x=-360;x<=360;x+=ROAD_SPACING){

    createRoad(

        x,

        0,

        ROAD_WIDTH,

        870

    );

}

for(let z=-360;z<=360;z+=ROAD_SPACING){

    createRoad(

        0,

        z,

        870,

        ROAD_WIDTH

    );

}

/* ROAD LINES */

const yellow = new THREE.MeshBasicMaterial({

    color:0xe5d066

});

function stripe(x,z,w,d){

    const mesh = new THREE.Mesh(

        new THREE.PlaneGeometry(w,d),

        yellow

    );

    mesh.rotation.x = -Math.PI/2;

    mesh.position.set(

        x,

        .095,

        z

    );

    scene.add(mesh);

}

for(let x=-360;x<=360;x+=90){

    for(let z=-400;z<=400;z+=24){

        stripe(

            x,

            z,

            .32,

            10

        );

    }

}

for(let z=-360;z<=360;z+=90){

    for(let x=-400;x<=400;x+=24){

        stripe(

            x,

            z,

            10,

            .32

        );

    }

}

function isOnRoad(pos){

    for(const r of roads){

        if(

            Math.abs(pos.x-r.x)<=r.w/2 &&

            Math.abs(pos.z-r.z)<=r.d/2

        ){

            return true;

        }

    }

    return false;

}

/* =====================================================

   SIDEWALKS

===================================================== */

const sidewalkMat = new THREE.MeshStandardMaterial({

    color:0xaaa9a3,

    roughness:1

});

function sidewalkBlock(

    centerX,

    centerZ

){

    /*

    Roads are 28 m wide.

    Buildings therefore begin well inside

    each 90 m block.

    */

    const blockSize =

    ROAD_SPACING -

    ROAD_WIDTH -

    6;

    const slab = new THREE.Mesh(

        new THREE.BoxGeometry(

            blockSize,

            .18,

            blockSize

        ),

        sidewalkMat

    );

    slab.position.set(

        centerX,

        .09,

        centerZ

    );

    slab.receiveShadow = true;

    scene.add(slab);

}

/*

These are the actual centers between road lines.

Roads: 0, 90, 180...

Blocks: 45, 135, 225...

*/

const blockCenters = [];

for(let x=-315;x<=315;x+=90){

    for(let z=-315;z<=315;z+=90){

        blockCenters.push({x,z});

        sidewalkBlock(

            x,z

        );

    }

}

/* =====================================================

   BUILDINGS

===================================================== */

const buildingBoxes = [];

const buildingColors = [

    0xb59978,

    0x9b9389,

    0xb6aea1,

    0x8a7567,

    0xa57961,

    0x9d9d96,

    0x736b63,

    0x847c72

];

function addBuilding(

    x,z,w,d,h

){

    const material =

    new THREE.MeshStandardMaterial({

        color:

        buildingColors[

            Math.floor(

                Math.random()*

                buildingColors.length

            )

        ],

        roughness:.9

    });

    const building =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            w,h,d

        ),

        material

    );

    building.position.set(

        x,

        h/2+.2,

        z

    );

    building.castShadow = true;

    building.receiveShadow = true;

    scene.add(building);

    buildingBoxes.push(

        new THREE.Box3()

        .setFromObject(building)

    );

    if(h>30){

        const roof = new THREE.Mesh(

            new THREE.BoxGeometry(

                w*.27,

                2.2,

                d*.27

            ),

            new THREE.MeshStandardMaterial({

                color:0x515151

            })

        );

        roof.position.set(

            x,

            h+1.3,

            z

        );

        roof.castShadow = true;

        scene.add(roof);

    }

}

/*

IMPORTANT:

Buildings are positioned ONLY in the center

of proper blocks.

They cannot generate on a road.

*/

for(const block of blockCenters){

    /*

    Open park/start block.

    */

    if(

        Math.abs(block.x)<50 &&

        Math.abs(block.z)<50

    ){

        continue;

    }

    const layout = [

        [-15,-15],

        [15,-15],

        [-15,15],

        [15,15]

    ];

    const number =

    Math.random()<.35

    ? 2

    : 3;

    for(let i=0;i<number;i++){

        const slot = layout[i];

        const x =

        block.x +

        slot[0] +

        (Math.random()-.5)*2;

        const z =

        block.z +

        slot[1] +

        (Math.random()-.5)*2;

        /*

        Small enough that even the building edge

        remains far away from roadway.

        */

        const w =

        14 +

        Math.random()*8;

        const d =

        14 +

        Math.random()*8;

        const downtown =

        Math.max(

            0,

            1 -

            Math.hypot(x,z)/430

        );

        const h =

        12 +

        Math.random()*

        (

            18 +

            downtown*48

        );

        addBuilding(

            x,z,w,d,h

        );

    }

}

/* =====================================================

   TREES

===================================================== */

function createTree(x,z){

    const trunk = new THREE.Mesh(

        new THREE.CylinderGeometry(

            .35,.48,3.6,7

        ),

        new THREE.MeshStandardMaterial({

            color:0x70503a

        })

    );

    trunk.position.set(

        x,

        1.8,

        z

    );

    const leaves = new THREE.Mesh(

        new THREE.SphereGeometry(

            2.1,

            9,

            7

        ),

        new THREE.MeshStandardMaterial({

            color:0x39703a

        })

    );

    leaves.position.set(

        x,

        4.5,

        z

    );

    trunk.castShadow = true;

    leaves.castShadow = true;

    scene.add(

        trunk,

        leaves

    );

}

/*

Trees go toward block centers too,

not onto road lanes.

*/

for(const block of blockCenters){

    if(Math.random()<.65){

        createTree(

            block.x+

            (Math.random()-.5)*45,

            block.z+

            (Math.random()-.5)*45

        );

    }

}

/* =====================================================

   CAR

===================================================== */

const car = new THREE.Group();

const redMat =

new THREE.MeshStandardMaterial({

    color:0xd01827,

    metalness:.22,

    roughness:.36

});

const darkRed =

new THREE.MeshStandardMaterial({

    color:0x99101b,

    metalness:.16,

    roughness:.42

});

const glass =

new THREE.MeshStandardMaterial({

    color:0x162832,

    metalness:.32,

    roughness:.18

});

const tireMat =

new THREE.MeshStandardMaterial({

    color:0x0e0e0e,

    roughness:.96

});

/* LOWER BODY */

const lowerBody =

new THREE.Mesh(

    new THREE.BoxGeometry(

        2.08,

        .68,

        4.45

    ),

    redMat

);

lowerBody.position.y=.76;

lowerBody.castShadow=true;

car.add(lowerBody);

/* FRONT */

const hood =

new THREE.Mesh(

    new THREE.BoxGeometry(

        1.85,

        .24,

        1.35

    ),

    darkRed

);

hood.position.set(

    0,

    1.01,

    -1.5

);

car.add(hood);

/* CABIN */

const cabin =

new THREE.Mesh(

    new THREE.BoxGeometry(

        1.72,

        .73,

        2.05

    ),

    glass

);

cabin.position.set(

    0,

    1.38,

    .02

);

cabin.castShadow=true;

car.add(cabin);

/* BUMPERS */

const bumperMat =

new THREE.MeshStandardMaterial({

    color:0x191919

});

const frontBumper =

new THREE.Mesh(

    new THREE.BoxGeometry(

        1.85,

        .17,

        .16

    ),

    bumperMat

);

frontBumper.position.set(

    0,

    .55,

    -2.27

);

car.add(frontBumper);

const rearBumper =

frontBumper.clone();

rearBumper.position.z=2.27;

car.add(rearBumper);

/* WHEELS */

function createWheel(x,z){

    const wheel =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .42,.42,.40,16

        ),

        tireMat

    );

    wheel.rotation.z=Math.PI/2;

    wheel.position.set(

        x,.44,z

    );

    wheel.castShadow=true;

    car.add(wheel);

    return wheel;

}

const wheelFL =

createWheel(-1.04,-1.38);

const wheelFR =

createWheel(1.04,-1.38);

const wheelRL =

createWheel(-1.04,1.38);

const wheelRR =

createWheel(1.04,1.38);

car.position.set(

    0,.02,0

);

scene.add(car);

/* =====================================================

   HUMAN CHARACTER

===================================================== */

const player = new THREE.Group();

/*

Character root stays at ground level.

*/

const skin =

new THREE.MeshStandardMaterial({

    color:0xc58d69,

    roughness:.82

});

const shirt =

new THREE.MeshStandardMaterial({

    color:0x244f98,

    roughness:.8

});

const pants =

new THREE.MeshStandardMaterial({

    color:0x202934,

    roughness:.9

});

const shoes =

new THREE.MeshStandardMaterial({

    color:0x161616,

    roughness:1

});

const hair =

new THREE.MeshStandardMaterial({

    color:0x241811,

    roughness:1

});

/* TORSO */

const torso =

new THREE.Mesh(

    new THREE.BoxGeometry(

        .82,

        1.02,

        .40

    ),

    shirt

);

torso.position.y=1.72;

torso.castShadow=true;

player.add(torso);

/* PELVIS */

const pelvis =

new THREE.Mesh(

    new THREE.BoxGeometry(

        .68,

        .35,

        .38

    ),

    pants

);

pelvis.position.y=1.08;

player.add(pelvis);

/* HEAD */

const head =

new THREE.Mesh(

    new THREE.SphereGeometry(

        .31,

        14,

        10

    ),

    skin

);

head.position.y=2.55;

head.castShadow=true;

player.add(head);

/* HAIR */

const hairMesh =

new THREE.Mesh(

    new THREE.SphereGeometry(

        .32,

        14,

        8,

        0,

        Math.PI*2,

        0,

        Math.PI*.45

    ),

    hair

);

hairMesh.position.y=2.65;

player.add(hairMesh);

/* NECK */

const neck =

new THREE.Mesh(

    new THREE.CylinderGeometry(

        .11,.12,.20,8

    ),

    skin

);

neck.position.y=2.25;

player.add(neck);

/* LIMB GROUPS */

function makeArm(side){

    const pivot =

    new THREE.Group();

    pivot.position.set(

        side*.52,

        2.06,

        0

    );

    const upper =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .13,.14,.58,8

        ),

        shirt

    );

    upper.position.y=-.28;

    upper.castShadow=true;

    pivot.add(upper);

    const forearm =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .105,.12,.55,8

        ),

        skin

    );

    forearm.position.y=-.82;

    forearm.castShadow=true;

    pivot.add(forearm);

    const hand =

    new THREE.Mesh(

        new THREE.SphereGeometry(

            .12,

            8,

            6

        ),

        skin

    );

    hand.position.y=-1.13;

    pivot.add(hand);

    player.add(pivot);

    return pivot;

}

function makeLeg(side){

    const pivot =

    new THREE.Group();

    pivot.position.set(

        side*.22,

        1.05,

        0

    );

    const upper =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .17,.18,.65,8

        ),

        pants

    );

    upper.position.y=-.32;

    upper.castShadow=true;

    pivot.add(upper);

    const lower =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .14,.16,.65,8

        ),

        pants

    );

    lower.position.y=-.95;

    lower.castShadow=true;

    pivot.add(lower);

    const shoe =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            .30,.18,.48

        ),

        shoes

    );

    shoe.position.set(

        0,

        -1.33,

        -.09

    );

    shoe.castShadow=true;

    pivot.add(shoe);

    player.add(pivot);

    return pivot;

}

const armL = makeArm(-1);

const armR = makeArm(1);

const legL = makeLeg(-1);

const legR = makeLeg(1);

player.visible=false;

scene.add(player);

/* =====================================================

   MISSION

===================================================== */

const checkpoint =

new THREE.Group();

const checkpointRing =

new THREE.Mesh(

    new THREE.TorusGeometry(

        4,

        .45,

        12,

        36

    ),

    new THREE.MeshStandardMaterial({

        color:0xffd62d,

        emissive:0xb87900,

        emissiveIntensity:1.8

    })

);

checkpointRing.rotation.x=Math.PI/2;

checkpointRing.position.y=1.5;

const checkpointBeam =

new THREE.Mesh(

    new THREE.CylinderGeometry(

        3.7,3.7,12,26,1,true

    ),

    new THREE.MeshBasicMaterial({

        color:0xffdd3c,

        transparent:true,

        opacity:.13,

        side:THREE.DoubleSide

    })

);

checkpointBeam.position.y=6;

checkpoint.add(

    checkpointRing,

    checkpointBeam

);

checkpoint.position.set(

    180,

    0,

    -180

);

scene.add(checkpoint);

/* =====================================================

   STATE

===================================================== */

let mode="vehicle";

let speed=0;

let heading=0;

let velocityHeading=0;

let steering=0;

let playerHeading=0;

let walkClock=0;

const controls={

    joyX:0,

    joyY:0,

    gas:false,

    brake:false,

    reverse:false,

    handbrake:false,

    run:false

};

/*

Tuned for smoother mobile driving.

*/

const MAX_SPEED=35;

const MAX_REVERSE=9;

const ACCELERATION=9.8;

const BRAKE_POWER=21;

const REVERSE_ACCEL=7.5;

const ROAD_DRAG=2.4;

const GRASS_DRAG=7.2;

/* =====================================================

   UI

===================================================== */

const speedText =

document.getElementById("speed");

const statusText =

document.getElementById("status");

const surfaceText =

document.getElementById("surface");

const missionText =

document.getElementById("mission");

const vehicleControls =

document.getElementById("vehicleControls");

const actionButton =

document.getElementById("action");

const runButton =

document.getElementById("run");

/* =====================================================

   JOYSTICK

===================================================== */

const stickArea =

document.getElementById("stickArea");

const stick =

document.getElementById("stick");

const STICK_RADIUS=45;

let stickPointer=null;

function updateStick(clientX,clientY){

    const rect =

    stickArea.getBoundingClientRect();

    const cx =

    rect.left+

    rect.width/2;

    const cy =

    rect.top+

    rect.height/2;

    let dx=clientX-cx;

    let dy=clientY-cy;

    const length=

    Math.hypot(dx,dy);

    if(length>STICK_RADIUS){

        dx =

        dx/length*

        STICK_RADIUS;

        dy =

        dy/length*

        STICK_RADIUS;

    }

    controls.joyX =

    dx/STICK_RADIUS;

    controls.joyY =

    dy/STICK_RADIUS;

    stick.style.transform=

    `translate(${dx}px,${dy}px)`;

}

function resetStick(){

    controls.joyX=0;

    controls.joyY=0;

    stick.style.transform=

    "translate(0px,0px)";

}

stickArea.addEventListener(

    "pointerdown",

    e=>{

        e.preventDefault();

        if(stickPointer!==null)

            return;

        stickPointer=e.pointerId;

        stickArea.setPointerCapture(

            e.pointerId

        );

        updateStick(

            e.clientX,

            e.clientY

        );

    }

);

stickArea.addEventListener(

    "pointermove",

    e=>{

        if(

            e.pointerId!==

            stickPointer

        ) return;

        e.preventDefault();

        updateStick(

            e.clientX,

            e.clientY

        );

    }

);

function joystickEnd(e){

    if(

        e.pointerId!==

        stickPointer

    ) return;

    stickPointer=null;

    resetStick();

}

stickArea.addEventListener(

    "pointerup",

    joystickEnd

);

stickArea.addEventListener(

    "pointercancel",

    joystickEnd

);

/* =====================================================

   HOLD BUTTONS

===================================================== */

function setupHoldButton(

    id,

    controlName

){

    const button =

    document.getElementById(id);

    button.addEventListener(

        "pointerdown",

        e=>{

            e.preventDefault();

            controls[controlName]=true;

            try{

                button.setPointerCapture(

                    e.pointerId

                );

            }catch{}

        }

    );

    function release(e){

        e.preventDefault();

        controls[controlName]=false;

    }

    button.addEventListener(

        "pointerup",

        release

    );

    button.addEventListener(

        "pointercancel",

        release

    );

    button.addEventListener(

        "pointerleave",

        e=>{

            if(e.buttons===0)

                controls[controlName]=false;

        }

    );

}

setupHoldButton(

    "gas",

    "gas"

);

setupHoldButton(

    "brake",

    "brake"

);

setupHoldButton(

    "reverse",

    "reverse"

);

setupHoldButton(

    "handbrake",

    "handbrake"

);

setupHoldButton(

    "run",

    "run"

);

/* =====================================================

   COLLISION

===================================================== */

function hitsBuilding(

    position,

    radius

){

    const playerBox =

    new THREE.Box3(

        new THREE.Vector3(

            position.x-radius,

            .02,

            position.z-radius

        ),

        new THREE.Vector3(

            position.x+radius,

            3,

            position.z+radius

        )

    );

    for(const box of buildingBoxes){

        if(

            playerBox.intersectsBox(

                box

            )

        ){

            return true;

        }

    }

    return false;

}

/* =====================================================

   CAR PHYSICS V3

===================================================== */

function updateVehicle(dt){

    const onRoad =

    isOnRoad(car.position);

    surfaceText.textContent =

    onRoad

    ? "ROAD"

    : "OFF ROAD";

    /*

    THROTTLE

    */

    if(controls.gas){

        if(speed<0){

            speed +=

            BRAKE_POWER*dt;

        }else{

            speed +=

            ACCELERATION*dt;

        }

    }

    /*

    BRAKE ONLY BRAKES.

    It does NOT reverse anymore.

    */

    if(controls.brake){

        if(speed>0){

            speed -=

            BRAKE_POWER*dt;

            if(speed<0)

                speed=0;

        }

        else if(speed<0){

            speed +=

            BRAKE_POWER*dt;

            if(speed>0)

                speed=0;

        }

    }

    /*

    SEPARATE REVERSE

    */

    if(controls.reverse){

        if(speed>0){

            speed -=

            BRAKE_POWER*dt;

        }else{

            speed -=

            REVERSE_ACCEL*dt;

        }

    }

    /*

    DRAG

    */

    if(

        !controls.gas &&

        !controls.reverse

    ){

        const drag =

        onRoad

        ? ROAD_DRAG

        : GRASS_DRAG;

        if(speed>0){

            speed -= drag*dt;

            if(speed<0)

                speed=0;

        }

        else if(speed<0){

            speed += drag*dt;

            if(speed>0)

                speed=0;

        }

    }

    /*

    OFFROAD LIMIT

    */

    const maxForward =

    onRoad

    ? MAX_SPEED

    : 16;

    speed =

    THREE.MathUtils.clamp(

        speed,

        -MAX_REVERSE,

        maxForward

    );

    /*

    HANDBRAKE

    */

    if(controls.handbrake){

        speed *=

        Math.pow(.56,dt);

    }

    const speedRatio =

    Math.min(

        Math.abs(speed)/

        MAX_SPEED,

        1

    );

    /*

    SMOOTH ANALOG STEERING.

    Instead of instantly using joystick X,

    steering gradually approaches joystick X.

    */

    const steeringResponse =

    controls.handbrake

    ? 8

    : 5.2;

    steering =

    THREE.MathUtils.lerp(

        steering,

        controls.joyX,

        Math.min(

            1,

            steeringResponse*dt

        )

    );

    /*

    Automatically return steering toward center.

    */

    if(

        Math.abs(controls.joyX)<.04

    ){

        steering =

        THREE.MathUtils.lerp(

            steering,

            0,

            Math.min(

                1,

                7*dt

            )

        );

    }

    /*

    High-speed steering becomes softer.

    */

    let steeringRate =

    THREE.MathUtils.lerp(

        1.65,

        .53,

        speedRatio

    );

    if(!onRoad)

        steeringRate*=.68;

    if(controls.handbrake)

        steeringRate*=1.6;

    if(Math.abs(speed)>.25){

        const movementDirection =

        speed>=0

        ? 1

        : -1;

        heading -=

        steering*

        steeringRate*

        movementDirection*

        dt;

    }

    /*

    FRONT WHEELS

    */

    const frontAngle =

    steering*.46;

    wheelFL.rotation.y =

    frontAngle;

    wheelFR.rotation.y =

    frontAngle;

    /*

    TRACTION

    Normal driving sticks to heading.

    Handbrake allows sideways slide.

    */

    let traction =

    onRoad

    ? 7.5

    : 3.2;

    if(

        controls.handbrake &&

        Math.abs(speed)>5

    ){

        traction=1.05;

    }

    let angleDiff =

    heading-

    velocityHeading;

    while(angleDiff>Math.PI)

        angleDiff-=Math.PI*2;

    while(angleDiff<-Math.PI)

        angleDiff+=Math.PI*2;

    velocityHeading +=

    angleDiff*

    Math.min(

        1,

        traction*dt

    );

    if(Math.abs(speed)<1){

        velocityHeading =

        THREE.MathUtils.lerp(

            velocityHeading,

            heading,

            Math.min(1,10*dt)

        );

    }

    const movementAngle =

    Math.abs(speed)<.7

    ? heading

    : velocityHeading;

    const forward =

    new THREE.Vector3(

        -Math.sin(

            movementAngle

        ),

        0,

        -Math.cos(

            movementAngle

        )

    );

    const oldPosition =

    car.position.clone();

    car.position

    .addScaledVector(

        forward,

        speed*dt

    );

    car.position.x =

    THREE.MathUtils.clamp(

        car.position.x,

        -WORLD_HALF,

        WORLD_HALF

    );

    car.position.z =

    THREE.MathUtils.clamp(

        car.position.z,

        -WORLD_HALF,

        WORLD_HALF

    );

    /*

    BUILDING COLLISION

    */

    if(

        hitsBuilding(

            car.position,

            1.4

        )

    ){

        car.position.copy(

            oldPosition

        );

        speed *= -.06;

        velocityHeading=heading;

    }

    car.rotation.y=heading;

    /*

    BODY LEAN

    */

    const desiredRoll =

    -steering*

    speedRatio*

    .055;

    car.rotation.z =

    THREE.MathUtils.lerp(

        car.rotation.z,

        desiredRoll,

        .07

    );

    /*

    ACCEL/BRAKE PITCH

    */

    let desiredPitch=0;

    if(

        controls.brake &&

        speed>1

    ){

        desiredPitch=-.03;

    }

    else if(

        controls.gas &&

        speed>1

    ){

        desiredPitch=.018;

    }

    car.rotation.x =

    THREE.MathUtils.lerp(

        car.rotation.x,

        desiredPitch,

        .07

    );

    car.position.y =

    .02+

    Math.sin(

        performance.now()*.01

    )*

    speedRatio*

    .012;

    speedText.textContent =

    Math.round(

        Math.abs(speed)*

        2.23694

    )+

    " MPH";

}

/* =====================================================

   HUMAN WALKING

===================================================== */

function updatePlayer(dt){

    const x=controls.joyX;

    const y=controls.joyY;

    const amount =

    Math.min(

        1,

        Math.hypot(x,y)

    );

    if(amount>.08){

        const cameraForward =

        new THREE.Vector3();

        camera.getWorldDirection(

            cameraForward

        );

        cameraForward.y=0;

        cameraForward.normalize();

        const cameraRight =

        new THREE.Vector3(

            -cameraForward.z,

            0,

            cameraForward.x

        );

        const movement =

        new THREE.Vector3();

        movement.addScaledVector(

            cameraRight,

            x

        );

        movement.addScaledVector(

            cameraForward,

            -y

        );

        movement.normalize();

        const movementSpeed =

        controls.run

        ? 6.3

        : 3.2;

        const oldPosition =

        player.position.clone();

        player.position

        .addScaledVector(

            movement,

            movementSpeed*

            amount*

            dt

        );

        if(

            hitsBuilding(

                player.position,

                .42

            )

        ){

            player.position.copy(

                oldPosition

            );

        }

        playerHeading =

        Math.atan2(

            movement.x,

            movement.z

        );

        player.rotation.y =

        playerHeading;

        /*

        Walking animation.

        */

        walkClock +=

        dt*

        (

            controls.run

            ? 11

            : 7

        );

        const swing =

        Math.sin(walkClock)*

        (

            controls.run

            ? .72

            : .48

        );

        legL.rotation.x=swing;

        legR.rotation.x=-swing;

        armL.rotation.x=-swing*.72;

        armR.rotation.x=swing*.72;

        /*

        small up/down movement

        */

        torso.position.y =

        1.72+

        Math.abs(

            Math.sin(walkClock)

        )*.025;

        speedText.textContent =

        controls.run

        ? "RUNNING"

        : "WALKING";

    }

    else{

        /*

        return body to neutral

        */

        legL.rotation.x =

        THREE.MathUtils.lerp(

            legL.rotation.x,

            0,

            .18

        );

        legR.rotation.x =

        THREE.MathUtils.lerp(

            legR.rotation.x,

            0,

            .18

        );

        armL.rotation.x =

        THREE.MathUtils.lerp(

            armL.rotation.x,

            0,

            .18

        );

        armR.rotation.x =

        THREE.MathUtils.lerp(

            armR.rotation.x,

            0,

            .18

        );

        torso.position.y =

        THREE.MathUtils.lerp(

            torso.position.y,

            1.72,

            .2

        );

        speedText.textContent =

        "ON FOOT";

    }

    updateEnterCarButton();

}

/* =====================================================

   EXIT / ENTER

===================================================== */

function exitCar(){

    if(mode!=="vehicle")

        return;

    /*

    If moving a little, pressing EXIT

    stops the car first instead of making

    the button appear broken.

    */

    if(Math.abs(speed)>4){

        actionButton.textContent =

        "STOP CAR";

        speed *= .35;

        setTimeout(()=>{

            if(mode==="vehicle")

                actionButton.textContent="EXIT";

        },500);

        return;

    }

    speed=0;

    steering=0;

    velocityHeading=heading;

    mode="walking";

    /*

    Driver-side spawn position.

    */

    const left =

    new THREE.Vector3(

        -Math.cos(heading),

        0,

        Math.sin(heading)

    );

    player.position.copy(

        car.position

    );

    player.position.addScaledVector(

        left,

        2.25

    );

    /*

    If that side is blocked,

    try the opposite side.

    */

    if(

        hitsBuilding(

            player.position,

            .45

        )

    ){

        player.position.copy(

            car.position

        );

        player.position.addScaledVector(

            left,

            -2.25

        );

    }

    player.position.y=0;

    playerHeading=heading;

    player.rotation.y=heading;

    player.visible=true;

    vehicleControls.style.display=

    "none";

    runButton.style.display=

    "block";

    statusText.textContent=

    "ON FOOT";

    surfaceText.textContent=

    "";

    actionButton.style.display=

    "block";

    actionButton.textContent=

    "ENTER CAR";

    resetStick();

}

function enterCar(){

    if(mode!=="walking")

        return;

    const distance =

    player.position.distanceTo(

        car.position

    );

    if(distance>4.7)

        return;

    mode="vehicle";

    player.visible=false;

    heading=

    car.rotation.y;

    velocityHeading=heading;

    vehicleControls.style.display=

    "block";

    runButton.style.display=

    "none";

    actionButton.style.display=

    "block";

    actionButton.textContent=

    "EXIT";

    statusText.textContent=

    "IN VEHICLE";

    resetStick();

}

function updateEnterCarButton(){

    if(mode!=="walking")

        return;

    const distance =

    player.position.distanceTo(

        car.position

    );

    if(distance<=4.7){

        actionButton.style.display=

        "block";

        actionButton.textContent=

        "ENTER CAR";

    }

    else{

        actionButton.style.display=

        "none";

    }

}

/*

Use pointerup rather than the previous

pointerdown implementation.

This is more reliable for the iPhone

action button.

*/

actionButton.addEventListener(

    "pointerup",

    e=>{

        e.preventDefault();

        if(mode==="vehicle")

            exitCar();

        else

            enterCar();

    }

);

/* =====================================================

   CAMERA

===================================================== */

const desiredCamera =

new THREE.Vector3();

const lookAtPoint =

new THREE.Vector3();

function updateCamera(dt){

    if(mode==="vehicle"){

        const speedRatio =

        Math.min(

            Math.abs(speed)/

            MAX_SPEED,

            1

        );

        /*

        GTA-style chase distance

        changes gently with speed.

        */

        const distance =

        THREE.MathUtils.lerp(

            8.7,

            11,

            speedRatio

        );

        const height =

        THREE.MathUtils.lerp(

            4.5,

            5.4,

            speedRatio

        );

        const behind =

        new THREE.Vector3(

            Math.sin(heading),

            0,

            Math.cos(heading)

        );

        desiredCamera.copy(

            car.position

        );

        desiredCamera

        .addScaledVector(

            behind,

            distance

        );

        desiredCamera.y += height;

        /*

        Lower follow strength = smoother camera.

        */

        const followStrength =

        1-

        Math.exp(

            -4.5*dt

        );

        camera.position.lerp(

            desiredCamera,

            followStrength

        );

        const ahead =

        new THREE.Vector3(

            -Math.sin(heading),

            0,

            -Math.cos(heading)

        );

        lookAtPoint.copy(

            car.position

        );

        lookAtPoint.addScaledVector(

            ahead,

            2.4+

            speedRatio*3

        );

        lookAtPoint.y=1.1;

        camera.lookAt(

            lookAtPoint

        );

        const desiredFov =

        65+

        speedRatio*5;

        camera.fov =

        THREE.MathUtils.lerp(

            camera.fov,

            desiredFov,

            .035

        );

        camera.updateProjectionMatrix();

    }

    else{

        const behind =

        new THREE.Vector3(

            Math.sin(

                playerHeading

            ),

            0,

            Math.cos(

                playerHeading

            )

        );

        desiredCamera.copy(

            player.position

        );

        desiredCamera

        .addScaledVector(

            behind,

            5.4

        );

        desiredCamera.y += 3.3;

        camera.position.lerp(

            desiredCamera,

            1-

            Math.exp(

                -5*dt

            )

        );

        lookAtPoint.copy(

            player.position

        );

        lookAtPoint.y=1.45;

        camera.lookAt(

            lookAtPoint

        );

        camera.fov =

        THREE.MathUtils.lerp(

            camera.fov,

            65,

            .05

        );

        camera.updateProjectionMatrix();

    }

}

/* =====================================================

   MISSIONS

===================================================== */

const missionPoints=[

    new THREE.Vector3(

        180,0,-180

    ),

    new THREE.Vector3(

        -180,0,180

    ),

    new THREE.Vector3(

        270,0,90

    ),

    new THREE.Vector3(

        -270,0,-90

    )

];

let missionNumber=1;

let missionCooldown=false;

function updateMission(time){

    checkpointRing.rotation.z += .01;

    checkpointRing.position.y =

    1.5+

    Math.sin(

        time*.003

    )*.28;

    const position =

    mode==="vehicle"

    ? car.position

    : player.position;

    const distance =

    position.distanceTo(

        checkpoint.position

    );

    if(!missionCooldown){

        missionText.textContent=

        "MISSION "+

        missionNumber+

        ": Reach checkpoint — "+

        Math.round(distance)+

        " m";

    }

    if(

        distance<7 &&

        !missionCooldown

    ){

        missionCooldown=true;

        missionText.textContent=

        "MISSION COMPLETE — $500";

        setTimeout(()=>{

            missionNumber++;

            const next =

            missionPoints[

                (missionNumber-1)%

                missionPoints.length

            ];

            checkpoint.position.copy(

                next

            );

            missionCooldown=false;

        },1600);

    }

}

/* =====================================================

   START CAMERA

===================================================== */

camera.position.set(

    0,

    5,

    10

);

camera.lookAt(

    car.position

);

/* =====================================================

   LOOP

===================================================== */

const clock =

new THREE.Clock();

function animate(time){

    requestAnimationFrame(

        animate

    );

    let dt =

    clock.getDelta();

    dt =

    Math.min(

        dt,

        .04

    );

    if(mode==="vehicle")

        updateVehicle(dt);

    else

        updatePlayer(dt);

    updateCamera(dt);

    updateMission(time);

    renderer.render(

        scene,

        camera

    );

}

requestAnimationFrame(

    animate

);

/* =====================================================

   RESIZE

===================================================== */

window.addEventListener(

    "resize",

    ()=>{

        camera.aspect =

        innerWidth/

        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(

            innerWidth,

            innerHeight

        );

    }

);

document.addEventListener(

    "gesturestart",

    e=>e.preventDefault()

);

document.addEventListener(

    "contextmenu",

    e=>e.preventDefault()

);
