<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1,

maximum-scale=1,

user-scalable=no,

viewport-fit=cover">

<title>Utica Open World 3D V2</title>

<style>

*{

    box-sizing:border-box;

    -webkit-user-select:none;

    user-select:none;

    -webkit-touch-callout:none;

}

html,body{

    margin:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#111;

    touch-action:none;

    font-family:Arial,Helvetica,sans-serif;

}

canvas{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    display:block;

}

/* HUD */

#hud{

    position:fixed;

    top:max(14px,env(safe-area-inset-top));

    left:15px;

    color:#fff;

    z-index:20;

    text-shadow:0 2px 6px #000;

    pointer-events:none;

}

#speed{

    font-size:29px;

    font-weight:900;

}

#status{

    font-size:13px;

}

#mission{

    margin-top:8px;

    max-width:245px;

    padding:8px 10px;

    border-radius:10px;

    background:rgba(0,0,0,.43);

    font-size:13px;

    line-height:1.3;

}

#surface{

    margin-top:4px;

    font-size:11px;

    opacity:.85;

}

/* JOYSTICK */

#stickArea{

    position:fixed;

    left:16px;

    bottom:max(22px,env(safe-area-inset-bottom));

    width:155px;

    height:155px;

    z-index:30;

    touch-action:none;

}

#stickBase{

    position:absolute;

    width:120px;

    height:120px;

    left:17px;

    top:17px;

    border-radius:50%;

    background:rgba(20,20,20,.38);

    border:3px solid rgba(255,255,255,.35);

    box-shadow:0 4px 14px rgba(0,0,0,.45);

}

#stick{

    position:absolute;

    width:58px;

    height:58px;

    left:48px;

    top:48px;

    border-radius:50%;

    background:rgba(255,255,255,.82);

    border:3px solid rgba(0,0,0,.4);

    box-shadow:0 4px 10px rgba(0,0,0,.4);

    pointer-events:none;

}

/* VEHICLE CONTROLS */

#vehicleControls{

    position:fixed;

    right:15px;

    bottom:max(20px,env(safe-area-inset-bottom));

    width:185px;

    height:195px;

    z-index:30;

}

.gameButton{

    position:absolute;

    border:none;

    color:#fff;

    font-weight:900;

    touch-action:none;

    -webkit-tap-highlight-color:transparent;

    box-shadow:

    inset 0 0 0 2px rgba(255,255,255,.22),

    0 5px 12px rgba(0,0,0,.45);

}

.gameButton:active{

    transform:scale(.94);

}

#gas{

    right:0;

    bottom:0;

    width:92px;

    height:92px;

    border-radius:50%;

    background:rgba(20,165,67,.80);

    font-size:19px;

}

#brake{

    left:2px;

    bottom:3px;

    width:76px;

    height:76px;

    border-radius:50%;

    background:rgba(205,40,40,.82);

    font-size:13px;

}

#handbrake{

    right:3px;

    top:7px;

    width:88px;

    height:50px;

    border-radius:15px;

    background:rgba(30,30,30,.78);

    font-size:11px;

}

/* ON FOOT */

#run{

    position:fixed;

    right:25px;

    bottom:max(38px,env(safe-area-inset-bottom));

    width:84px;

    height:84px;

    border:none;

    border-radius:50%;

    background:rgba(39,99,220,.8);

    color:#fff;

    font-size:16px;

    font-weight:900;

    display:none;

    z-index:30;

    touch-action:none;

    box-shadow:

    inset 0 0 0 2px rgba(255,255,255,.23),

    0 5px 12px rgba(0,0,0,.45);

}

/* ACTION */

#action{

    position:fixed;

    right:15px;

    top:max(72px,calc(env(safe-area-inset-top) + 55px));

    height:48px;

    min-width:105px;

    border:none;

    border-radius:14px;

    padding:0 15px;

    background:rgba(15,15,15,.75);

    color:#fff;

    font-size:13px;

    font-weight:900;

    z-index:30;

    touch-action:none;

    box-shadow:

    inset 0 0 0 2px rgba(255,255,255,.25),

    0 4px 12px rgba(0,0,0,.5);

}

#logo{

    position:fixed;

    right:15px;

    top:max(16px,env(safe-area-inset-top));

    color:#fff;

    font-size:11px;

    font-weight:bold;

    letter-spacing:1px;

    opacity:.75;

    text-shadow:0 2px 5px #000;

    pointer-events:none;

    z-index:10;

}

</style>

</head>

<script type="module">

import * as THREE

from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================================================

   BASIC THREE SETUP

========================================================= */

const scene = new THREE.Scene();

scene.background =

new THREE.Color(0x83b8df);

scene.fog =

new THREE.Fog(

    0x83b8df,

new THREE.PerspectiveCamera(

);

const renderer =

new THREE.WebGLRenderer({

    antialias:true,

});

renderer.setPixelRatio(

    Math.min(

        devicePixelRatio,

        1.5

    )

);

renderer.setSize(

    innerWidth,

    innerHeight

);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =

THREE.PCFSoftShadowMap;

document.body.prepend(

    renderer.domElement

);

/* =========================================================

   LIGHT

========================================================= */

scene.add(

    new THREE.HemisphereLight(

        0xd6ecff,

        0x50643b,

        2.2

    )

);

const sun =

new THREE.DirectionalLight(

    0xffffff,

);

sun.position.set(

    -160,

);

sun.castShadow = true;

sun.shadow.mapSize.set(

sun.shadow.camera.left = -180;

sun.shadow.camera.right = 180;

sun.shadow.camera.top = 180;

sun.shadow.camera.bottom = -180;

scene.add(sun);

/* =========================================================

   WORLD

========================================================= */

const WORLD_HALF = 425;

const grass =

new THREE.Mesh(

    new THREE.PlaneGeometry(

        900,

        900

    ),

    new THREE.MeshStandardMaterial({

        color:0x617f47,

        roughness:1

    })

);

grass.rotation.x =

-Math.PI / 2;

grass.receiveShadow = true;

scene.add(grass);

/* =========================================================

   ROADS

========================================================= */

const roads = [];

const roadMaterial =

new THREE.MeshStandardMaterial({

    color:0x353535,

    roughness:.96

});

function makeRoad(

    x,

    z,

    w,

    d

){

    const road =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            w,

            .08,

            d

        ),

        roadMaterial

    );

    road.position.set(

        x,

        .04,

        z

    );

    road.receiveShadow = true;

    scene.add(road);

    roads.push({

        x,z,w,d

    });

}

for(

    let x=-360;

    x<=360;

    x+=90

){

    makeRoad(

        x,

        0,

        26,

        850

    );

}

for(

    let z=-360;

    z<=360;

    z+=90

){

    makeRoad(

        0,

        z,

        850,

        26

    );

}

/* road markings */

const lineMat =

new THREE.MeshBasicMaterial({

    color:0xe8d565

});

function line(

    x,z,w,d

){

    const m =

    new THREE.Mesh(

        new THREE.PlaneGeometry(

            w,d

        ),

        lineMat

    );

    m.rotation.x =

    -Math.PI/2;

    m.position.set(

        x,

        .095,

        z

    );

    scene.add(m);

}

for(

    let x=-360;

    x<=360;

    x+=90

){

    for(

        let z=-395;

        z<=395;

        z+=22

    ){

        line(

            x,z,.35,9

        );

    }

}

for(

    let z=-360;

    z<=360;

    z+=90

){

    for(

        let x=-395;

        x<=395;

        x+=22

    ){

        line(

            x,z,9,.35

        );

    }

}

function isOnRoad(pos){

    for(

        const r of roads

    ){

        if(

            Math.abs(

                pos.x-r.x

            ) <= r.w/2 &&

            Math.abs(

                pos.z-r.z

            ) <= r.d/2

        ){

            return true;

        }

    }

    return false;

}

/* =========================================================

   CURBS

========================================================= */

const curbMaterial =

new THREE.MeshStandardMaterial({

    color:0xaaaaa5,

    roughness:1

});

function curb(

    x,z,w,d

){

    const c =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            w,.22,d

        ),

        curbMaterial

    );

    c.position.set(

        x,

        .11,

        z

    );

    c.receiveShadow = true;

    scene.add(c);

}

/*

visual curb lines

*/

for(

    let x=-360;

    x<=360;

    x+=90

){

    curb(

        x-14.5,

        0,

        1.2,

        850

    );

    curb(

        x+14.5,

        0,

        1.2,

        850

    );

}

for(

    let z=-360;

    z<=360;

    z+=90

){

    curb(

        0,

        z-14.5,

        850,

        1.2

    );

    curb(

        0,

        z+14.5,

        850,

        1.2

    );

}

/* =========================================================

   BUILDINGS

========================================================= */

const buildingBoxes = [];

const buildingColors = [

    0xb69c7c,

    0x958d83,

    0xb8b1a5,

    0x826f63,

    0xa17860,

    0x9d9c95,

    0x776d64

];

function makeBuilding(

    x,z,w,d,h

){

    const mesh =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            w,h,d

        ),

        new THREE.MeshStandardMaterial({

            color:

            buildingColors[

                Math.floor(

                    Math.random() *

                    buildingColors.length

                )

            ],

            roughness:.9

        })

    );

    mesh.position.set(

        x,

        h/2,

        z

    );

    mesh.castShadow = true;

    mesh.receiveShadow = true;

    scene.add(mesh);

    const box =

    new THREE.Box3().setFromObject(

        mesh

    );

    buildingBoxes.push(box);

    /*

    rooftop unit

    */

    if(h>28){

        const top =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                w*.28,

                2.4,

                d*.28

            ),

            new THREE.MeshStandardMaterial({

                color:0x4f5050

            })

        );

        top.position.set(

            x,

            h+1.2,

            z

        );

        top.castShadow = true;

        scene.add(top);

    }

}

/*

Buildings are deliberately kept deeper

inside blocks, away from roads.

*/

for(

    let gx=-315;

    gx<=315;

    gx+=90

){

    for(

        let gz=-315;

        gz<=315;

        gz+=90

    ){

        if(

            Math.abs(gx)<50 &&

            Math.abs(gz)<50

        ){

            continue;

        }

        const spots = [

            [-18,-18],

            [18,-18],

            [-18,18],

            [18,18]

        ];

        const count =

        2 +

        Math.floor(

            Math.random()*3

        );

        for(

            let i=0;

            i<count;

            i++

        ){

            const p =

            spots[i];

            const x =

            gx +

            p[0] +

            (Math.random()-.5)*5;

            const z =

            gz +

            p[1] +

            (Math.random()-.5)*5;

            const w =

            16 +

            Math.random()*9;

            const d =

            16 +

            Math.random()*9;

            const dist =

            Math.hypot(x,z);

            const downtown =

            Math.max(

                0,

                1-dist/390

            );

            const h =

            13 +

            Math.random() *

            (

                18 +

                downtown*46

            );

            makeBuilding(

                x,z,w,d,h

            );

        }

    }

}

/* =========================================================

   TREES

========================================================= */

function makeTree(

    x,z

){

    const trunk =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .4,

            .55,

            4,

            7

        ),

        new THREE.MeshStandardMaterial({

            color:0x705038

        })

    );

    trunk.position.set(

        x,2,z

    );

    const leaves =

    new THREE.Mesh(

        new THREE.SphereGeometry(

            2.4,

            9,

            7

        ),

        new THREE.MeshStandardMaterial({

            color:0x3b7037

        })

    );

    leaves.position.set(

        x,5,z

    );

    trunk.castShadow = true;

    leaves.castShadow = true;

    scene.add(

        trunk,

        leaves

    );

}

for(

    let i=0;

    i<55;

    i++

){

    const x =

    (Math.random()-.5)*770;

    const z =

    (Math.random()-.5)*770;

    const test =

    new THREE.Vector3(

        x,0,z

    );

    if(

        !isOnRoad(test)

    ){

        makeTree(

            x,z

        );

    }

}

/* =========================================================

   CAR

========================================================= */

const car =

new THREE.Group();

const red =

new THREE.MeshStandardMaterial({

    color:0xc61925,

    roughness:.38,

    metalness:.2

});

const darkRed =

new THREE.MeshStandardMaterial({

    color:0x97121c,

    roughness:.42

});

const glass =

new THREE.MeshStandardMaterial({

    color:0x1c2d38,

    roughness:.15,

    metalness:.3

});

const tire =

new THREE.MeshStandardMaterial({

    color:0x101010,

    roughness:1

});

const body =

new THREE.Mesh(

    new THREE.BoxGeometry(

        2.05,.72,4.3

    ),

    red

);

body.position.y=.82;

body.castShadow=true;

car.add(body);

const cabin =

new THREE.Mesh(

    new THREE.BoxGeometry(

        1.7,.72,2

    ),

    glass

);

cabin.position.set(

    0,

    1.43,

    .05

);

cabin.castShadow=true;

car.add(cabin);

const hood =

new THREE.Mesh(

    new THREE.BoxGeometry(

        1.82,.24,1.3

    ),

);

hood.position.set(

);

car.add(hood);

function wheel(

    x,z

){

    const w =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .42,.42,.4,16

        ),

        tire

    );

    w.rotation.z =

    Math.PI/2;

    w.position.set(

        x,.47,z

    );

    w.castShadow=true;

    car.add(w);

    return w;

}

const fl =

wheel(-1.04,-1.35);

const fr =

wheel(1.04,-1.35);

const rl =

wheel(-1.04,1.35);

const rr =

wheel(1.04,1.35);

car.position.set(

    0,.02,0

);

scene.add(car);

/* =========================================================

   PLAYER

========================================================= */

const player =

new THREE.Group();

const personBody =

new THREE.Mesh(

    new THREE.CapsuleGeometry(

        .4,

        1.1,

        4,

        8

    ),

    new THREE.MeshStandardMaterial({

        color:0x275fc5

    })

);

personBody.position.y=1.12;

personBody.castShadow=true;

const head =

new THREE.Mesh(

    new THREE.SphereGeometry(

        .34,

        12,

        8

    ),

    new THREE.MeshStandardMaterial({

    })

);

head.position.y=2.12;

head.castShadow=true;

player.add(

    personBody,

player.visible=false;

scene.add(player);

/* =========================================================

   MISSION

========================================================= */

const checkpoint =

new THREE.Group();

const ring =

new THREE.Mesh(

    new THREE.TorusGeometry(

        4,.45,12,36

    ),

    new THREE.MeshStandardMaterial({

        color:0xffd82d,

        emissive:0xc48800,

        emissiveIntensity:1.6

    })

);

ring.rotation.x =

Math.PI/2;

ring.position.y=1.5;

const beam =

new THREE.Mesh(

    new THREE.CylinderGeometry(

        3.7,

        3.7,

        11,

        24,

        1,

    ),

    new THREE.MeshBasicMaterial({

    })

);

beam.position.y=5.5;

checkpoint.add(

);

checkpoint.position.set(

/* =========================================================

   GAME STATE

========================================================= */

let mode="vehicle";

let heading=0;

let speed=0;

/*

Velocity angle gives the car

a slight sideways slide.

*/

let velocityHeading=0;

let playerHeading=0;

const controls={

    joyX:0,

    joyY:0,

    gas:false,

    brake:false,

    handbrake:false,

    run:false

};

const MAX_ROAD_SPEED=42;

const MAX_GRASS_SPEED=19;

const MAX_REVERSE=11;

const ROAD_ACCEL=16;

const GRASS_ACCEL=8;

const BRAKE_FORCE=30;

const REVERSE_ACCEL=10;

/* =========================================================

   HTML ELEMENTS

========================================================= */

const speedText =

document.getElementById("speed");

const statusText =

document.getElementById("status");

const missionText =

document.getElementById("mission");

const surfaceText =

document.getElementById("surface");

const vehicleControls =

document.getElementById(

    "vehicleControls"

);

const runButton =

document.getElementById(

    "run"

);

const actionButton =

document.getElementById(

    "action"

);

/* =========================================================

   JOYSTICK

========================================================= */

const stickArea =

document.getElementById(

    "stickArea"

);

const stick =

document.getElementById(

    "stick"

);

const STICK_RADIUS=44;

let stickPointer=null;

function moveStick(

    x,y

){

    const rect =

    stickArea.getBoundingClientRect();

    const cx =

    rect.left +

    rect.width/2;

    const cy =

    rect.top +

    rect.height/2;

    let dx=x-cx;

    let dy=y-cy;

    const len =

    Math.hypot(

        dx,dy

    );

    if(

        len>STICK_RADIUS

    ){

        dx=

        dx/len*

        STICK_RADIUS;

        dy=

        dy/len*

        STICK_RADIUS;

    }

    controls.joyX=

    dx/STICK_RADIUS;

    controls.joyY=

    dy/STICK_RADIUS;

    stick.style.transform=

    `translate(${dx}px,${dy}px)`;

}

function resetStick(){

    controls.joyX=0;

    controls.joyY=0;

    stick.style.transform=

    "translate(0px,0px)";

}

stickArea.addEventListener(

    "pointerdown",

    e=>{

        e.preventDefault();

        if(

            stickPointer!==null

        ) return;

        stickPointer=

        e.pointerId;

        stickArea.setPointerCapture(

            e.pointerId

        );

        moveStick(

            e.clientX,

            e.clientY

        );

    }

);

stickArea.addEventListener(

    "pointermove",

    e=>{

        if(

            e.pointerId!==

            stickPointer

        ) return;

        e.preventDefault();

        moveStick(

            e.clientX,

            e.clientY

        );

    }

);

function stickEnd(e){

    if(

        e.pointerId!==

        stickPointer

    ) return;

    stickPointer=null;

    resetStick();

}

stickArea.addEventListener(

    "pointerup",

    stickEnd

);

stickArea.addEventListener(

    "pointercancel",

    stickEnd

);

/* =========================================================

   HOLD BUTTONS

========================================================= */

function holdButton(

    id,

    control

){

    const b=

    document.getElementById(id);

    b.addEventListener(

        "pointerdown",

        e=>{

            e.preventDefault();

            b.setPointerCapture(

                e.pointerId

            );

            controls[control]=true;

        }

    );

    const release=

    e=>{

        e.preventDefault();

        controls[control]=false;

    };

    b.addEventListener(

        "pointerup",

        release

    );

    b.addEventListener(

        "pointercancel",

        release

    );

}

holdButton(

    "gas",

    "gas"

);

holdButton(

    "brake",

    "brake"

);

holdButton(

    "handbrake",

    "handbrake"

);

holdButton(

    "run",

    "run"

);

/* =========================================================

   COLLISION

========================================================= */

function collidesWithBuilding(

    pos,

    radius

){

    const test =

    new THREE.Box3(

        new THREE.Vector3(

            pos.x-radius,

            .05,

            pos.z-radius

        ),

        new THREE.Vector3(

            pos.x+radius,

            3,

            pos.z+radius

        )

    );

    for(

        const box of

        buildingBoxes

    ){

        if(

            test.intersectsBox(

                box

            )

        ){

            return true;

        }

    }

    return false;

}

/* =========================================================

   VEHICLE PHYSICS V2

========================================================= */

function updateVehicle(dt){

    const onRoad=

    isOnRoad(

        car.position

    );

    surfaceText.textContent=

    onRoad

    ? "ROAD"

    : "GRASS";

    const maxSpeed=

    onRoad

    ? MAX_ROAD_SPEED

    : MAX_GRASS_SPEED;

    const accel=

    onRoad

    ? ROAD_ACCEL

    : GRASS_ACCEL;

    /*

    ACCELERATION

    */

    if(

        controls.gas

    ){

        if(speed<0){

            speed +=

            BRAKE_FORCE*dt;

        }else{

            speed +=

            accel*dt;

        }

    }

    /*

    BRAKE AND REVERSE

    */

    if(

        controls.brake

    ){

        if(speed>.6){

            speed -=

            BRAKE_FORCE*dt;

        }else{

            speed -=

            REVERSE_ACCEL*dt;

        }

    }

    /*

    NATURAL DRAG

    */

    if(

        !controls.gas &&

        !controls.brake

    ){

        const drag=

        onRoad

        ? 3.3

        : 8;

        if(speed>0){

            speed -=

            drag*dt;

            if(speed<0)

                speed=0;

        }

        else if(speed<0){

            speed +=

            drag*dt;

            if(speed>0)

                speed=0;

        }

    }

    /*

    GRASS SPEED LOSS

    */

    if(

        !onRoad

    ){

        speed *=

        Math.pow(

            .72,

            dt

        );

    }

    /*

    HANDBRAKE

    */

    if(

        controls.handbrake

    ){

        speed *=

        Math.pow(

            .31,

            dt

        );

    }

    speed =

    THREE.MathUtils.clamp(

        speed,

        -MAX_REVERSE,

        maxSpeed

    );

    const absSpeed=

    Math.abs(speed);

    const speedRatio=

    Math.min(

        absSpeed/

        MAX_ROAD_SPEED,

        1

    );

    /*

    STEERING

    Very responsive at lower

    speed, calmer at high speed.

    */

    let steerStrength=

    THREE.MathUtils.lerp(

        2.0,

        .72,

        speedRatio

    );

    /*

    less grip on grass

    */

    if(!onRoad)

        steerStrength*=.74;

    /*

    more rotation during

    handbrake turn

    */

    if(

        controls.handbrake

    ){

        steerStrength*=1.85;

    }

    if(

        absSpeed>.2

    ){

        const reverse=

        speed>=0

        ? 1

        : -1;

        heading -=

        controls.joyX *

        steerStrength *

        reverse *

        dt;

    }

    /*

    STEERING WHEEL VISUAL

    */

    const wheelTurn=

    controls.joyX*.48;

    fl.rotation.y=

    wheelTurn;

    fr.rotation.y=

    wheelTurn;

    /*

    TRACTION / SLIDE

    velocityHeading follows the

    car heading more slowly when

    handbraking or on grass.

    */

    let traction=

    onRoad

    ? 8

    : 3.3;

    if(

        controls.handbrake &&

        absSpeed>5

    ){

        traction=.75;

    }

    let angleDifference=

    heading-

    velocityHeading;

    while(

        angleDifference>

        Math.PI

    ){

        angleDifference-=

        Math.PI*2;

    }

    while(

        angleDifference<

        -Math.PI

    ){

        angleDifference+=

        Math.PI*2;

    }

    velocityHeading +=

    angleDifference *

    Math.min(

        1,

        traction*dt

    );

    const movementHeading=

    absSpeed<1

    ? heading

    : velocityHeading;

    const dir =

    new THREE.Vector3(

        -Math.sin(

            movementHeading

        ),

        0,

        -Math.cos(

            movementHeading

        )

    );

    const oldPos=

    car.position.clone();

    car.position.addScaledVector(

        dir,

        speed*dt

    );

    car.position.x=

    THREE.MathUtils.clamp(

        car.position.x,

        -WORLD_HALF,

        WORLD_HALF

    );

    car.position.z=

    THREE.MathUtils.clamp(

        car.position.z,

        -WORLD_HALF,

        WORLD_HALF

    );

    /*

    BUILDING COLLISION

    revert position and kill

    most momentum.

    */

    if(

        collidesWithBuilding(

            car.position,

            1.45

        )

    ){

        car.position.copy(

            oldPos

        );

        speed *= -.08;

        velocityHeading=

        heading;

    }

    car.rotation.y=

    heading;

    /*

    BODY ROLL

    */

    const targetRoll=

    -controls.joyX *

    speedRatio *

    .07;

    car.rotation.z=

    THREE.MathUtils.lerp(

        car.rotation.z,

        targetRoll,

        .1

    );

    /*

    BRAKE / ACCEL PITCH

    */

    let targetPitch=0;

    if(

        controls.brake &&

        speed>2

    ){

        targetPitch=-.04;

    }

    else if(

        controls.gas &&

        speed>0

    ){

        targetPitch=.025;

    }

    car.rotation.x=

    THREE.MathUtils.lerp(

        car.rotation.x,

        targetPitch,

        .08

    );

    /*

    Slight suspension bounce

    */

    car.position.y=

    .02+

    Math.sin(

        performance.now()*.012

    ) *

    Math.min(

        speedRatio*.025,

        .025

    );

    speedText.textContent=

    Math.round(

        Math.abs(speed)*

        2.23694

    )+

    " MPH";

}

/* =========================================================

   PLAYER WALKING

========================================================= */

function updatePlayer(dt){

    const x=

    controls.joyX;

    const y=

    controls.joyY;

    const amount=

    Math.min(

        1,

        Math.hypot(

            x,y

        )

    );

    if(

        amount>.08

    ){

        const forward=

        new THREE.Vector3();

        camera.getWorldDirection(

            forward

        );

        forward.y=0;

        forward.normalize();

        const right=

        new THREE.Vector3(

            -forward.z,

            0,

            forward.x

        );

        const move=

        new THREE.Vector3();

        move.addScaledVector(

            right,

            x

        );

        move.addScaledVector(

            forward,

            -y

        );

        move.normalize();

        const walkSpeed=

        controls.run

        ? 7.0

        : 3.7;

        const oldPos=

        player.position.clone();

        player.position.addScaledVector(

            move,

            walkSpeed*

            amount*

            dt

        );

        if(

            collidesWithBuilding(

                player.position,

                .5

            )

        ){

            player.position.copy(

                oldPos

            );

        }

        playerHeading=

        Math.atan2(

            move.x,

            move.z

        );

        player.rotation.y=

        playerHeading;

        speedText.textContent=

        controls.run

        ? "RUNNING"

        : "WALKING";

    }

    else{

        speedText.textContent=

        "ON FOOT";

    }

    updateEnterButton();

}

/* =========================================================

   ENTER / EXIT

========================================================= */

function exitVehicle(){

    if(

        mode!=="vehicle"

    ) return;

    if(

        Math.abs(speed)>2.2

    ){

        actionButton.textContent=

        "SLOW DOWN";

        setTimeout(()=>{

            if(

                mode==="vehicle"

            ){

                actionButton.textContent=

                "EXIT";

            }

        },700);

        return;

    }

    speed=0;

    velocityHeading=heading;

    mode="walking";

    const leftSide=

    new THREE.Vector3(

        -Math.cos(heading),

        0,

        Math.sin(heading)

    );

    player.position.copy(

        car.position

    );

    player.position.addScaledVector(

        leftSide,

        2.2

    );

    player.position.y=0;

    playerHeading=heading;

    player.rotation.y=heading;

    player.visible=true;

    vehicleControls.style.display=

    "none";

    runButton.style.display=

    "block";

    actionButton.style.display=

    "none";

    statusText.textContent=

    "ON FOOT";

    surfaceText.textContent=

    "";

    resetStick();

}

function enterVehicle(){

    if(

        mode!=="walking"

    ) return;

    if(

        player.position.distanceTo(

            car.position

        )>4.5

    ){

        return;

    }

    mode="vehicle";

    player.visible=false;

    heading=

    car.rotation.y;

    velocityHeading=

    heading;

    vehicleControls.style.display=

    "block";

    runButton.style.display=

    "none";

    actionButton.style.display=

    "block";

    actionButton.textContent=

    "EXIT";

    statusText.textContent=

    "IN VEHICLE";

    resetStick();

}

function updateEnterButton(){

    if(

        mode!=="walking"

    ) return;

    const distance=

    player.position.distanceTo(

        car.position

    );

    if(

        distance<=4.5

    ){

        actionButton.style.display=

        "block";

        actionButton.textContent=

        "ENTER CAR";

    }

    else{

        actionButton.style.display=

        "none";

    }

}

actionButton.addEventListener(

    "pointerdown",

    e=>{

        e.preventDefault();

        if(

            mode==="vehicle"

        ){

            exitVehicle();

        }

        else{

            enterVehicle();

        }

    }

);

/* =========================================================

   IMPROVED CAMERA

========================================================= */

const desiredCamera=

new THREE.Vector3();

const cameraLook=

new THREE.Vector3();

const cameraForward=

new THREE.Vector3();

function updateCamera(dt){

    if(

        mode==="vehicle"

    ){

        const speedRatio=

        Math.min(

            Math.abs(speed)/

            MAX_ROAD_SPEED,

            1

        );

        /*

        Camera gets farther away

        as speed increases.

        */

        const distance=

        THREE.MathUtils.lerp(

            8.6,

            11.5,

            speedRatio

        );

        const height=

        THREE.MathUtils.lerp(

            4.4,

            5.8,

            speedRatio

        );

        /*

        camera remains behind

        actual car heading

        */

        const back=

        new THREE.Vector3(

            Math.sin(heading),

            0,

            Math.cos(heading)

        );

        desiredCamera.copy(

            car.position

        );

        desiredCamera.addScaledVector(

            back,

            distance

        );

        desiredCamera.y+=height;

        /*

        Smooth positional camera

        */

        const follow=

        1-

        Math.pow(

            .0025,

            dt

        );

        camera.position.lerp(

            desiredCamera,

            follow

        );

        cameraLook.copy(

            car.position

        );

        /*

        look slightly ahead

        */

        const forward=

        new THREE.Vector3(

            -Math.sin(heading),

            0,

            -Math.cos(heading)

        );

        cameraLook.addScaledVector(

            forward,

            3+

            speedRatio*4

        );

        cameraLook.y=

        1.25;

        camera.lookAt(

            cameraLook

        );

        /*

        Speed FOV effect

        */

        const targetFov=

        66+

        speedRatio*7;

        camera.fov=

        THREE.MathUtils.lerp(

            camera.fov,

            targetFov,

            .06

        );

        camera.updateProjectionMatrix();

    }

    else{

        const back=

        new THREE.Vector3(

            Math.sin(

                playerHeading

            ),

            0,

            Math.cos(

                playerHeading

            )

        );

        desiredCamera.copy(

            player.position

        );

        desiredCamera.addScaledVector(

            back,

            5.3

        );

        desiredCamera.y+=3.5;

        camera.position.lerp(

            desiredCamera,

            1-

            Math.pow(

                .004,

                dt

            )

        );

        cameraLook.copy(

            player.position

        );

        cameraLook.y=1.3;

        camera.lookAt(

            cameraLook

        );

        camera.fov=

        THREE.MathUtils.lerp(

            camera.fov,

            66,

            .08

        );

        camera.updateProjectionMatrix();

    }

}

/* =========================================================

   MISSION

========================================================= */

let missionNumber=1;

const missionPoints=[

    new THREE.Vector3(

        180,0,-180

    ),

    new THREE.Vector3(

        -180,0,180

    ),

    new THREE.Vector3(

        270,0,90

    ),

    new THREE.Vector3(

        -270,0,-90

    )

];

function updateMission(time){

    ring.rotation.z+=.012;

    ring.position.y=

    1.5+

    Math.sin(

        time*.003

    )*.3;

    const pos=

    mode==="vehicle"

    ? car.position

    : player.position;

    const dist=

    pos.distanceTo(

        checkpoint.position

    );

    missionText.textContent=

    "MISSION "+

    missionNumber+

    ": Reach checkpoint — "+

    Math.round(dist)+

    " m";

    if(

        dist<7

    ){

        missionText.textContent=

        "MISSION COMPLETE! +$500";

        missionNumber++;

        const next=

        missionPoints[

            (missionNumber-1)%

            missionPoints.length

        ];

        checkpoint.position.copy(

            next

        );

    }

}

/* =========================================================

   INITIAL CAMERA

========================================================= */

camera.position.set(

    0,

    5,

    10

);

camera.lookAt(

    car.position

);

/* =========================================================

   MAIN LOOP

========================================================= */

const clock=

new THREE.Clock();

function animate(time){

    requestAnimationFrame(

        animate

    );

    let dt=

    clock.getDelta();

    dt=

    Math.min(

        dt,

        .04

    );

    if(

        mode==="vehicle"

    ){

        updateVehicle(dt);

    }

    else{

        updatePlayer(dt);

    }

    updateCamera(dt);

    updateMission(time);

    renderer.render(

        scene,

        camera

    );

}

requestAnimationFrame(

    animate

);

/* =========================================================

   RESIZE

========================================================= */

window.addEventListener(

    "resize",

    ()=>{

        camera.aspect=

        innerWidth/

        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(

            innerWidth,

            innerHeight

        );

    }

);

document.addEventListener(

    "gesturestart",

    e=>e.preventDefault()

);

document.addEventListener(

    "contextmenu",

    e=>e.preventDefault()

);

</script>
