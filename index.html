<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"

        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Utica Drive</title>

  <link rel="stylesheet" href="./style.css" />

</head>

<body>

  <div id="game"></div>

  <div id="loading">

    <div class="loading-box">

      <div class="title">UTICA DRIVE</div>

      <div id="loadingText">Loading Utica, New York...</div>

      <div class="loader"></div>

    </div>

  </div>

  <div id="hud">

    <div id="locationLabel">UTICA, NY</div>

    <div id="modeLabel">DRIVING</div>

    <div id="speedLabel">0 MPH</div>

  </div>

  <!-- Walking joystick -->

  <div id="joystickArea">

    <div id="joystickBase">

      <div id="joystickKnob"></div>

    </div>

  </div>

  <!-- Driving steering -->

  <div id="steeringArea">

    <button id="leftBtn" class="control round">◀</button>

    <button id="rightBtn" class="control round">▶</button>

  </div>

  <!-- Vehicle buttons -->

  <div id="pedals">

    <button id="gasBtn" class="control pedal gas">GAS</button>

    <button id="brakeBtn" class="control pedal brake">BRAKE</button>

    <button id="reverseBtn" class="control pedal reverse">REVERSE</button>

  </div>

  <!-- Interaction buttons -->

  <div id="actions">

    <button id="enterExitBtn" class="control action">EXIT</button>

    <button id="runBtn" class="control action">RUN</button>

  </div>

  <div id="message"></div>

  <script type="module" src="./app.js"></script>

</body>

</html>
