<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta

    name="viewport"

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

  />

  <title>Utica Open World</title>

  <link

    href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"

    rel="stylesheet"

  />

  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

      -webkit-user-select: none;

      user-select: none;

      touch-action: none;

    }

    html,

    body {

      width: 100%;

      height: 100%;

      overflow: hidden;

      background: #111;

      font-family: Arial, Helvetica, sans-serif;

    }

    #map {

      position: fixed;

      inset: 0;

      width: 100%;

      height: 100%;

    }

    /* DARK GTA-LIKE MAP FILTER */

    #map canvas {

      filter:

        saturate(0.65)

        brightness(0.82)

        contrast(1.12);

    }

    #topHud {

      position: fixed;

      top: 14px;

      left: 14px;

      right: 14px;

      display: flex;

      justify-content: space-between;

      align-items: flex-start;

      z-index: 20;

      pointer-events: none;

    }

    .panel {

      background: rgba(0, 0, 0, 0.72);

      color: white;

      border: 1px solid rgba(255,255,255,0.22);

      border-radius: 14px;

      padding: 10px 13px;

      box-shadow: 0 4px 20px rgba(0,0,0,0.35);

      backdrop-filter: blur(7px);

    }

    #title {

      font-size: 16px;

      font-weight: 800;

      letter-spacing: 1px;

    }

    #location {

      font-size: 11px;

      opacity: 0.8;

      margin-top: 3px;

    }

    #speedBox {

      text-align: right;

      min-width: 96px;

    }

    #speed {

      font-size: 28px;

      font-weight: 900;

      line-height: 26px;

    }

    #mph {

      font-size: 10px;

      opacity: 0.75;

      letter-spacing: 2px;

    }

    #money {

      margin-top: 4px;

      color: #61ff7d;

      font-size: 13px;

      font-weight: bold;

    }

    #mission {

      position: fixed;

      top: 102px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 20;

      background: rgba(0,0,0,0.7);

      color: white;

      padding: 8px 14px;

      border-radius: 20px;

      font-size: 12px;

      border: 1px solid rgba(255,255,255,0.2);

      pointer-events: none;

      white-space: nowrap;

    }

    /* PLAYER CAR */

    #carMarker {

      width: 42px;

      height: 66px;

      position: relative;

      transform-origin: center center;

      pointer-events: none;

    }

    .carBody {

      position: absolute;

      width: 28px;

      height: 54px;

      left: 7px;

      top: 5px;

      border-radius: 8px 8px 11px 11px;

      background: linear-gradient(

        90deg,

        #163bb5,

        #3879ff 45%,

        #77a8ff 52%,

        #1c52d8

      );

      border: 2px solid #0b1e52;

      box-shadow:

        0 0 10px rgba(55, 125, 255, 0.8),

        0 7px 7px rgba(0,0,0,0.55);

    }

    .windshield {

      position: absolute;

      width: 20px;

      height: 13px;

      left: 11px;

      top: 15px;

      background: rgba(12, 28, 48, 0.9);

      border-radius: 4px 4px 2px 2px;

    }

    .rearWindow {

      position: absolute;

      width: 19px;

      height: 10px;

      left: 11.5px;

      top: 38px;

      background: rgba(12, 28, 48, 0.9);

      border-radius: 2px 2px 4px 4px;

    }

    .headlight {

      position: absolute;

      width: 6px;

      height: 3px;

      top: 7px;

      background: #fff3a7;

      box-shadow: 0 0 7px #fff2a0;

      border-radius: 3px;

    }

    .headlight.left {

      left: 10px;

    }

    .headlight.right {

      right: 10px;

    }

    .taillight {

      position: absolute;

      width: 6px;

      height: 3px;

      bottom: 7px;

      background: #ff2828;

      box-shadow: 0 0 7px #ff2020;

      border-radius: 3px;

    }

    .taillight.left {

      left: 10px;

    }

    .taillight.right {

      right: 10px;

    }

    /* CONTROLS */

    #controls {

      position: fixed;

      left: 0;

      right: 0;

      bottom: 22px;

      height: 180px;

      z-index: 30;

      pointer-events: none;

    }

    .controlButton {

      pointer-events: auto;

      position: absolute;

      display: flex;

      justify-content: center;

      align-items: center;

      color: white;

      background: rgba(20, 20, 20, 0.74);

      border: 2px solid rgba(255,255,255,0.28);

      box-shadow:

        inset 0 0 12px rgba(255,255,255,0.05),

        0 4px 15px rgba(0,0,0,0.45);

      font-weight: 900;

      backdrop-filter: blur(6px);

      -webkit-tap-highlight-color: transparent;

    }

    .controlButton.active {

      background: rgba(65, 115, 255, 0.85);

      transform: scale(0.94);

    }

    #leftBtn {

      width: 74px;

      height: 74px;

      border-radius: 50%;

      left: 18px;

      bottom: 25px;

      font-size: 31px;

    }

    #rightBtn {

      width: 74px;

      height: 74px;

      border-radius: 50%;

      left: 102px;

      bottom: 25px;

      font-size: 31px;

    }

    #gasBtn {

      width: 82px;

      height: 116px;

      border-radius: 22px;

      right: 18px;

      bottom: 36px;

      font-size: 15px;

      background: rgba(26, 125, 51, 0.76);

    }

    #brakeBtn {

      width: 70px;

      height: 86px;

      border-radius: 20px;

      right: 110px;

      bottom: 18px;

      font-size: 12px;

      background: rgba(150, 26, 26, 0.76);

    }

    #boostBtn {

      width: 65px;

      height: 50px;

      border-radius: 18px;

      right: 112px;

      bottom: 115px;

      font-size: 10px;

      background: rgba(35, 88, 185, 0.82);

    }

    #resetBtn {

      position: fixed;

      z-index: 40;

      right: 15px;

      top: 116px;

      width: 45px;

      height: 45px;

      border-radius: 50%;

      border: 1px solid rgba(255,255,255,0.25);

      background: rgba(0,0,0,0.7);

      color: white;

      font-size: 19px;

    }

    #zoomHint {

      position: fixed;

      bottom: 8px;

      width: 100%;

      text-align: center;

      color: rgba(255,255,255,0.45);

      font-size: 9px;

      z-index: 10;

      pointer-events: none;

    }

    /* LOADING SCREEN */

    #loading {

      position: fixed;

      inset: 0;

      background:

        radial-gradient(circle at center, #182747, #080b12 70%);

      z-index: 100;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      color: white;

      transition: opacity 0.6s ease;

    }

    #loading h1 {

      font-size: 32px;

      letter-spacing: 3px;

      margin-bottom: 8px;

    }

    #loading p {

      font-size: 13px;

      opacity: 0.7;

    }

    .loader {

      width: 150px;

      height: 4px;

      background: rgba(255,255,255,0.15);

      border-radius: 3px;

      margin-top: 25px;

      overflow: hidden;

    }

    .loader::after {

      content: "";

      display: block;

      height: 100%;

      width: 45%;

      background: white;

      border-radius: 3px;

      animation: loading 1.2s infinite ease-in-out;

    }

    @keyframes loading {

      0% {

        transform: translateX(-110%);

      }

      100% {

        transform: translateX(330%);

      }

    }

  </style>

</head>

<body>

  <div id="map"></div>

  <div id="loading">

    <h1>UTICA</h1>

    <p>OPEN WORLD</p>

    <div class="loader"></div>

  </div>

  <div id="topHud">

    <div class="panel">

      <div id="title">UTICA OPEN WORLD</div>

      <div id="location">Downtown Utica, New York</div>

      <div id="money">$2,500</div>

    </div>

    <div class="panel" id="speedBox">

      <div id="speed">0</div>

      <div id="mph">MPH</div>

    </div>

  </div>

  <div id="mission">

    Free Roam — Explore Utica

  </div>

  <button id="resetBtn">↻</button>

  <div id="controls">

    <div class="controlButton" id="leftBtn">

      ◀

    </div>

    <div class="controlButton" id="rightBtn">

      ▶

    </div>

    <div class="controlButton" id="boostBtn">

      BOOST

    </div>

    <div class="controlButton" id="brakeBtn">

      BRAKE

    </div>

    <div class="controlButton" id="gasBtn">

      GAS

    </div>

  </div>

  <div id="zoomHint">

    Drive using the controls

  </div>

  <script>

    /* =====================================================

       UTICA OPEN WORLD

       PHONE DRIVING GAME

       ===================================================== */

    const STARTING_POSITION = {

      lng: -75.2327,

      lat: 43.1009

    };

    let player = {

      lng: STARTING_POSITION.lng,

      lat: STARTING_POSITION.lat,

      angle: 0,

      speed: 0

    };

    let keys = {

      gas: false,

      brake: false,

      left: false,

      right: false,

      boost: false

    };

    const normalTopSpeed = 0.000035;

    const boostTopSpeed = 0.000055;

    const acceleration = 0.00000105;

    const reverseAcceleration = 0.00000065;

    const drag = 0.00000042;

    const braking = 0.0000017;

    const map = new maplibregl.Map({

      container: "map",

      style: {

        version: 8,

        sources: {

          osm: {

            type: "raster",

            tiles: [

              "https://tile.openstreetmap.org/{z}/{x}/{y}.png"

            ],

            tileSize: 256,

            attribution:

              "© OpenStreetMap contributors"

          }

        },

        layers: [

          {

            id: "osm",

            type: "raster",

            source: "osm"

          }

        ]

      },

      center: [

        player.lng,

        player.lat

      ],

      zoom: 16.7,

      pitch: 58,

      bearing: 0,

      maxZoom: 19,

      minZoom: 12,

      attributionControl: true,

      dragPan: false,

      dragRotate: false,

      scrollZoom: false,

      doubleClickZoom: false,

      touchZoomRotate: false

    });

    /* =====================================================

       CAR

       ===================================================== */

    const carElement =

      document.createElement("div");

    carElement.id = "carMarker";

    carElement.innerHTML = `

      <div class="carBody"></div>

      <div class="windshield"></div>

      <div class="rearWindow"></div>

      <div class="headlight left"></div>

      <div class="headlight right"></div>

      <div class="taillight left"></div>

      <div class="taillight right"></div>

    `;

    const marker = new maplibregl.Marker({

      element: carElement,

      anchor: "center",

      rotationAlignment: "map"

    })

      .setLngLat([

        player.lng,

        player.lat

      ])

      .addTo(map);

    /* =====================================================

       MAP LOADED

       ===================================================== */

    map.on("load", () => {

      setTimeout(() => {

        document.getElementById("loading")

          .style.opacity = "0";

        setTimeout(() => {

          document.getElementById("loading")

            .style.display = "none";

        }, 650);

      }, 900);

    });

    /* =====================================================

       TOUCH CONTROLS

       ===================================================== */

    function setupButton(id, key) {

      const button =

        document.getElementById(id);

      function down(event) {

        event.preventDefault();

        keys[key] = true;

        button.classList.add("active");

        if (navigator.vibrate) {

          navigator.vibrate(8);

        }

      }

      function up(event) {

        if (event) {

          event.preventDefault();

        }

        keys[key] = false;

        button.classList.remove("active");

      }

      button.addEventListener(

        "pointerdown",

        down

      );

      button.addEventListener(

        "pointerup",

        up

      );

      button.addEventListener(

        "pointercancel",

        up

      );

      button.addEventListener(

        "pointerleave",

        up

      );

    }

    setupButton(

      "gasBtn",

      "gas"

    );

    setupButton(

      "brakeBtn",

      "brake"

    );

    setupButton(

      "leftBtn",

      "left"

    );

    setupButton(

      "rightBtn",

      "right"

    );

    setupButton(

      "boostBtn",

      "boost"

    );

    /* =====================================================

       KEYBOARD CONTROLS TOO

       ===================================================== */

    window.addEventListener(

      "keydown",

      (event) => {

        if (

          event.key === "ArrowUp" ||

          event.key === "w"

        ) {

          keys.gas = true;

        }

        if (

          event.key === "ArrowDown" ||

          event.key === "s"

        ) {

          keys.brake = true;

        }

        if (

          event.key === "ArrowLeft" ||

          event.key === "a"

        ) {

          keys.left = true;

        }

        if (

          event.key === "ArrowRight" ||

          event.key === "d"

        ) {

          keys.right = true;

        }

        if (event.key === "Shift") {

          keys.boost = true;

        }

      }

    );

    window.addEventListener(

      "keyup",

      (event) => {

        if (

          event.key === "ArrowUp" ||

          event.key === "w"

        ) {

          keys.gas = false;

        }

        if (

          event.key === "ArrowDown" ||

          event.key === "s"

        ) {

          keys.brake = false;

        }

        if (

          event.key === "ArrowLeft" ||

          event.key === "a"

        ) {

          keys.left = false;

        }

        if (

          event.key === "ArrowRight" ||

          event.key === "d"

        ) {

          keys.right = false;

        }

        if (event.key === "Shift") {

          keys.boost = false;

        }

      }

    );

    /* =====================================================

       RESET

       ===================================================== */

    document

      .getElementById("resetBtn")

      .addEventListener(

        "click",

        () => {

          player.lng =

            STARTING_POSITION.lng;

          player.lat =

            STARTING_POSITION.lat;

          player.angle = 0;

          player.speed = 0;

          map.jumpTo({

            center: [

              player.lng,

              player.lat

            ],

            zoom: 16.7,

            bearing: 0,

            pitch: 58

          });

        }

      );

    /* =====================================================

       GAME LOOP

       ===================================================== */

    function update() {

      let topSpeed =

        keys.boost

          ? boostTopSpeed

          : normalTopSpeed;

      /* GAS */

      if (keys.gas) {

        player.speed +=

          acceleration;

      }

      /* BRAKE / REVERSE */

      if (keys.brake) {

        if (player.speed > 0) {

          player.speed -=

            braking;

        }

        else {

          player.speed -=

            reverseAcceleration;

        }

      }

      /* DRAG */

      if (

        !keys.gas &&

        !keys.brake

      ) {

        if (player.speed > 0) {

          player.speed -= drag;

          if (player.speed < 0) {

            player.speed = 0;

          }

        }

        else if (player.speed < 0) {

          player.speed += drag;

          if (player.speed > 0) {

            player.speed = 0;

          }

        }

      }

      /* SPEED LIMIT */

      if (

        player.speed >

        topSpeed

      ) {

        player.speed =

          topSpeed;

      }

      if (

        player.speed <

        -normalTopSpeed * 0.45

      ) {

        player.speed =

          -normalTopSpeed * 0.45;

      }

      /* STEERING */

      const moving =

        Math.abs(player.speed) >

        0.000001;

      if (moving) {

        let turnRate =

          2.2;

        if (

          Math.abs(player.speed) >

          normalTopSpeed * 0.7

        ) {

          turnRate = 1.65;

        }

        if (player.speed < 0) {

          turnRate *= -1;

        }

        if (keys.left) {

          player.angle -=

            turnRate;

        }

        if (keys.right) {

          player.angle +=

            turnRate;

        }

      }

      /* MOVE */

      const radians =

        player.angle *

        Math.PI /

        180;

      player.lng +=

        Math.sin(radians) *

        player.speed;

      player.lat +=

        Math.cos(radians) *

        player.speed;

      /* UPDATE CAR */

      marker.setLngLat([

        player.lng,

        player.lat

      ]);

      marker.setRotation(

        player.angle

      );

      /* CAMERA */

      const cameraDistance =

        0.00028;

      const cameraLng =

        player.lng -

        Math.sin(radians) *

        cameraDistance;

      const cameraLat =

        player.lat -

        Math.cos(radians) *

        cameraDistance;

      map.easeTo({

        center: [

          cameraLng,

          cameraLat

        ],

        bearing:

          -player.angle,

        pitch: 58,

        duration: 80,

        easing: t => t

      });

      /* SPEED DISPLAY */

      const speedRatio =

        Math.abs(player.speed) /

        normalTopSpeed;

      let mph =

        Math.round(

          speedRatio * 92

        );

      if (keys.boost) {

        mph =

          Math.round(

            (

              Math.abs(player.speed) /

              boostTopSpeed

            ) *

            135

          );

      }

      document

        .getElementById("speed")

        .textContent =

          mph;

      requestAnimationFrame(

        update

      );

    }

    update();

    /* =====================================================

       STOP BUTTONS IF APP LOSES FOCUS

       ===================================================== */

    window.addEventListener(

      "blur",

      () => {

        keys.gas = false;

        keys.brake = false;

        keys.left = false;

        keys.right = false;

        keys.boost = false;

        document

          .querySelectorAll(

            ".controlButton"

          )

          .forEach(

            button =>

              button.classList.remove(

                "active"

              )

          );

      }

    );

  </script>

</body>

</html>
