<script type="module">

import * as THREE from "three";

/* ==================================================

   UTICA DRIVE

   GTA-style mobile open world prototype

================================================== */

const CONFIG = {

  // Downtown Utica / Genesee Street area

  centerLat:43.1009,

  centerLon:-75.2327,

  // How much real-world map is downloaded around center

  // Increased values create more city but use more phone memory.

  mapRadius:0.022,

  metersPerLat:111320,

  playerHeight:1.78,

  walkSpeed:4.2,

  runSpeed:7.2,

  maxCarSpeed:31,

  maxReverseSpeed:10,

  acceleration:13,

  braking:20,

  drag:2.3,

  steeringSpeed:1.65

};

/* ==================================================

   DOM

================================================== */

const loading = document.getElementById("loading");

const loadingText = document.getElementById("loadingText");

const modeText = document.getElementById("mode");

const speedText = document.getElementById("speed");

const streetText = document.getElementById("street");

const walkControls = document.getElementById("walkControls");

const actionControls = document.getElementById("actionControls");

const driveControls = document.getElementById("driveControls");

const missionText = document.getElementById("mission");

const wantedText = document.getElementById("wanted");

const messageBox = document.getElementById("message");

/* ==================================================

   THREE.JS

================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x86b7dc);

scene.fog = new THREE.FogExp2(0x9dbed6,0.0017);

const camera = new THREE.PerspectiveCamera(

  64,

  innerWidth / innerHeight,

  0.1,

  3500

);

const renderer = new THREE.WebGLRenderer({

  antialias:true,

  powerPreference:"high-performance"

});

renderer.setPixelRatio(

  Math.min(window.devicePixelRatio,1.8)

);

renderer.setSize(innerWidth,innerHeight);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type = THREE.PCFSoftShadowMap;

renderer.outputColorSpace = THREE.SRGBColorSpace;

document.getElementById("game").appendChild(

  renderer.domElement

);

/* ==================================================

   LIGHTING

================================================== */

const hemi = new THREE.HemisphereLight(

  0xcbe8ff,

  0x59624b,

  2.0

);

scene.add(hemi);

const sun = new THREE.DirectionalLight(

  0xfff3d5,

  3.5

);

sun.position.set(-100,180,100);

sun.castShadow = true;

sun.shadow.mapSize.set(1024,1024);

sun.shadow.camera.left = -180;

sun.shadow.camera.right = 180;

sun.shadow.camera.top = 180;

sun.shadow.camera.bottom = -180;

scene.add(sun);

/* ==================================================

   WORLD

================================================== */

const world = new THREE.Group();

scene.add(world);

const ground = new THREE.Mesh(

  new THREE.PlaneGeometry(6000,6000),

  new THREE.MeshStandardMaterial({

    color:0x557349,

    roughness:1

  })

);

ground.rotation.x = -Math.PI/2;

ground.receiveShadow = true;

world.add(ground);

/* ==================================================

   COORDINATE CONVERSION

================================================== */

const metersPerLon =

  111320 *

  Math.cos(CONFIG.centerLat*Math.PI/180);

function gpsToWorld(lat,lon){

  const x =

    (lon-CONFIG.centerLon) *

    metersPerLon;

  const z =

    -(lat-CONFIG.centerLat) *

    CONFIG.metersPerLat;

  return new THREE.Vector3(x,0,z);

}

/* ==================================================

   MAP DATA

================================================== */

const streets = [];

function distancePointToSegment(px,pz,ax,az,bx,bz){

  const abx=bx-ax;

  const abz=bz-az;

  const apx=px-ax;

  const apz=pz-az;

  const len2=abx*abx+abz*abz;

  if(len2===0)

    return Math.hypot(px-ax,pz-az);

  let t=(apx*abx+apz*abz)/len2;

  t=Math.max(0,Math.min(1,t));

  const cx=ax+abx*t;

  const cz=az+abz*t;

  return Math.hypot(px-cx,pz-cz);

}

async function loadUticaMap(){

  loadingText.textContent =

    "Downloading Utica streets and buildings...";

  const r=CONFIG.mapRadius;

  const south=CONFIG.centerLat-r;

  const north=CONFIG.centerLat+r;

  const west=CONFIG.centerLon-r*1.35;

  const east=CONFIG.centerLon+r*1.35;

  const query=`

  [out:json][timeout:35];

  (

    way["highway"](${south},${west},${north},${east});

    way["building"](${south},${west},${north},${east});

  );

  out geom;

  `;

  try{

    const url=

      "https://overpass-api.de/api/interpreter?data="+

      encodeURIComponent(query);

    const response=await fetch(url);

    if(!response.ok)

      throw new Error("Map server error");

    const json=await response.json();

    loadingText.textContent =

      "Creating the 3D city...";

    createMap(json.elements);

  }catch(error){

    console.error(error);

    loadingText.textContent =

      "Map server unavailable — loading backup city.";

    createBackupUtica();

  }

}

/* ==================================================

   ROADS

================================================== */

function roadWidth(tags){

  switch(tags.highway){

    case "motorway":

    case "trunk":

      return 13;

    case "primary":

      return 11;

    case "secondary":

      return 9;

    case "tertiary":

      return 8;

    case "residential":

      return 6.5;

    case "service":

      return 4.5;

    default:

      return 5.5;

  }

}

function createRoad(way){

  if(!way.geometry || way.geometry.length<2)

    return;

  const width=roadWidth(way.tags||{});

  const name=

    way.tags?.name ||

    "";

  for(let i=0;i<way.geometry.length-1;i++){

    const a=gpsToWorld(

      way.geometry[i].lat,

      way.geometry[i].lon

    );

    const b=gpsToWorld(

      way.geometry[i+1].lat,

      way.geometry[i+1].lon

    );

    const dx=b.x-a.x;

    const dz=b.z-a.z;

    const len=Math.hypot(dx,dz);

    if(len<1)

      continue;

    const road=new THREE.Mesh(

      new THREE.PlaneGeometry(width,len),

      new THREE.MeshStandardMaterial({

        color:0x34383d,

        roughness:.92

      })

    );

    road.rotation.x=-Math.PI/2;

    road.rotation.z=

      Math.atan2(-dx,dz);

    road.position.set(

      (a.x+b.x)/2,

      .035,

      (a.z+b.z)/2

    );

    road.receiveShadow=true;

    world.add(road);

    streets.push({

      name:name,

      ax:a.x,

      az:a.z,

      bx:b.x,

      bz:b.z

    });

  }

  if(name)

    addStreetLabel(way,name);

}

/* ==================================================

   STREET NAMES

================================================== */

function makeTextSprite(text){

  const canvas=document.createElement("canvas");

  canvas.width=512;

  canvas.height=96;

  const ctx=canvas.getContext("2d");

  ctx.clearRect(0,0,512,96);

  ctx.fillStyle="rgba(0,0,0,.70)";

  ctx.fillRect(4,16,504,64);

  ctx.font="bold 31px Arial";

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.fillStyle="white";

  ctx.fillText(

    text.toUpperCase(),

    256,

    48

  );

  const texture=

    new THREE.CanvasTexture(canvas);

  texture.colorSpace=

    THREE.SRGBColorSpace;

  const sprite=

    new THREE.Sprite(

      new THREE.SpriteMaterial({

        map:texture,

        transparent:true,

        depthWrite:false

      })

    );

  sprite.scale.set(18,3.4,1);

  return sprite;

}

function addStreetLabel(way,name){

  const geom=way.geometry;

  if(!geom || geom.length<2)

    return;

  const mid=

    geom[

      Math.floor(geom.length/2)

    ];

  const p=

    gpsToWorld(mid.lat,mid.lon);

  const label=

    makeTextSprite(name);

  label.position.set(

    p.x,

    3.1,

    p.z

  );

  world.add(label);

}

/* ==================================================

   BUILDINGS

================================================== */

function createBuilding(way){

  if(!way.geometry || way.geometry.length<3)

    return;

  const pts=[];

  for(const g of way.geometry){

    const p=gpsToWorld(g.lat,g.lon);

    pts.push(

      new THREE.Vector2(

        p.x,

        -p.z

      )

    );

  }

  const shape=

    new THREE.Shape(pts);

  let height=9;

  if(way.tags?.height){

    const h=

      parseFloat(way.tags.height);

    if(Number.isFinite(h))

      height=h;

  }else if(way.tags?.["building:levels"]){

    height=

      parseFloat(

        way.tags["building:levels"]

      )*3.2;

  }else{

    height=

      6+

      Math.random()*9;

  }

  height=

    THREE.MathUtils.clamp(

      height,

      3,

      70

    );

  const geometry=

    new THREE.ExtrudeGeometry(

      shape,

      {

        depth:height,

        bevelEnabled:false

      }

    );

  geometry.rotateX(Math.PI/2);

  const palette=[

    0xc5b39a,

    0x9f8f7c,

    0xc1c4c2,

    0xa79787,

    0xb76f56,

    0xe0d4bb

  ];

  const color=

    palette[

      Math.floor(

        Math.random()*palette.length

      )

    ];

  const building=

    new THREE.Mesh(

      geometry,

      new THREE.MeshStandardMaterial({

        color,

        roughness:.78

      })

    );

  building.castShadow=true;

  building.receiveShadow=true;

  world.add(building);

}

/* ==================================================

   CREATE MAP

================================================== */

function createMap(elements){

  let roadCount=0;

  let buildingCount=0;

  for(const way of elements){

    if(way.tags?.highway){

      createRoad(way);

      roadCount++;

    }else if(way.tags?.building){

      if(buildingCount<1600){

        createBuilding(way);

        buildingCount++;

      }

    }

  }

  console.log(

    "Roads:",

    roadCount,

    "Buildings:",

    buildingCount

  );

}

/* ==================================================

   BACKUP CITY

================================================== */

function createBackupUtica(){

  const names=[

    "GENESEE STREET",

    "BROAD STREET",

    "COURT STREET",

    "COLUMBIA STREET",

    "BLEECKER STREET",

    "LAFAYETTE STREET",

    "ONEIDA STREET"

  ];

  for(let i=-5;i<=5;i++){

    addBackupRoad(

      i*55,

      0,

      7,

      700,

      names[

        Math.abs(i)%names.length

      ]

    );

  }

  for(let i=-5;i<=5;i++){

    addBackupRoad(

      0,

      i*65,

      700,

      7,

      names[

        Math.abs(i+3)%names.length

      ]

    );

  }

  for(let x=-300;x<300;x+=35){

    for(let z=-300;z<300;z+=38){

      if(

        Math.abs(x%55)<14 ||

        Math.abs(z%65)<14

      ) continue;

      const h=7+Math.random()*18;

      const b=new THREE.Mesh(

        new THREE.BoxGeometry(

          24,

          h,

          26

        ),

        new THREE.MeshStandardMaterial({

          color:

            0x999999+

            Math.floor(

              Math.random()*0x333333

            )

        })

      );

      b.position.set(

        x,

        h/2,

        z

      );

      b.castShadow=true;

      b.receiveShadow=true;

      world.add(b);

    }

  }

}

function addBackupRoad(

  x,

  z,

  width,

  length,

  name

){

  const road=new THREE.Mesh(

    new THREE.PlaneGeometry(

      width,

      length

    ),

    new THREE.MeshStandardMaterial({

      color:0x33373b

    })

  );

  road.rotation.x=-Math.PI/2;

  if(width>length)

    road.rotation.z=Math.PI/2;

  road.position.set(x,.03,z);

  world.add(road);

  const label=

    makeTextSprite(name);

  label.position.set(

    x,

    3,

    z

  );

  world.add(label);

}

/* ==================================================

   CHARACTER

================================================== */

const player=

  new THREE.Group();

scene.add(player);

function createPlayer(){

  const clothes=

    new THREE.MeshStandardMaterial({

      color:0x252f38,

      roughness:.8

    });

  const skin=

    new THREE.MeshStandardMaterial({

      color:0xb47b55

    });

    new THREE.Mesh(

      new THREE.CapsuleGeometry(

        .28,

        .65,

        5,

      ),

      clothes

    );

  torso.position.y=1.08;

  player.add(torso);

  const head=

    new THREE.Mesh(

      new THREE.SphereGeometry(

        .22,

        18,

        14

      ),

      skin

    );

  head.position.y=1.73;

  player.add(head);

  const legGeo=

    new THREE.CapsuleGeometry(

      .095,

      .62,

      4,

      8

    );

  const leftLeg=

    new THREE.Mesh(

      legGeo,

      clothes

    );

  leftLeg.position.set(

    -.13,

    .42,

    0

  );

  const rightLeg=

    leftLeg.clone();

  rightLeg.position.x=.13;

  player.add(leftLeg,rightLeg);

  player.traverse(o=>{

    if(o.isMesh)

      o.castShadow=true;

  });

  player.position.set(

    -3,

    0,

    6

  );

}

/* ==================================================

   CAR

================================================== */

const car=

  new THREE.Group();

scene.add(car);

let carSpeed=0;

function createCar(){

  const bodyMat=

    new THREE.MeshPhysicalMaterial({

      color:0x1a3764,

      roughness:.34,

      metalness:.38

    });

  const glassMat=

    new THREE.MeshPhysicalMaterial({

      color:0x263d4d,

      roughness:.15,

      metalness:.1

    });

  const body=

    new THREE.Mesh(

      new THREE.BoxGeometry(

        1.82,

        .55,

        4.25

      ),

      bodyMat

    );

  body.position.y=.65;

  body.castShadow=true;

  car.add(body);

  const cabin=

    new THREE.Mesh(

      new THREE.BoxGeometry(

        1.55,

        .65,

        2.05

      ),

      glassMat

    );

  cabin.position.set(

    0,

    1.13,

    -.05

  );

  cabin.castShadow=true;

  car.add(cabin);

  const wheelGeo=

    new THREE.CylinderGeometry(

      .36,

      .36,

      .25,

      18

    );

  wheelGeo.rotateZ(

    Math.PI/2

  );

  const wheelMat=

    new THREE.MeshStandardMaterial({

      color:0x111111,

      roughness:.9

    });

  const positions=[

    [-.95,.38,1.35],

    [.95,.38,1.35],

    [-.95,.38,-1.35],

    [.95,.38,-1.35]

  ];

  for(const p of positions){

    const wheel=

      new THREE.Mesh(

        wheelGeo,

        wheelMat

      );

    wheel.position.set(...p);

    wheel.castShadow=true;

    car.add(wheel);

  }

  car.position.set(

    4,

    0,

    0

  );

}

/* ==================================================

   TURFS

================================================== */

const turfs=[];

function createTurfs(){

  createTurf(

    "DOWNTOWN",

    new THREE.Vector3(80,.05,50),

    70,

    0x355fbd

  );

  createTurf(

    "WEST UTICA",

    new THREE.Vector3(-145,.05,65),

    90,

    0xb33f42

  );

  createTurf(

    "EAST UTICA",

    new THREE.Vector3(160,.05,-80),

    85,

    0x3c9358

  );

}

function createTurf(

  name,

  position,

  size,

  color

){

  const mesh=

    new THREE.Mesh(

      new THREE.CircleGeometry(

        size,

        40

      ),

      new THREE.MeshBasicMaterial({

        color,

        transparent:true,

        opacity:.13,

        depthWrite:false

      })

    );

  mesh.rotation.x=

    -Math.PI/2;

  mesh.position.copy(position);

  world.add(mesh);

  turfs.push({

    name,

    position,

    size,

    captured:false

  });

}

/* ==================================================

   INPUT

================================================== */

const input={

  forward:false,

  back:false,

  left:false,

  right:false,

  run:false,

  gas:false,

  brake:false,

  steerLeft:false,

  steerRight:false

};

function holdButton(

  id,

  field

){

  const element=

    document.getElementById(id);

  const on=e=>{

    e.preventDefault();

    input[field]=true;

  };

  const off=e=>{

    e.preventDefault();

    input[field]=false;

  };

  element.addEventListener(

    "pointerdown",

    on

  );

  element.addEventListener(

    "pointerup",

    off

  );

  element.addEventListener(

    "pointercancel",

    off

  );

  element.addEventListener(

    "pointerleave",

    off

  );

}

holdButton("forward","forward");

holdButton("back","back");

holdButton("left","left");

holdButton("right","right");

holdButton("runBtn","run");

holdButton("gas","gas");

holdButton("brake","brake");

holdButton(

  "steerLeft",

  "steerLeft"

);

holdButton(

  "steerRight",

  "steerRight"

);

/* ==================================================

   GAME STATE

================================================== */

let driving=false;

let health=100;

let armor=0;

let money=500;

let wanted=0;

let weaponEquipped=false;

let missionStage=0;

/* ==================================================

   VEHICLE ENTRY / EXIT

================================================== */

document.getElementById(

  "driveBtn"

).onclick=()=>{

  if(driving)

    return;

  const distance=

    player.position.distanceTo(

      car.position

    );

  if(distance>5){

    showMessage(

      "Walk closer to the car"

    );

    return;

  }

  enterVehicle();

};

document.getElementById(

  "exit"

).onclick=exitVehicle;

function enterVehicle(){

  driving=true;

  player.visible=false;

  walkControls.style.display="none";

  actionControls.style.display="none";

  driveControls.style.display="block";

  modeText.textContent="DRIVING";

  missionStage=1;

  missionText.textContent=

    "Mission: Drive through downtown Utica";

  showMessage(

    "Vehicle entered"

  );

}

function exitVehicle(){

  if(!driving)

    return;

  driving=false;

  carSpeed=0;

  player.visible=true;

  const right=

    new THREE.Vector3(

      1,

      0,

      0

    );

  right.applyQuaternion(

    car.quaternion

  );

  player.position

    .copy(car.position)

    .addScaledVector(

      right,

      2.4

    );

  player.rotation.y=

    car.rotation.y;

  walkControls.style.display="block";

  actionControls.style.display="flex";

  driveControls.style.display="none";

  modeText.textContent="WALKING";

  showMessage(

    "Vehicle exited"

  );

}

/* ==================================================

   WEAPON

================================================== */

document.getElementById(

  "weaponBtn"

).onclick=()=>{

  showMessage(

    ? "Weapon equipped"

    : "Weapon holstered"

  );

/* ==================================================

   PLAYER MOVEMENT

================================================== */

function updateWalking(dt){

  let forward=0;

  let side=0;

  if(input.forward)forward+=1;

  if(input.back)forward-=1;

  if(input.left)side-=1;

  if(input.right)side+=1;

  if(

    forward===0 &&

    side===0

  ) return;

  const speed=

    input.run

    ? CONFIG.runSpeed

    : CONFIG.walkSpeed;

  const cameraForward=

    new THREE.Vector3();

  camera.getWorldDirection(

    cameraForward

  );

  cameraForward.y=0;

  cameraForward.normalize();

  const right=

    new THREE.Vector3(

      cameraForward.z,

      0,

      -cameraForward.x

    );

  const move=

    new THREE.Vector3();

  move

    .addScaledVector(

      cameraForward,

      forward

    )

    .addScaledVector(

      right,

      side

    );

  move.normalize();

  player.position.addScaledVector(

    move,

    speed*dt

  );

  const targetAngle=

    Math.atan2(

      move.x,

      move.z

    );

  player.rotation.y=

    lerpAngle(

      player.rotation.y,

      targetAngle,

      Math.min(

        1,

        dt*10

      )

    );

}

/* ==================================================

   CAR PHYSICS

================================================== */

function updateCar(dt){

  if(input.gas){

    carSpeed+=

      CONFIG.acceleration*dt;

  }else if(input.brake){

    if(carSpeed>1){

      carSpeed-=

        CONFIG.braking*dt;

    }else{

      carSpeed-=

        CONFIG.acceleration*

        .75*

        dt;

    }

  }else{

    if(carSpeed>0){

      carSpeed=

        Math.max(

          0,

          carSpeed-

          CONFIG.drag*dt

        );

    }else{

      carSpeed=

        Math.min(

          0,

          carSpeed+

          CONFIG.drag*dt

        );

    }

  }

  carSpeed=

    THREE.MathUtils.clamp(

      carSpeed,

      -CONFIG.maxReverseSpeed,

      CONFIG.maxCarSpeed

    );

  let steering=0;

  if(input.steerLeft)

    steering+=1;

  if(input.steerRight)

    steering-=1;

  const speedRatio=

    Math.min(

      Math.abs(carSpeed)/

      CONFIG.maxCarSpeed,

      1

    );

  if(Math.abs(carSpeed)>.3){

    const reverseSign=

      carSpeed>=0

      ? 1

      : -1;

    car.rotation.y+=

      steering *

      CONFIG.steeringSpeed *

      dt *

      (.25+.75*speedRatio) *

      reverseSign;

  }

  const forward=

    new THREE.Vector3(

      0,

      0,

      1

    );

  forward.applyQuaternion(

    car.quaternion

  );

  car.position.addScaledVector(

    forward,

    carSpeed*dt

  );

}

/* ==================================================

   CAMERA

================================================== */

const cameraTarget=

  new THREE.Vector3();

function updateCamera(dt){

  const target=

    driving

    ? car

    : player;

  const distance=

    driving

    ? 8.7

    : 5.3;

  const height=

    driving

    ? 3.8

    : 2.9;

  const forward=

    new THREE.Vector3(

      0,

      0,

      1

    );

  forward.applyQuaternion(

    target.quaternion

  );

  const desired=

    target.position.clone()

    .add(

      new THREE.Vector3(

        0,

        height,

        0

      )

    )

    .addScaledVector(

      forward,

      -distance

    );

  const smoothing=

    1-Math.pow(

      .001,

      dt

    );

  camera.position.lerp(

    desired,

    smoothing

  );

  cameraTarget.copy(

    target.position

  );

  cameraTarget.y+=

    driving

    ? 1.25

    : 1.45;

  camera.lookAt(

    cameraTarget

  );

}

/* ==================================================

   STREET DETECTION

================================================== */

let streetTimer=0;

function updateStreet(dt){

  streetTimer-=dt;

  if(streetTimer>0)

    return;

  streetTimer=.35;

  const p=

    driving

    ? car.position

    : player.position;

  let nearest=null;

  let nearestDist=99999;

  for(const s of streets){

    if(!s.name)

      continue;

    const d=

      distancePointToSegment(

        p.x,

        p.z,

        s.ax,

        s.az,

        s.bx,

        s.bz

      );

    if(d<nearestDist){

      nearestDist=d;

      nearest=s;

    }

  }

  if(

    nearest &&

    nearestDist<45

  ){

    streetText.textContent=

      nearest.name.toUpperCase();

  }else{

    streetText.textContent=

      "UTICA, NEW YORK";

  }

}

/* ==================================================

   MISSION / TURF

================================================== */

function updateMission(){

  if(missionStage===0){

    const d=

      player.position.distanceTo(

        car.position

      );

    if(d<5){

      missionText.textContent=

        "Press DRIVE to enter the car";

    }

  }

  if(

    missionStage===1 &&

    driving

  ){

    if(

      car.position.length()>95

    ){

      missionStage=2;

      money+=500;

      document.getElementById(

        "money"

      ).textContent=money;

      missionText.textContent=

        "Mission complete — explore Utica";

      showMessage(

        "MISSION PASSED +$500"

      );

    }

  }

  const p=

    driving

    ? car.position

    : player.position;

  for(const turf of turfs){

    if(turf.captured)

      continue;

    const dist=

      p.distanceTo(

        turf.position

      );

    if(dist<turf.size*.45){

      missionText.textContent=

        `${turf.name} TURF`;

    }

  }

}

/* ==================================================

   HUD

================================================== */

function updateHUD(){

  if(driving){

    const mph=

      Math.round(

        Math.abs(carSpeed)*2.23694

      );

    speedText.textContent=

      mph+" MPH";

  }else{

    speedText.textContent=

      input.run &&

      (

        input.forward||

        input.back||

        input.left||

        input.right

      )

      ? "RUNNING"

      : "0 MPH";

  }

  wantedText.textContent=

    "★".repeat(wanted)+

    "☆".repeat(5-wanted);

}

/* ==================================================

   HELPERS

================================================== */

function lerpAngle(a,b,t){

  let d=

    b-a;

  while(d>Math.PI)

    d-=Math.PI*2;

  while(d<-Math.PI)

    d+=Math.PI*2;

  return a+d*t;

}

let messageTimer;

function showMessage(text){

  messageBox.textContent=text;

  messageBox.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer=

    setTimeout(

      ()=>{

        messageBox.classList.remove(

          "show"

        );

      },

      1900

    );

}

================================================== */

    camera.aspect=

    renderer.setSize(

/* ==================================================

   MAIN LOOP

================================================== */

const clock=

  new THREE.Clock();

function animate(){

  requestAnimationFrame(

    animate

  );

  let dt=

    clock.getDelta();

  dt=Math.min(

    dt,

    .04

  );

  if(driving)

    updateCar(dt);

  else

    updateWalking(dt);

  updateCamera(dt);

  updateStreet(dt);

  updateMission();

  updateHUD();

  renderer.render(

    scene,

    camera

  );

}

animate();
