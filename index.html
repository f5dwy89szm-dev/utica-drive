<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1,

maximum-scale=1,

user-scalable=no,

viewport-fit=cover">

<title>Utica Open World</title>

<link

href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css"

rel="stylesheet">

<style>

*{

    box-sizing:border-box;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;

}

html,

body{

    margin:0;

    padding:0;

    width:100%;

    height:100%;

    overflow:hidden;

    background:#000;

    touch-action:none;

    font-family:Arial,Helvetica,sans-serif;

}

#map{

    position:fixed;

    inset:0;

}

/* ===============================

   HUD

================================ */

#hud{

    position:fixed;

    top:max(14px,env(safe-area-inset-top));

    left:14px;

    z-index:30;

    color:white;

    pointer-events:none;

    text-shadow:0 2px 7px #000;

}

#speed{

    font-size:29px;

    font-weight:900;

}

#mode{

    font-size:13px;

    margin-top:2px;

}

#locationLabel{

    font-size:11px;

    margin-top:4px;

    opacity:.8;

}

#title{

    position:fixed;

    top:max(15px,env(safe-area-inset-top));

    right:14px;

    color:white;

    z-index:30;

    font-weight:900;

    font-size:11px;

    letter-spacing:1px;

    text-shadow:0 2px 5px #000;

}

/* ===============================

   JOYSTICK

================================ */

#joystickArea{

    position:fixed;

    left:13px;

    bottom:max(20px,env(safe-area-inset-bottom));

    width:160px;

    height:160px;

    z-index:50;

    touch-action:none;

}

#joystickBase{

    position:absolute;

    width:124px;

    height:124px;

    left:18px;

    top:18px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.32);

    background:rgba(15,15,15,.42);

    box-shadow:

        inset 0 0 18px rgba(255,255,255,.07),

        0 5px 14px rgba(0,0,0,.45);

}

#joystick{

    position:absolute;

    width:58px;

    height:58px;

    left:51px;

    top:51px;

    border-radius:50%;

    background:rgba(255,255,255,.82);

    border:3px solid rgba(0,0,0,.40);

    box-shadow:0 4px 10px rgba(0,0,0,.5);

    pointer-events:none;

}

/* ===============================

   DRIVING CONTROLS

================================ */

#vehicleControls{

    position:fixed;

    right:10px;

    bottom:max(18px,env(safe-area-inset-bottom));

    width:215px;

    height:215px;

    z-index:50;

}

.control{

    position:absolute;

    border:none;

    color:#fff;

    font-weight:900;

    touch-action:none;

    -webkit-tap-highlight-color:transparent;

    box-shadow:

        inset 0 0 0 2px rgba(255,255,255,.22),

        0 5px 13px rgba(0,0,0,.44);

}

.control:active{

    transform:scale(.95);

}

#gas{

    right:0;

    bottom:0;

    width:95px;

    height:95px;

    border-radius:50%;

    background:rgba(24,164,66,.84);

    font-size:19px;

}

#brake{

    left:31px;

    bottom:3px;

    width:74px;

    height:74px;

    border-radius:50%;

    background:rgba(205,40,40,.85);

    font-size:13px;

}

#reverse{

    left:0;

    top:54px;

    width:76px;

    height:61px;

    border-radius:17px;

    background:rgba(224,126,20,.87);

    font-size:11px;

}

#handbrake{

    right:4px;

    top:7px;

    width:92px;

    height:50px;

    border-radius:15px;

    background:rgba(25,25,25,.84);

    font-size:10px;

}

/* ===============================

   EXIT / ENTER

================================ */

#action{

    position:fixed;

    right:14px;

    top:max(76px,calc(env(safe-area-inset-top) + 58px));

    height:49px;

    min-width:112px;

    border:2px solid rgba(255,255,255,.27);

    border-radius:14px;

    padding:0 14px;

    background:rgba(12,12,12,.83);

    color:white;

    font-weight:900;

    font-size:13px;

    z-index:100;

    touch-action:none;

}

/* ===============================

   WALKING

================================ */

#run{

    display:none;

    position:fixed;

    right:22px;

    bottom:max(34px,env(safe-area-inset-bottom));

    width:85px;

    height:85px;

    border:none;

    border-radius:50%;

    background:rgba(38,97,218,.84);

    color:white;

    font-size:16px;

    font-weight:900;

    z-index:50;

    touch-action:none;

    box-shadow:

        inset 0 0 0 2px rgba(255,255,255,.23),

        0 5px 12px rgba(0,0,0,.44);

}

#lookHint{

    display:none;

    position:fixed;

    right:16px;

    bottom:134px;

    color:white;

    opacity:.7;

    font-size:10px;

    z-index:30;

    pointer-events:none;

    text-shadow:0 2px 4px #000;

}

/* ===============================

   CAR MARKER

================================ */

.carMarker{

    position:relative;

    width:34px;

    height:58px;

    transform-origin:center center;

}

.carBody{

    position:absolute;

    left:3px;

    top:2px;

    width:28px;

    height:54px;

    border-radius:8px 8px 10px 10px;

    background:

        linear-gradient(

            90deg,

            #83111b,

            #e32834 32%,

            #ff3a43 50%,

            #d71925 70%,

            #781019

        );

    border:2px solid #171717;

    box-shadow:

        0 6px 12px rgba(0,0,0,.72);

}

.windshield{

    position:absolute;

    top:10px;

    left:6px;

    width:16px;

    height:11px;

    border-radius:4px;

    background:#162b38;

    border:1px solid #111;

}

.rearWindow{

    position:absolute;

    bottom:10px;

    left:6px;

    width:16px;

    height:9px;

    border-radius:3px;

    background:#213a47;

}

.leftLight,

.rightLight{

    position:absolute;

    top:1px;

    width:6px;

    height:4px;

    border-radius:2px;

    background:#fff5ba;

}

.leftLight{

    left:4px;

}

.rightLight{

    right:4px;

}

/* ===============================

   CHARACTER

================================ */

.personMarker{

    position:relative;

    width:32px;

    height:61px;

    filter:

        drop-shadow(

            0 5px 4px rgba(0,0,0,.5)

        );

}

.personHead{

    position:absolute;

    left:10px;

    top:0;

    width:13px;

    height:14px;

    border-radius:48%;

    background:#c9916f;

    border:1px solid #30241d;

}

.personHair{

    position:absolute;

    left:9px;

    top:-1px;

    width:15px;

    height:7px;

    border-radius:8px 8px 3px 3px;

    background:#211813;

}

.personTorso{

    position:absolute;

    left:7px;

    top:13px;

    width:19px;

    height:24px;

    border-radius:6px 6px 4px 4px;

    background:#264f96;

    border:1px solid #14233c;

}

.personLegL,

.personLegR{

    position:absolute;

    top:36px;

    width:7px;

    height:23px;

    background:#222b38;

    border-radius:3px;

}

.personLegL{

    left:8px;

}

.personLegR{

    right:8px;

}

</style>

</head>

<body>

<div id="map"></div>

<div id="hud">

    <div id="speed">0 MPH</div>

    <div id="mode">IN VEHICLE</div>

    <div id="locationLabel">

        UTICA, NEW YORK

    </div>

</div>

<div id="title">

    UTICA OPEN WORLD

</div>

<div id="joystickArea">

    <div id="joystickBase"></div>

    <div id="joystick"></div>

</div>

<div id="vehicleControls">

    <button

    id="reverse"

    class="control">

        REVERSE

    </button>

    <button

    id="handbrake"

    class="control">

        HANDBRAKE

    </button>

    <button

    id="brake"

    class="control">

        BRAKE

    </button>

    <button

    id="gas"

    class="control">

        GAS

    </button>

</div>

<button id="run">

    RUN

</button>

<button id="action">

    EXIT

</button>

<div id="lookHint">

    Drag right side to rotate camera

</div>

<script

src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js">

</script>

<script>

/* ======================================================

   REAL UTICA START POSITION

====================================================== */

const START = {

    lng:-75.23265,

    lat:43.10090

};

/* ======================================================

   MAP

====================================================== */

const map =

new maplibregl.Map({

    container:"map",

    style:

    "https://tiles.openfreemap.org/styles/liberty",

    center:[

        START.lng,

        START.lat

    ],

    zoom:17.6,

    pitch:67,

    bearing:0,

    attributionControl:false,

    interactive:false,

    canvasContextAttributes:{

        antialias:true

    }

});

/* ======================================================

   3D BUILDINGS

====================================================== */

map.on(

    "load",

    ()=>{

        /*

        OpenFreeMap vector building source.

        Tiles automatically stream as

        the player drives around Utica.

        */

        if(

            !map.getSource(

                "utica-buildings"

            )

        ){

            map.addSource(

                "utica-buildings",

                {

                    type:"vector",

                    url:

                    "https://tiles.openfreemap.org/planet"

                }

            );

        }

        const layers =

        map.getStyle().layers;

        let firstTextLayer;

        for(

            const layer of layers

        ){

            if(

                layer.type==="symbol" &&

                layer.layout &&

                layer.layout[

                    "text-field"

                ]

            ){

                firstTextLayer=

                layer.id;

                break;

            }

        }

        map.addLayer(

            {

                id:"utica-3d-buildings",

                source:"utica-buildings",

                "source-layer":"building",

                type:"fill-extrusion",

                minzoom:14.5,

                filter:[

                    "!=",

                    ["get","hide_3d"],

                    true

                ],

                paint:{

                    "fill-extrusion-color":[

                        "interpolate",

                        ["linear"],

                        [

                            "coalesce",

                            [

                                "get",

                                "render_height"

                            ],

                            8

                        ],

                        0,

                        "#c2beb5",

                        20,

                        "#aaa69c",

                        60,

                        "#918e88",

                        120,

                        "#777777"

                    ],

                    "fill-extrusion-height":[

                        "interpolate",

                        ["linear"],

                        ["zoom"],

                        14.5,

                        0,

                        16,

                        [

                            "coalesce",

                            [

                                "get",

                                "render_height"

                            ],

                            8

                        ]

                    ],

                    "fill-extrusion-base":[

                        "coalesce",

                        [

                            "get",

                            "render_min_height"

                        ],

                        0

                    ],

                    "fill-extrusion-opacity":

                    .92

                }

            },

            firstTextLayer

        );

    }

);

/* ======================================================

   GAME STATE

====================================================== */

let mode =

"vehicle";

const car={

    lng:START.lng,

    lat:START.lat,

    heading:0,

    velocityHeading:0,

    speed:0,

    steering:0

};

const player={

    lng:START.lng,

    lat:START.lat,

    heading:0

};

const controls={

    joyX:0,

    joyY:0,

    gas:false,

    brake:false,

    reverse:false,

    handbrake:false,

    run:false

};

/* ======================================================

   DRIVING CONSTANTS

====================================================== */

const MAX_SPEED=

32;

const MAX_REVERSE=

8;

const ENGINE_FORCE=

7.4;

const BRAKE_FORCE=

19;

const REVERSE_FORCE=

6.5;

const ROLLING_DRAG=

1.8;

const WHEELBASE=

2.72;

/*

Maximum wheel angles.

*/

const LOW_SPEED_STEER=

.54;

const HIGH_SPEED_STEER=

.15;

/* ======================================================

   CAR MARKER

====================================================== */

const carElement =

document.createElement(

    "div"

);

carElement.className=

"carMarker";

carElement.innerHTML=`

<div class="carBody">

    <div class="windshield"></div>

    <div class="rearWindow"></div>

    <div class="leftLight"></div>

    <div class="rightLight"></div>

</div>

`;

const carMarker =

new maplibregl.Marker({

    element:

    carElement,

    rotationAlignment:

    "map",

    pitchAlignment:

    "map",

    anchor:

    "center"

})

.setLngLat([

    car.lng,

    car.lat

])

.addTo(map);

/* ======================================================

   PERSON MARKER

====================================================== */

const personElement =

document.createElement(

    "div"

);

personElement.className=

"personMarker";

personElement.innerHTML=`

<div class="personHair"></div>

<div class="personHead"></div>

<div class="personTorso"></div>

<div class="personLegL"></div>

<div class="personLegR"></div>

`;

const playerMarker =

new maplibregl.Marker({

    element:

    personElement,

    rotationAlignment:

    "map",

    pitchAlignment:

    "map",

    anchor:

    "bottom"

})

.setLngLat([

    player.lng,

    player.lat

]);

/* ======================================================

   UI

====================================================== */

const speedText =

document.getElementById(

    "speed"

);

const modeText =

document.getElementById(

    "mode"

);

const vehicleControls =

document.getElementById(

    "vehicleControls"

);

const actionButton =

document.getElementById(

    "action"

);

const runButton =

document.getElementById(

    "run"

);

const lookHint =

document.getElementById(

    "lookHint"

);

/* ======================================================

   GEO MATH

====================================================== */

function radians(degrees){

    return degrees*

    Math.PI/180;

}

function degrees(rad){

    return rad*

    180/Math.PI;

}

function normalizeAngle(angle){

    while(angle>180)

        angle-=360;

    while(angle<-180)

        angle+=360;

    return angle;

}

/*

Move longitude/latitude a number of

meters in a compass direction.

0 = north

90 = east

180 = south

270 = west

*/

function moveCoordinate(

    lng,

    lat,

    heading,

    meters

){

    const angle=

    radians(

        heading

    );

    const north=

    Math.cos(angle)*

    meters;

    const east=

    Math.sin(angle)*

    meters;

    const newLat=

    lat+

    north/111320;

    const newLng=

    lng+

    east/

    (

        111320*

        Math.cos(

            radians(lat)

        )

    );

    return {

        lng:newLng,

        lat:newLat

    };

}

function distanceMeters(

    lng1,

    lat1,

    lng2,

    lat2

){

    const avgLat=

    radians(

        (lat1+lat2)/2

    );

    const dx=

    (

        lng2-lng1

    )*

    111320*

    Math.cos(avgLat);

    const dy=

    (

        lat2-lat1

    )*

    111320;

    return Math.hypot(

        dx,

        dy

    );

}

/* ======================================================

   JOYSTICK

====================================================== */

const joystickArea =

document.getElementById(

    "joystickArea"

);

const joystick =

document.getElementById(

    "joystick"

);

const JOY_RADIUS=

45;

let joystickPointer=

null;

function moveJoystick(

    clientX,

    clientY

){

    const rect=

    joystickArea

    .getBoundingClientRect();

    const cx=

    rect.left+

    rect.width/2;

    const cy=

    rect.top+

    rect.height/2;

    let dx=

    clientX-cx;

    let dy=

    clientY-cy;

    const distance=

    Math.hypot(

        dx,

        dy

    );

    if(

        distance>

        JOY_RADIUS

    ){

        dx=

        dx/

        distance*

        JOY_RADIUS;

        dy=

        dy/

        distance*

        JOY_RADIUS;

    }

    controls.joyX=

    dx/

    JOY_RADIUS;

    controls.joyY=

    dy/

    JOY_RADIUS;

    joystick.style.transform=

    `translate(${dx}px,${dy}px)`;

}

function resetJoystick(){

    controls.joyX=0;

    controls.joyY=0;

    joystick.style.transform=

    "translate(0px,0px)";

}

joystickArea.addEventListener(

    "pointerdown",

    e=>{

        e.preventDefault();

        if(

            joystickPointer!==

            null

        ) return;

        joystickPointer=

        e.pointerId;

        try{

            joystickArea

            .setPointerCapture(

                e.pointerId

            );

        }catch{}

        moveJoystick(

            e.clientX,

            e.clientY

        );

    }

);

joystickArea.addEventListener(

    "pointermove",

    e=>{

        if(

            e.pointerId!==

            joystickPointer

        ) return;

        e.preventDefault();

        moveJoystick(

            e.clientX,

            e.clientY

        );

    }

);

function endJoystick(e){

    if(

        e.pointerId!==

        joystickPointer

    ) return;

    joystickPointer=null;

    resetJoystick();

}

joystickArea.addEventListener(

    "pointerup",

    endJoystick

);

joystickArea.addEventListener(

    "pointercancel",

    endJoystick

);

/* ======================================================

   BUTTON HOLD SYSTEM

====================================================== */

function holdButton(

    id,

    control

){

    const button=

    document.getElementById(

        id

    );

    button.addEventListener(

        "pointerdown",

        e=>{

            e.preventDefault();

            controls[control]=true;

            try{

                button.setPointerCapture(

                    e.pointerId

                );

            }catch{}

        }

    );

    function release(e){

        e.preventDefault();

        controls[control]=false;

    }

    button.addEventListener(

        "pointerup",

        release

    );

    button.addEventListener(

        "pointercancel",

        release

    );

}

holdButton(

    "gas",

    "gas"

);

holdButton(

    "brake",

    "brake"

);

holdButton(

    "reverse",

    "reverse"

);

holdButton(

    "handbrake",

    "handbrake"

);

holdButton(

    "run",

    "run"

);

/* ======================================================

   VEHICLE PHYSICS

====================================================== */

function updateVehicle(dt){

    /*

    THROTTLE

    */

    if(

        controls.gas

    ){

        if(

            car.speed<0

        ){

            car.speed +=

            BRAKE_FORCE*

            dt;

            if(

                car.speed>0

            ){

                car.speed=0;

            }

        }

        else{

            /*

            Gradually weaker engine

            near top speed.

            */

            const speedRatio=

            Math.min(

                car.speed/

                MAX_SPEED,

                1

            );

            const enginePower=

            ENGINE_FORCE*

            (

                1-

                speedRatio*.72

            );

            car.speed +=

            enginePower*

            dt;

        }

    }

    /*

    BRAKE

    */

    if(

        controls.brake

    ){

        if(

            car.speed>0

        ){

            car.speed -=

            BRAKE_FORCE*

            dt;

            if(

                car.speed<0

            ){

                car.speed=0;

            }

        }

        else if(

            car.speed<0

        ){

            car.speed +=

            BRAKE_FORCE*

            dt;

            if(

                car.speed>0

            ){

                car.speed=0;

            }

        }

    }

    /*

    REVERSE

    */

    if(

        controls.reverse

    ){

        if(

            car.speed>0

        ){

            car.speed -=

            BRAKE_FORCE*

            dt;

            if(

                car.speed<0

            ){

                car.speed=0;

            }

        }

        else{

            car.speed -=

            REVERSE_FORCE*

            dt;

        }

    }

    /*

    NATURAL ROLLING DRAG

    */

    if(

        !controls.gas &&

        !controls.brake &&

        !controls.reverse

    ){

        if(

            car.speed>0

        ){

            car.speed -=

            ROLLING_DRAG*

            dt;

            if(

                car.speed<0

            ){

                car.speed=0;

            }

        }

        else if(

            car.speed<0

        ){

            car.speed +=

            ROLLING_DRAG*

            dt;

            if(

                car.speed>0

            ){

                car.speed=0;

            }

        }

    }

    car.speed=

    Math.max(

        -MAX_REVERSE,

        Math.min(

            MAX_SPEED,

            car.speed

        )

    );

    const absoluteSpeed=

    Math.abs(

        car.speed

    );

    const speedRatio=

    Math.min(

        absoluteSpeed/

        MAX_SPEED,

        1

    );

    /*

    Smooth steering.

    */

    const steeringResponse=

    absoluteSpeed<4

    ? 6.8

    : 4.1;

    car.steering +=

    (

        controls.joyX-

        car.steering

    )*

    Math.min(

        1,

        steeringResponse*

        dt

    );

    /*

    Auto-center.

    */

    if(

        Math.abs(

            controls.joyX

        )<.03

    ){

        car.steering +=

        (

            0-

            car.steering

        )*

        Math.min(

            1,

            8*dt

        );

    }

    /*

    Smaller steering angle at

    high road speed.

    */

    let maxSteer=

    LOW_SPEED_STEER+

    (

        HIGH_SPEED_STEER-

        LOW_SPEED_STEER

    )*

    speedRatio;

    const steeringAngle=

    car.steering*

    maxSteer;

    /*

    Bicycle steering model.

    */

    if(

        absoluteSpeed>.15

    ){

        let yawRate=

        (

            car.speed/

            WHEELBASE

        )*

        Math.tan(

            steeringAngle

        );

        if(

            controls.handbrake &&

            absoluteSpeed>4

        ){

            yawRate*=1.45;

        }

        car.heading +=

        degrees(

            yawRate*

            dt

        );

    }

    car.heading=

    (

        car.heading+

        360

    )%

    360;

    /*

    Momentum direction follows

    vehicle heading gradually.

    */

    let angleDifference=

    normalizeAngle(

        car.heading-

        car.velocityHeading

    );

    let grip=

    7.4;

    if(

        controls.handbrake &&

        absoluteSpeed>4

    ){

        grip=.85;

        car.speed *=

        Math.pow(

            .62,

            dt

        );

    }

    car.velocityHeading +=

    angleDifference*

    Math.min(

        1,

        grip*

        dt

    );

    if(

        absoluteSpeed<1

    ){

        car.velocityHeading=

        car.heading;

    }

    /*

    Move in meters.

    */

    const next=

    moveCoordinate(

        car.lng,

        car.lat,

        car.velocityHeading,

        car.speed*

        dt

    );

    car.lng=

    next.lng;

    car.lat=

    next.lat;

    carMarker.setLngLat([

        car.lng,

        car.lat

    ]);

    carMarker.setRotation(

        car.heading

    );

    speedText.textContent=

    Math.round(

        absoluteSpeed*

        2.23694

    )+

    " MPH";

}

/* ======================================================

   WALKING CAMERA

====================================================== */

let walkCameraBearing=

0;

let cameraPointer=

null;

let previousCameraX=

0;

document.addEventListener(

    "pointerdown",

    e=>{

        if(

            mode!==

            "walking"

        ) return;

        /*

        Right side camera control.

        */

        if(

            e.clientX<

            innerWidth*.48

        ) return;

        if(

            e.clientY>

            innerHeight-120

        ) return;

        cameraPointer=

        e.pointerId;

        previousCameraX=

        e.clientX;

    }

);

document.addEventListener(

    "pointermove",

    e=>{

        if(

            mode!==

            "walking"

            ||

            e.pointerId!==

            cameraPointer

        ) return;

        const dx=

        e.clientX-

        previousCameraX;

        previousCameraX=

        e.clientX;

        walkCameraBearing -=

        dx*.28;

        walkCameraBearing=

        (

            walkCameraBearing+

            360

        )%

        360;

    }

);

function endCamera(e){

    if(

        e.pointerId===

        cameraPointer

    ){

        cameraPointer=null;

    }

}

document.addEventListener(

    "pointerup",

    endCamera

);

document.addEventListener(

    "pointercancel",

    endCamera

);

/* ======================================================

   WALKING

====================================================== */

function updatePlayer(dt){

    const x=

    controls.joyX;

    const y=

    controls.joyY;

    const amount=

    Math.min(

        1,

        Math.hypot(

            x,y

        )

    );

    if(

        amount>.07

    ){

        /*

        Joystick direction relative

        to current walking camera.

        */

        const relativeAngle=

        degrees(

            Math.atan2(

                x,

                -y

            )

        );

        const movementHeading=

        walkCameraBearing+

        relativeAngle;

        const movementSpeed=

        controls.run

        ? 5.8

        : 3.1;

        const next=

        moveCoordinate(

            player.lng,

            player.lat,

            movementHeading,

            movementSpeed*

            amount*

            dt

        );

        player.lng=

        next.lng;

        player.lat=

        next.lat;

        /*

        Character smoothly faces

        direction of travel.

        */

        let turn=

        normalizeAngle(

            movementHeading-

            player.heading

        );

        player.heading +=

        turn*

        Math.min(

            1,

            9*dt

        );

        playerMarker.setLngLat([

            player.lng,

            player.lat

        ]);

        playerMarker.setRotation(

            player.heading

        );

        speedText.textContent=

        controls.run

        ? "RUNNING"

        : "WALKING";

    }

    else{

        speedText.textContent=

        "ON FOOT";

    }

    updateEnterCarButton();

}

/* ======================================================

   EXIT / ENTER

====================================================== */

function exitVehicle(){

    if(

        mode!==

        "vehicle"

    ) return;

    /*

    Stop first if moving fast.

    */

    if(

        Math.abs(

            car.speed

        )>2

    ){

        car.speed *=

        .22;

        actionButton.textContent=

        "STOPPING";

        setTimeout(

            ()=>{

                if(

                    mode===

                    "vehicle"

                ){

                    actionButton.textContent=

                    "EXIT";

                }

            },

            450

        );

        return;

    }

    car.speed=0;

    mode=

    "walking";

    /*

    Spawn person about 2 meters

    left of vehicle.

    */

    const exitPoint=

    moveCoordinate(

        car.lng,

        car.lat,

        car.heading-90,

        2.1

    );

    player.lng=

    exitPoint.lng;

    player.lat=

    exitPoint.lat;

    player.heading=

    car.heading;

    walkCameraBearing=

    car.heading;

    playerMarker

    .setLngLat([

        player.lng,

        player.lat

    ])

    .setRotation(

        player.heading

    )

    .addTo(map);

    vehicleControls

    .style.display=

    "none";

    runButton

    .style.display=

    "block";

    lookHint

    .style.display=

    "block";

    actionButton.textContent=

    "ENTER CAR";

    modeText.textContent=

    "ON FOOT";

    resetJoystick();

}

function enterVehicle(){

    if(

        mode!==

        "walking"

    ) return;

    const distance=

    distanceMeters(

        player.lng,

        player.lat,

        car.lng,

        car.lat

    );

    if(

        distance>

        5

    ) return;

    mode=

    "vehicle";

    playerMarker.remove();

    vehicleControls

    .style.display=

    "block";

    runButton

    .style.display=

    "none";

    lookHint

    .style.display=

    "none";

    actionButton

    .style.display=

    "block";

    actionButton.textContent=

    "EXIT";

    modeText.textContent=

    "IN VEHICLE";

    resetJoystick();

}

function updateEnterCarButton(){

    if(

        mode!==

        "walking"

    ) return;

    const distance=

    distanceMeters(

        player.lng,

        player.lat,

        car.lng,

        car.lat

    );

    if(

        distance<=5

    ){

        actionButton

        .style.display=

        "block";

        actionButton.textContent=

        "ENTER CAR";

    }

    else{

        actionButton

        .style.display=

        "none";

    }

}

actionButton.addEventListener(

    "pointerup",

    e=>{

        e.preventDefault();

        if(

            mode===

            "vehicle"

        ){

            exitVehicle();

        }

        else{

            enterVehicle();

        }

    }

);

/* ======================================================

   MAP CAMERA

====================================================== */

function updateMapCamera(){

    /*

    VEHICLE CHASE CAMERA

    */

    if(

        mode===

        "vehicle"

    ){

        const speedRatio=

        Math.min(

            Math.abs(

                car.speed

            )/

            MAX_SPEED,

            1

        );

        /*

        Center slightly AHEAD of the car.

        This places car lower on screen,

        giving more road visibility.

        */

        const focusPoint=

        moveCoordinate(

            car.lng,

            car.lat,

            car.heading,

            12+

            speedRatio*

            13

        );

        map.jumpTo({

            center:[

                focusPoint.lng,

                focusPoint.lat

            ],

            bearing:

            car.heading,

            pitch:

            67,

            zoom:

            17.8-

            speedRatio*.42

        });

    }

    /*

    WALKING THIRD PERSON MAP CAMERA

    */

    else{

        const focusPoint=

        moveCoordinate(

            player.lng,

            player.lat,

            walkCameraBearing,

            5

        );

        map.jumpTo({

            center:[

                focusPoint.lng,

                focusPoint.lat

            ],

            bearing:

            walkCameraBearing,

            pitch:

            65,

            zoom:

            18.7

        });

    }

}

/* ======================================================

   GAME LOOP

====================================================== */

let previousTime=

performance.now();

function gameLoop(time){

    let dt=

    (

        time-

        previousTime

    )/

    1000;

    previousTime=

    time;

    /*

    Avoid huge jumps after Safari

    pauses in background.

    */

    dt=

    Math.min(

        dt,

        .04

    );

    if(

        mode===

        "vehicle"

    ){

        updateVehicle(dt);

    }

    else{

        updatePlayer(dt);

    }

    updateMapCamera();

    requestAnimationFrame(

        gameLoop

    );

}

/* ======================================================

   START

====================================================== */

map.on(

    "load",

    ()=>{

        carMarker.setRotation(

            car.heading

        );

        requestAnimationFrame(

            gameLoop

        );

    }

);

/* ======================================================

   SAFARI

====================================================== */

document.addEventListener(

    "gesturestart",

    e=>

    e.preventDefault()

);

document.addEventListener(

    "contextmenu",

    e=>

    e.preventDefault()

);
