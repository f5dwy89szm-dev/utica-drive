<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <meta name="theme-color" content="#111111" />

  <title>Utica Drive</title>

  <link rel="stylesheet" href="style.css" />

  <!-- THREE.JS -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>

<body>

  <div id="game"></div>

  <!-- TOP HUD -->
  <div id="hud">
    <div id="cityName">UTICA, NEW YORK</div>
    <div id="modeText">WALKING</div>
    <div id="speedText">0 MPH</div>
  </div>

  <!-- WALK CONTROLS -->
  <div id="walkControls">

    <button id="walkUp" class="controlButton">▲</button>

    <div class="middleRow">
      <button id="walkLeft" class="controlButton">◀</button>
      <button id="walkDown" class="controlButton">▼</button>
      <button id="walkRight" class="controlButton">▶</button>
    </div>

  </div>

  <!-- DRIVE CONTROLS -->
  <div id="driveControls">

    <div id="steering">
      <button id="steerLeft" class="driveButton">◀</button>
      <button id="steerRight" class="driveButton">▶</button>
    </div>

    <div id="pedals">
      <button id="gasButton" class="gasButton">GAS</button>
      <button id="brakeButton" class="brakeButton">BRAKE</button>
      <button id="reverseButton" class="reverseButton">REVERSE</button>
    </div>

  </div>

  <!-- ENTER / EXIT CAR -->
  <button id="vehicleButton">ENTER CAR</button>

  <div id="message">WALK TO THE CAR</div>

  <script src="app.js"></script>

</body>
</html>
