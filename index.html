<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta

    name="viewport"

    content="width=device-width,

    initial-scale=1,

    maximum-scale=1,

    user-scalable=no,

    viewport-fit=cover"

  >

  <title>Utica Drive</title>

  <link rel="stylesheet" href="./style.css">

</head>

<body>

  <div id="loading">

    LOADING UTICA...

  </div>

  <div id="hud">

    <div>

      <div id="cityName">UTICA, NEW YORK</div>

      <div id="mode">DRIVE</div>

    </div>

    <div id="speed">0 MPH</div>

  </div>

  <!-- EXIT / ENTER -->

  <button id="exitBtn" class="utilityButton">

    EXIT

  </button>

  <!-- LEFT SIDE STEERING -->

  <div id="steeringControls">

    <button id="leftBtn" class="roundButton">

      ◀

    </button>

    <button id="rightBtn" class="roundButton">

      ▶

    </button>

  </div>

  <!-- RIGHT SIDE PEDALS -->

  <div id="pedalControls">

    <button id="gasBtn" class="roundButton pedal">

      ▲

      <span>GAS</span>

    </button>

    <button id="brakeBtn" class="roundButton pedal">

      ▼

      <span>BRAKE</span>

    </button>

    <button id="reverseBtn">

      REVERSE

    </button>

  </div>

  <div id="notice"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

  <script src="./app.js"></script>

</body>

</html>
