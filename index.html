<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1,

maximum-scale=1,

user-scalable=no,

viewport-fit=cover">

<title>Utica Open World V4</title>

<style>

*{

    box-sizing:border-box;

    user-select:none;

    -webkit-user-select:none;

    -webkit-touch-callout:none;

}

html,body{

    width:100%;

    height:100%;

    margin:0;

    overflow:hidden;

    background:#111;

    touch-action:none;

    font-family:Arial,Helvetica,sans-serif;

}

canvas{

    position:fixed;

    inset:0;

    width:100%;

    height:100%;

    display:block;

}

/* HUD */

#hud{

    position:fixed;

    top:max(14px,env(safe-area-inset-top));

    left:14px;

    z-index:20;

    color:white;

    text-shadow:0 2px 7px #000;

    pointer-events:none;

}

#speed{

    font-size:29px;

    font-weight:900;

}

#status{

    margin-top:2px;

    font-size:13px;

}

#surface{

    margin-top:2px;

    font-size:11px;

    opacity:.8;

}

#mission{

    margin-top:8px;

    max-width:240px;

    padding:8px 10px;

    border-radius:10px;

    background:rgba(0,0,0,.45);

    font-size:12px;

    line-height:1.35;

}

#logo{

    position:fixed;

    right:14px;

    top:max(15px,env(safe-area-inset-top));

    z-index:15;

    color:white;

    font-size:11px;

    font-weight:bold;

    letter-spacing:1px;

    opacity:.75;

    text-shadow:0 2px 5px #000;

    pointer-events:none;

}

/* JOYSTICK */

#stickArea{

    position:fixed;

    left:14px;

    bottom:max(20px,env(safe-area-inset-bottom));

    width:160px;

    height:160px;

    z-index:50;

    touch-action:none;

}

#stickBase{

    position:absolute;

    width:124px;

    height:124px;

    left:18px;

    top:18px;

    border-radius:50%;

    background:rgba(18,18,18,.40);

    border:3px solid rgba(255,255,255,.34);

    box-shadow:

        inset 0 0 20px rgba(255,255,255,.06),

        0 5px 14px rgba(0,0,0,.42);

}

#stick{

    position:absolute;

    width:58px;

    height:58px;

    left:51px;

    top:51px;

    border-radius:50%;

    background:rgba(255,255,255,.84);

    border:3px solid rgba(0,0,0,.42);

    box-shadow:0 4px 10px rgba(0,0,0,.45);

    pointer-events:none;

}

/* CAR CONTROLS */

#vehicleControls{

    position:fixed;

    right:10px;

    bottom:max(18px,env(safe-area-inset-bottom));

    width:210px;

    height:210px;

    z-index:50;

}

.ctrl{

    position:absolute;

    border:none;

    color:white;

    font-weight:900;

    touch-action:none;

    -webkit-tap-highlight-color:transparent;

    box-shadow:

        inset 0 0 0 2px rgba(255,255,255,.22),

        0 5px 13px rgba(0,0,0,.43);

}

.ctrl:active{

    transform:scale(.95);

}

#gas{

    right:0;

    bottom:0;

    width:94px;

    height:94px;

    border-radius:50%;

    background:rgba(24,166,68,.83);

    font-size:19px;

}

#brake{

    left:31px;

    bottom:2px;

    width:74px;

    height:74px;

    border-radius:50%;

    background:rgba(207,42,42,.85);

    font-size:13px;

}

#reverse{

    left:0;

    top:54px;

    width:76px;

    height:60px;

    border-radius:17px;

    background:rgba(224,126,21,.86);

    font-size:11px;

}

#handbrake{

    right:4px;

    top:8px;

    width:92px;

    height:49px;

    border-radius:15px;

    background:rgba(26,26,26,.84);

    font-size:10px;

}

/* ACTION */

#action{

    position:fixed;

    right:14px;

    top:max(76px,calc(env(safe-area-inset-top) + 58px));

    z-index:100;

    min-width:112px;

    height:49px;

    border:2px solid rgba(255,255,255,.27);

    border-radius:14px;

    background:rgba(12,12,12,.82);

    color:white;

    font-size:13px;

    font-weight:900;

    padding:0 14px;

    touch-action:none;

}

/* WALK */

#run{

    display:none;

    position:fixed;

    right:22px;

    bottom:max(35px,env(safe-area-inset-bottom));

    width:85px;

    height:85px;

    border:none;

    border-radius:50%;

    background:rgba(39,98,217,.84);

    color:white;

    font-size:16px;

    font-weight:900;

    z-index:50;

    touch-action:none;

    box-shadow:

        inset 0 0 0 2px rgba(255,255,255,.23),

        0 5px 12px rgba(0,0,0,.45);

}

#cameraHint{

    display:none;

    position:fixed;

    right:18px;

    bottom:135px;

    color:white;

    font-size:10px;

    opacity:.65;

    z-index:20;

    pointer-events:none;

    text-shadow:0 2px 4px black;

}

</style>

</head>

<body>

<div id="hud">

    <div id="speed">0 MPH</div>

    <div id="status">IN VEHICLE</div>

    <div id="surface">ROAD</div>

    <div id="mission">MISSION: Reach the yellow checkpoint.</div>

</div>

<div id="logo">UTICA OPEN WORLD V4</div>

<div id="stickArea">

    <div id="stickBase"></div>

    <div id="stick"></div>

</div>

<div id="vehicleControls">

    <button id="reverse" class="ctrl">

        REVERSE

    </button>

    <button id="handbrake" class="ctrl">

        HANDBRAKE

    </button>

    <button id="brake" class="ctrl">

        BRAKE

    </button>

    <button id="gas" class="ctrl">

        GAS

    </button>

</div>

<button id="run">RUN</button>

<button id="action">EXIT</button>

<div id="cameraHint">

    Drag right side to look around

</div>

<script type="module">

import * as THREE from

"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* ======================================================

   THREE SETUP

====================================================== */

const scene =

new THREE.Scene();

scene.background =

new THREE.Color(0x83b7de);

scene.fog =

new THREE.Fog(

    0x83b7de,

    220,

    850

);

const camera =

new THREE.PerspectiveCamera(

    64,

    innerWidth / innerHeight,

    .1,

    1400

);

const renderer =

new THREE.WebGLRenderer({

    antialias:true,

    powerPreference:"high-performance"

});

renderer.setPixelRatio(

    Math.min(

        devicePixelRatio,

        1.4

    )

);

renderer.setSize(

    innerWidth,

    innerHeight

);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=

THREE.PCFSoftShadowMap;

document.body.prepend(

    renderer.domElement

);

/* ======================================================

   LIGHTING

====================================================== */

scene.add(

    new THREE.HemisphereLight(

        0xd9edff,

        0x50613b,

        2.2

    )

);

const sun =

new THREE.DirectionalLight(

    0xffffff,

    2.2

);

sun.position.set(

    -140,

    220,

    120

);

sun.castShadow=true;

sun.shadow.mapSize.set(

    1024,

    1024

);

sun.shadow.camera.left=-180;

sun.shadow.camera.right=180;

sun.shadow.camera.top=180;

sun.shadow.camera.bottom=-180;

scene.add(sun);

/* ======================================================

   WORLD

====================================================== */

const WORLD_HALF=430;

const ROAD_SPACING=90;

const ROAD_WIDTH=28;

const ground =

new THREE.Mesh(

    new THREE.PlaneGeometry(

        920,

        920

    ),

    new THREE.MeshStandardMaterial({

        color:0x5f8048,

        roughness:1

    })

);

ground.rotation.x=

-Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);

/* ======================================================

   ROADS

====================================================== */

const roads=[];

const roadMaterial =

new THREE.MeshStandardMaterial({

    color:0x343434,

    roughness:.98

});

function createRoad(

    x,z,w,d

){

    const mesh =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            w,

            .08,

            d

        ),

        roadMaterial

    );

    mesh.position.set(

        x,

        .04,

        z

    );

    mesh.receiveShadow=true;

    scene.add(mesh);

    roads.push({

        x,z,w,d

    });

}

for(

    let x=-360;

    x<=360;

    x+=ROAD_SPACING

){

    createRoad(

        x,

        0,

        ROAD_WIDTH,

        870

    );

}

for(

    let z=-360;

    z<=360;

    z+=ROAD_SPACING

){

    createRoad(

        0,

        z,

        870,

        ROAD_WIDTH

    );

}

function isOnRoad(pos){

    for(const r of roads){

        if(

            Math.abs(

                pos.x-r.x

            )<=r.w/2

            &&

            Math.abs(

                pos.z-r.z

            )<=r.d/2

        ){

            return true;

        }

    }

    return false;

}

/* ======================================================

   ROAD LINES

====================================================== */

const lineMaterial =

new THREE.MeshBasicMaterial({

    color:0xead369

});

function stripe(

    x,z,w,d

){

    const mesh =

    new THREE.Mesh(

        new THREE.PlaneGeometry(

            w,d

        ),

        lineMaterial

    );

    mesh.rotation.x=

    -Math.PI/2;

    mesh.position.set(

        x,

        .095,

        z

    );

    scene.add(mesh);

}

for(

    let x=-360;

    x<=360;

    x+=90

){

    for(

        let z=-405;

        z<=405;

        z+=24

    ){

        stripe(

            x,z,.3,10

        );

    }

}

for(

    let z=-360;

    z<=360;

    z+=90

){

    for(

        let x=-405;

        x<=405;

        x+=24

    ){

        stripe(

            x,z,10,.3

        );

    }

}

/* ======================================================

   CITY BLOCKS

====================================================== */

const sidewalkMaterial =

new THREE.MeshStandardMaterial({

    color:0xaaa8a1,

    roughness:1

});

const blockCenters=[];

for(

    let x=-315;

    x<=315;

    x+=90

){

    for(

        let z=-315;

        z<=315;

        z+=90

    ){

        blockCenters.push({

            x,z

        });

        const sidewalk =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                53,

                .18,

                53

            ),

            sidewalkMaterial

        );

        sidewalk.position.set(

            x,

            .09,

            z

        );

        sidewalk.receiveShadow=true;

        scene.add(sidewalk);

    }

}

/* ======================================================

   BUILDINGS

====================================================== */

const buildingMeshes=[];

const buildingBoxes=[];

const buildingColors=[

    0xb89c7c,

    0x968e84,

    0xb7aea0,

    0x897566,

    0xa57a61,

    0x9d9c94,

    0x756c64,

    0x827b73

];

function makeBuilding(

    x,z,w,d,h

){

    const building =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            w,h,d

        ),

        new THREE.MeshStandardMaterial({

            color:

            buildingColors[

                Math.floor(

                    Math.random()*

                    buildingColors.length

                )

            ],

            roughness:.9

        })

    );

    building.position.set(

        x,

        h/2+.2,

        z

    );

    building.castShadow=true;

    building.receiveShadow=true;

    scene.add(building);

    buildingMeshes.push(building);

    buildingBoxes.push(

        new THREE.Box3()

        .setFromObject(building)

    );

}

/*

Buildings now stay well inside blocks.

*/

for(const block of blockCenters){

    if(

        Math.abs(block.x)<50 &&

        Math.abs(block.z)<50

    ){

        continue;

    }

    const placements=[

        [-14,-14],

        [14,-14],

        [-14,14],

        [14,14]

    ];

    const count=

    Math.random()<.4

    ? 2

    : 3;

    for(

        let i=0;

        i<count;

        i++

    ){

        const p=

        placements[i];

        const x=

        block.x+

        p[0];

        const z=

        block.z+

        p[1];

        const w=

        13+

        Math.random()*6;

        const d=

        13+

        Math.random()*6;

        const centerFactor=

        Math.max(

            0,

            1-

            Math.hypot(x,z)/430

        );

        const h=

        13+

        Math.random()*

        (

            17+

            centerFactor*45

        );

        makeBuilding(

            x,z,w,d,h

        );

    }

}

/* ======================================================

   TREES

====================================================== */

function tree(x,z){

    const trunk =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .35,.5,3.5,7

        ),

        new THREE.MeshStandardMaterial({

            color:0x705039

        })

    );

    trunk.position.set(

        x,

        1.75,

        z

    );

    const leaves =

    new THREE.Mesh(

        new THREE.SphereGeometry(

            2.1,

            9,

            7

        ),

        new THREE.MeshStandardMaterial({

            color:0x39703a

        })

    );

    leaves.position.set(

        x,

        4.4,

        z

    );

    trunk.castShadow=true;

    leaves.castShadow=true;

    scene.add(

        trunk,

        leaves

    );

}

for(const block of blockCenters){

    if(Math.random()<.5){

        tree(

            block.x+

            (Math.random()-.5)*30,

            block.z+

            (Math.random()-.5)*30

        );

    }

}

/* ======================================================

   VEHICLE MODEL

====================================================== */

const car =

new THREE.Group();

const carRed =

new THREE.MeshStandardMaterial({

    color:0xd01928,

    metalness:.22,

    roughness:.34

});

const carDarkRed =

new THREE.MeshStandardMaterial({

    color:0x99121d,

    metalness:.16,

    roughness:.4

});

const carGlass =

new THREE.MeshStandardMaterial({

    color:0x172933,

    metalness:.30,

    roughness:.16

});

const tireMaterial =

new THREE.MeshStandardMaterial({

    color:0x0e0e0e,

    roughness:.98

});

const carBody =

new THREE.Mesh(

    new THREE.BoxGeometry(

        2.08,

        .68,

        4.45

    ),

    carRed

);

carBody.position.y=.77;

carBody.castShadow=true;

car.add(carBody);

const hood =

new THREE.Mesh(

    new THREE.BoxGeometry(

        1.84,

        .23,

        1.34

    ),

    carDarkRed

);

hood.position.set(

    0,

    1.01,

    -1.51

);

car.add(hood);

const cabin =

new THREE.Mesh(

    new THREE.BoxGeometry(

        1.70,

        .72,

        2.03

    ),

    carGlass

);

cabin.position.set(

    0,

    1.38,

    .02

);

cabin.castShadow=true;

car.add(cabin);

function createWheel(

    x,z

){

    const wheel =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .42,.42,.40,16

        ),

        tireMaterial

    );

    wheel.rotation.z=

    Math.PI/2;

    wheel.position.set(

        x,.44,z

    );

    wheel.castShadow=true;

    car.add(wheel);

    return wheel;

}

const wheelFL=

createWheel(-1.04,-1.37);

const wheelFR=

createWheel(1.04,-1.37);

const wheelRL=

createWheel(-1.04,1.37);

const wheelRR=

createWheel(1.04,1.37);

car.position.set(

    0,.02,0

);

scene.add(car);

/* ======================================================

   HUMAN CHARACTER

====================================================== */

const player =

new THREE.Group();

const skin =

new THREE.MeshStandardMaterial({

    color:0xc58e69,

    roughness:.85

});

const shirt =

new THREE.MeshStandardMaterial({

    color:0x254f98,

    roughness:.78

});

const pants =

new THREE.MeshStandardMaterial({

    color:0x1d2632,

    roughness:.9

});

const shoe =

new THREE.MeshStandardMaterial({

    color:0x121212,

    roughness:1

});

const hair =

new THREE.MeshStandardMaterial({

    color:0x241812,

    roughness:1

});

/* TORSO */

const torso =

new THREE.Mesh(

    new THREE.BoxGeometry(

        .76,

        .98,

        .38

    ),

    shirt

);

torso.position.y=1.7;

torso.castShadow=true;

player.add(torso);

/* WAIST */

const waist =

new THREE.Mesh(

    new THREE.BoxGeometry(

        .62,

        .33,

        .36

    ),

    pants

);

waist.position.y=1.08;

player.add(waist);

/* HEAD */

const playerHead =

new THREE.Mesh(

    new THREE.SphereGeometry(

        .30,

        14,

        10

    ),

    skin

);

playerHead.position.y=2.52;

playerHead.castShadow=true;

player.add(playerHead);

/* HAIR */

const hairMesh =

new THREE.Mesh(

    new THREE.SphereGeometry(

        .31,

        14,

        8,

        0,

        Math.PI*2,

        0,

        Math.PI*.45

    ),

    hair

);

hairMesh.position.y=2.62;

player.add(hairMesh);

/* ARMS */

function arm(side){

    const pivot =

    new THREE.Group();

    pivot.position.set(

        side*.48,

        2.02,

        0

    );

    const upper =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .12,.13,.56,8

        ),

        shirt

    );

    upper.position.y=-.27;

    const lower =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .095,.11,.52,8

        ),

        skin

    );

    lower.position.y=-.78;

    const hand =

    new THREE.Mesh(

        new THREE.SphereGeometry(

            .11,

            8,

            6

        ),

        skin

    );

    hand.position.y=-1.07;

    pivot.add(

        upper,

        lower,

        hand

    );

    player.add(pivot);

    return pivot;

}

function leg(side){

    const pivot =

    new THREE.Group();

    pivot.position.set(

        side*.20,

        1.04,

        0

    );

    const thigh =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .16,.17,.62,8

        ),

        pants

    );

    thigh.position.y=-.3;

    const shin =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .13,.15,.63,8

        ),

        pants

    );

    shin.position.y=-.9;

    const foot =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            .28,.17,.46

        ),

        shoe

    );

    foot.position.set(

        0,

        -1.27,

        -.1

    );

    pivot.add(

        thigh,

        shin,

        foot

    );

    player.add(pivot);

    return pivot;

}

const armL=arm(-1);

const armR=arm(1);

const legL=leg(-1);

const legR=leg(1);

player.visible=false;

scene.add(player);

/* ======================================================

   CHECKPOINT

====================================================== */

const checkpoint =

new THREE.Group();

const ring =

new THREE.Mesh(

    new THREE.TorusGeometry(

        4,.45,12,36

    ),

    new THREE.MeshStandardMaterial({

        color:0xffd62d,

        emissive:0xb87b00,

        emissiveIntensity:1.8

    })

);

ring.rotation.x=

Math.PI/2;

ring.position.y=1.5;

const beam =

new THREE.Mesh(

    new THREE.CylinderGeometry(

        3.7,

        3.7,

        12,

        26,

        1,

        true

    ),

    new THREE.MeshBasicMaterial({

        color:0xffdf44,

        transparent:true,

        opacity:.13,

        side:THREE.DoubleSide

    })

);

beam.position.y=6;

checkpoint.add(

    ring,

    beam

);

checkpoint.position.set(

    180,

    0,

    -180

);

scene.add(checkpoint);

/* ======================================================

   GAME STATE

====================================================== */

let mode="vehicle";

let carHeading=0;

/*

Actual direction the car is sliding.

*/

let velocityHeading=0;

let speed=0;

/*

Smoothed steering input.

*/

let steeringInput=0;

let playerHeading=0;

let walkTime=0;

/*

Walking camera orbit.

*/

let walkCameraYaw=0;

let walkCameraPitch=.34;

const controls={

    joyX:0,

    joyY:0,

    gas:false,

    brake:false,

    reverse:false,

    handbrake:false,

    run:false

};

/*

Driving settings.

*/

const WHEELBASE=2.65;

const MAX_STEER_LOW=.58;

const MAX_STEER_HIGH=.18;

const MAX_SPEED=34;

const MAX_REVERSE=9;

const ENGINE_FORCE=8.8;

const BRAKE_FORCE=22;

const REVERSE_FORCE=7;

const ROAD_DRAG=2.2;

const GRASS_DRAG=7;

/* ======================================================

   UI

====================================================== */

const speedText =

document.getElementById("speed");

const statusText =

document.getElementById("status");

const surfaceText =

document.getElementById("surface");

const missionText =

document.getElementById("mission");

const vehicleControls =

document.getElementById("vehicleControls");

const actionButton =

document.getElementById("action");

const runButton =

document.getElementById("run");

const cameraHint =

document.getElementById("cameraHint");

/* ======================================================

   JOYSTICK

====================================================== */

const stickArea =

document.getElementById("stickArea");

const stick =

document.getElementById("stick");

const STICK_RADIUS=45;

let stickPointer=null;

function updateStick(

    clientX,

    clientY

){

    const rect =

    stickArea.getBoundingClientRect();

    const cx =

    rect.left+

    rect.width/2;

    const cy =

    rect.top+

    rect.height/2;

    let dx=

    clientX-cx;

    let dy=

    clientY-cy;

    const len=

    Math.hypot(

        dx,dy

    );

    if(len>STICK_RADIUS){

        dx=

        dx/len*

        STICK_RADIUS;

        dy=

        dy/len*

        STICK_RADIUS;

    }

    controls.joyX=

    dx/STICK_RADIUS;

    controls.joyY=

    dy/STICK_RADIUS;

    stick.style.transform=

    `translate(${dx}px,${dy}px)`;

}

function resetStick(){

    controls.joyX=0;

    controls.joyY=0;

    stick.style.transform=

    "translate(0px,0px)";

}

stickArea.addEventListener(

    "pointerdown",

    e=>{

        e.preventDefault();

        if(stickPointer!==null)

            return;

        stickPointer=

        e.pointerId;

        stickArea.setPointerCapture(

            e.pointerId

        );

        updateStick(

            e.clientX,

            e.clientY

        );

    }

);

stickArea.addEventListener(

    "pointermove",

    e=>{

        if(

            e.pointerId!==

            stickPointer

        ) return;

        e.preventDefault();

        updateStick(

            e.clientX,

            e.clientY

        );

    }

);

function stickRelease(e){

    if(

        e.pointerId!==

        stickPointer

    ) return;

    stickPointer=null;

    resetStick();

}

stickArea.addEventListener(

    "pointerup",

    stickRelease

);

stickArea.addEventListener(

    "pointercancel",

    stickRelease

);

/* ======================================================

   BUTTONS

====================================================== */

function holdButton(

    id,

    property

){

    const button=

    document.getElementById(id);

    button.addEventListener(

        "pointerdown",

        e=>{

            e.preventDefault();

            controls[property]=true;

            try{

                button.setPointerCapture(

                    e.pointerId

        }

    );

    function release(e){

        controls[property]=false;

    }

    button.addEventListener(

        "pointerup",

        release

    );

    button.addEventListener(

        "pointercancel",

        release

    );

}

);

/* ======================================================

   COLLISION

====================================================== */

function hitsBuilding(

    pos,

    radius

){

    const test =

    new THREE.Box3(

        new THREE.Vector3(

            pos.x-radius,

            .02,

            pos.z-radius

        ),

        new THREE.Vector3(

            pos.x+radius,

            3,

            pos.z+radius

        )

    );

    for(const box of buildingBoxes){

        if(

            test.intersectsBox(

                box

            )

        ){

            return true;

        }

    }

    return false;

}

/* ======================================================

   ANGLE HELPER

====================================================== */

function shortestAngle(

    from,

    to

){

    let diff=

    to-from;

    while(diff>Math.PI)

        diff-=Math.PI*2;

    while(diff<-Math.PI)

        diff+=Math.PI*2;

    return diff;

}

/* ======================================================

   VEHICLE PHYSICS V4

====================================================== */

function updateVehicle(dt){

    const onRoad=

    isOnRoad(

        car.position

    );

    surfaceText.textContent=

    onRoad

    ? "ROAD"

    : "OFF ROAD";

    /*

    ACCELERATION

    */

    if(controls.gas){

        if(speed<0){

            speed +=

            BRAKE_FORCE*dt;

            if(speed>0)

                speed=0;

        }

        else{

            /*

            Engine gets weaker near top speed.

            */

            const powerLoss=

            1-

            Math.min(

                speed/MAX_SPEED,

                1

            )*.72;

            speed +=

            ENGINE_FORCE*

            powerLoss*

            dt;

        }

    }

    /*

    BRAKE

    */

    if(controls.brake){

        if(speed>0){

            speed -=

            BRAKE_FORCE*dt;

            if(speed<0)

                speed=0;

        }

        else if(speed<0){

            speed +=

            BRAKE_FORCE*dt;

            if(speed>0)

                speed=0;

        }

    }

    /*

    REVERSE

    */

    if(controls.reverse){

        if(speed>0){

            speed -=

            BRAKE_FORCE*dt;

            if(speed<0)

                speed=0;

        }

        else{

            speed -=

            REVERSE_FORCE*dt;

        }

    }

    /*

    ROLLING RESISTANCE

    */

    if(

        !controls.gas &&

        !controls.reverse &&

        !controls.brake

    ){

        const drag=

        onRoad

        ? ROAD_DRAG

        : GRASS_DRAG;

        if(speed>0){

            speed -=

            drag*dt;

            if(speed<0)

                speed=0;

        }

        else if(speed<0){

            speed +=

            drag*dt;

            if(speed>0)

                speed=0;

        }

    }

    /*

    OFF ROAD SPEED LIMIT

    */

    const maxForward=

    onRoad

    ? MAX_SPEED

    : 15;

    speed=

    THREE.MathUtils.clamp(

        speed,

        -MAX_REVERSE,

        maxForward

    );

    const absSpeed=

    Math.abs(speed);

    const speedRatio=

    Math.min(

        absSpeed/MAX_SPEED,

        1

    );

    /*

    SMOOTH STEERING INPUT

    */

    const steeringResponse=

    absSpeed<5

    ? 7

    : 4.5;

    steeringInput=

    THREE.MathUtils.lerp(

        steeringInput,

        controls.joyX,

        Math.min(

            1,

            steeringResponse*dt

        )

    );

    /*

    Strong steering centering.

    */

    if(

        Math.abs(

            controls.joyX

        )<.025

    ){

        steeringInput=

        THREE.MathUtils.lerp(

            steeringInput,

            0,

            Math.min(

                1,

                9*dt

            )

        );

    }

    /*

    Maximum wheel angle becomes

    smaller as speed increases.

    */

    let maxSteer=

    THREE.MathUtils.lerp(

        MAX_STEER_LOW,

        MAX_STEER_HIGH,

        speedRatio

    );

    if(!onRoad)

        maxSteer*=.72;

    let steerAngle=

    steeringInput*

    maxSteer;

    /*

    Bicycle model.

    yaw rate = velocity / wheelbase

               * tan(steering angle)

    */

    if(absSpeed>.15){

        let yawRate=

        (speed/WHEELBASE)*

        Math.tan(

            steerAngle

        );

        /*

        Handbrake increases rotation,

        especially at medium speed.

        */

        if(

            controls.handbrake &&

            absSpeed>4

        ){

            yawRate*=1.55;

        }

        carHeading -=

        yawRate*dt;

    }

    /*

    FRONT WHEELS VISUAL.

    */

    wheelFL.rotation.y=

    steerAngle;

    wheelFR.rotation.y=

    steerAngle;

    /*

    VEHICLE GRIP

    velocityHeading is where momentum

    is actually traveling.

    */

    let grip=

    onRoad

    ? 8.5

    : 3.5;

    /*

    More lateral slip at high speed.

    */

    grip *=

    THREE.MathUtils.lerp(

        1,

        .72,

        speedRatio

    );

    /*

    Handbrake breaks rear grip.

    */

    if(

        controls.handbrake &&

        absSpeed>4

    ){

        grip=.8;

        speed *=

        Math.pow(

            .60,

            dt

        );

    }

    const headingDifference=

    shortestAngle(

        velocityHeading,

        carHeading

    );

    velocityHeading +=

    headingDifference*

    Math.min(

        1,

        grip*dt

    );

    /*

    Very low speed should not slide.

    */

    if(absSpeed<1.5){

        velocityHeading=

        carHeading;

    }

    const moveDirection=

    new THREE.Vector3(

        -Math.sin(

            velocityHeading

        ),

        0,

        -Math.cos(

            velocityHeading

        )

    );

    const previous=

    car.position.clone();

    car.position

    .addScaledVector(

        moveDirection,

        speed*dt

    );

    car.position.x=

    THREE.MathUtils.clamp(

        car.position.x,

        -WORLD_HALF,

        WORLD_HALF

    );

    car.position.z=

    THREE.MathUtils.clamp(

        car.position.z,

        -WORLD_HALF,

        WORLD_HALF

    );

    /*

    BUILDING COLLISION.

    */

    if(

        hitsBuilding(

            car.position,

            1.4

        )

    ){

        car.position.copy(

            previous

        );

        speed *= -.05;

        velocityHeading=

        carHeading;

    }

    car.rotation.y=

    carHeading;

    /*

    BODY ROLL.

    */

    const lateralDifference=

    shortestAngle(

        velocityHeading,

        carHeading

    );

    const targetRoll=

    THREE.MathUtils.clamp(

        lateralDifference*.42,

        -.10,

        .10

    );

    car.rotation.z=

    THREE.MathUtils.lerp(

        car.rotation.z,

        targetRoll,

        .08

    );

    /*

    ACCELERATION PITCH.

    */

    let targetPitch=0;

    if(

        controls.brake &&

        speed>1

    ){

        targetPitch=-.033;

    }

    else if(

        controls.gas &&

        speed>1

    ){

        targetPitch=.017;

    }

    car.rotation.x=

    THREE.MathUtils.lerp(

        car.rotation.x,

        targetPitch,

        .06

    );

    car.position.y=

    .02+

    Math.sin(

        performance.now()*.009

    )*

    speedRatio*

    .009;

    speedText.textContent=

    Math.round(

        Math.abs(speed)*

        2.23694

    )+

    " MPH";

}

/* ======================================================

   WALK CAMERA TOUCH LOOK

====================================================== */

let lookPointer=null;

let previousLookX=0;

let previousLookY=0;

document.addEventListener(

    "pointerdown",

    e=>{

        if(mode!=="walking")

            return;

        /*

        Left side belongs to movement joystick.

        Bottom right belongs to RUN.

        Action button area is also excluded.

        */

        if(e.clientX<innerWidth*.48)

            return;

        if(

            e.clientY>

            innerHeight-125

        ) return;

        lookPointer=e.pointerId;

        previousLookX=e.clientX;

        previousLookY=e.clientY;

    }

);

document.addEventListener(

    "pointermove",

    e=>{

        if(

            mode!=="walking" ||

            e.pointerId!==lookPointer

        ) return;

        const dx=

        e.clientX-

        previousLookX;

        const dy=

        e.clientY-

        previousLookY;

        previousLookX=

        e.clientX;

        previousLookY=

        e.clientY;

        walkCameraYaw -=

        dx*.008;

        walkCameraPitch +=

        dy*.004;

        walkCameraPitch=

        THREE.MathUtils.clamp(

            walkCameraPitch,

            .12,

            .60

        );

    }

);

function endLook(e){

    if(

        e.pointerId===

        lookPointer

    ){

        lookPointer=null;

    }

}

document.addEventListener(

    "pointerup",

    endLook

);

document.addEventListener(

    "pointercancel",

    endLook

);

/* ======================================================

   WALKING

====================================================== */

function updatePlayer(dt){

    const x=

    controls.joyX;

    const y=

    controls.joyY;

    const amount=

    Math.min(

        1,

        Math.hypot(

            x,y

        )

    );

    if(amount>.08){

        /*

        Movement is based on the

        WALK CAMERA, not the player facing.

        */

        const forward=

        new THREE.Vector3(

            -Math.sin(

                walkCameraYaw

            ),

            0,

            -Math.cos(

                walkCameraYaw

            )

        );

        const right=

        new THREE.Vector3(

            -forward.z,

            0,

            forward.x

        );

        const movement=

        new THREE.Vector3();

        movement.addScaledVector(

            right,

            x

        );

        movement.addScaledVector(

            forward,

            -y

        );

        movement.normalize();

        const movementSpeed=

        controls.run

        ? 6.4

        : 3.3;

        const previous=

        player.position.clone();

        player.position

        .addScaledVector(

            movement,

            movementSpeed*

            amount*

            dt

        );

        player.position.x=

        THREE.MathUtils.clamp(

            player.position.x,

            -WORLD_HALF,

            WORLD_HALF

        );

        player.position.z=

        THREE.MathUtils.clamp(

            player.position.z,

            -WORLD_HALF,

            WORLD_HALF

        );

        if(

            hitsBuilding(

                player.position,

                .42

            )

        ){

            player.position.copy(

                previous

            );

        }

        /*

        Rotate character toward

        actual movement direction.

        */

        const targetHeading=

        Math.atan2(

            -movement.x,

            -movement.z

        );

        const turnDifference=

        shortestAngle(

            playerHeading,

            targetHeading

        );

        playerHeading +=

        turnDifference*

        Math.min(

            1,

            12*dt

        );

        player.rotation.y=

        playerHeading;

        /*

        WALK ANIMATION

        */

        walkTime +=

        dt*

        (

            controls.run

            ? 11

            : 7

        );

        const swing=

        Math.sin(

            walkTime

        )*

        (

            controls.run

            ? .72

            : .48

        );

        legL.rotation.x=

        swing;

        legR.rotation.x=

        -swing;

        armL.rotation.x=

        -swing*.75;

        armR.rotation.x=

        swing*.75;

        torso.position.y=

        1.7+

        Math.abs(

            Math.sin(

                walkTime

            )

        )*.022;

        speedText.textContent=

        controls.run

        ? "RUNNING"

        : "WALKING";

    }

    else{

        legL.rotation.x=

        THREE.MathUtils.lerp(

            legL.rotation.x,

            0,

            .18

        );

        legR.rotation.x=

        THREE.MathUtils.lerp(

            legR.rotation.x,

            0,

            .18

        );

        armL.rotation.x=

        THREE.MathUtils.lerp(

            armL.rotation.x,

            0,

            .18

        );

        armR.rotation.x=

        THREE.MathUtils.lerp(

            armR.rotation.x,

            0,

            .18

        );

        torso.position.y=

        THREE.MathUtils.lerp(

            torso.position.y,

            1.7,

            .18

        );

        speedText.textContent=

        "ON FOOT";

    }

    updateEnterButton();

}

/* ======================================================

   ENTER / EXIT

====================================================== */

function exitVehicle(){

    if(mode!=="vehicle")

        return;

    if(Math.abs(speed)>3){

        actionButton.textContent=

        "STOP FIRST";

        speed *= .35;

        setTimeout(()=>{

            if(mode==="vehicle")

                actionButton.textContent=

                "EXIT";

        },600);

        return;

    }

    speed=0;

    steeringInput=0;

    velocityHeading=

    carHeading;

    mode="walking";

    const side=

    new THREE.Vector3(

        -Math.cos(

            carHeading

        ),

        0,

        Math.sin(

            carHeading

        )

    );

    player.position.copy(

        car.position

    );

    player.position

    .addScaledVector(

        side,

        2.2

    );

    if(

        hitsBuilding(

            player.position,

            .45

        )

    ){

        player.position.copy(

            car.position

        );

        player.position

        .addScaledVector(

            side,

            -2.2

        );

    }

    player.position.y=0;

    playerHeading=

    carHeading;

    player.rotation.y=

    playerHeading;

    /*

    Camera starts behind character

    but can now rotate independently.

    */

    walkCameraYaw=

    carHeading;

    walkCameraPitch=.32;

    player.visible=true;

    vehicleControls.style.display=

    "none";

    runButton.style.display=

    "block";

    cameraHint.style.display=

    "block";

    actionButton.style.display=

    "block";

    actionButton.textContent=

    "ENTER CAR";

    statusText.textContent=

    "ON FOOT";

    surfaceText.textContent="";

    resetStick();

}

function enterVehicle(){

    if(mode!=="walking")

        return;

    const distance=

    player.position

    .distanceTo(

        car.position

    );

    if(distance>4.6)

        return;

    mode="vehicle";

    player.visible=false;

    velocityHeading=

    carHeading;

    vehicleControls.style.display=

    "block";

    runButton.style.display=

    "none";

    cameraHint.style.display=

    "none";

    actionButton.style.display=

    "block";

    actionButton.textContent=

    "EXIT";

    statusText.textContent=

    "IN VEHICLE";

    resetStick();

}

function updateEnterButton(){

    if(mode!=="walking")

        return;

    const distance=

    player.position

    .distanceTo(

        car.position

    );

    if(distance<=4.6){

        actionButton.style.display=

        "block";

        actionButton.textContent=

        "ENTER CAR";

    }

    else{

        actionButton.style.display=

        "none";

    }

}

actionButton.addEventListener(

    "pointerup",

    e=>{

        e.preventDefault();

        if(mode==="vehicle")

            exitVehicle();

        else

            enterVehicle();

    }

);

/* ======================================================

   CAMERA COLLISION

====================================================== */

const raycaster=

new THREE.Raycaster();

const rayDirection=

new THREE.Vector3();

function cameraCollision(

    focus,

    desired

){

    const direction=

    desired.clone()

    .sub(focus);

    const desiredDistance=

    direction.length();

    if(desiredDistance<.01)

        return desired;

    direction.normalize();

    raycaster.set(

        focus,

        direction

    );

    raycaster.far=

    desiredDistance;

    const hits=

    raycaster.intersectObjects(

        buildingMeshes,

        false

    );

    if(hits.length>0){

        const safeDistance=

        Math.max(

            1.3,

            hits[0].distance-.7

        );

        return focus.clone()

        .addScaledVector(

            direction,

            safeDistance

        );

    }

    return desired;

}

/* ======================================================

   CAMERA

====================================================== */

const desiredCamera=

new THREE.Vector3();

const cameraFocus=

new THREE.Vector3();

function updateCamera(dt){

    if(mode==="vehicle"){

        const speedRatio=

        Math.min(

            Math.abs(speed)/

            MAX_SPEED,

            1

        );

        /*

        Behind the CAR direction.

        */

        const back=

        new THREE.Vector3(

            Math.sin(

                carHeading

            ),

            0,

            Math.cos(

                carHeading

            )

        );

        const forward=

        new THREE.Vector3(

            -Math.sin(

                carHeading

            ),

            0,

            -Math.cos(

                carHeading

            )

        );

        const distance=

        THREE.MathUtils.lerp(

            8.8,

            11,

            speedRatio

        );

        const height=

        THREE.MathUtils.lerp(

            4.3,

            5.2,

            speedRatio

        );

        desiredCamera.copy(

            car.position

        );

        desiredCamera.addScaledVector(

            back,

            distance

        );

        desiredCamera.y+=height;

        cameraFocus.copy(

            car.position

        );

        cameraFocus.addScaledVector(

            forward,

            2.5+

            speedRatio*3.2

        );

        cameraFocus.y=1.1;

        const safePosition=

        cameraCollision(

            cameraFocus,

            desiredCamera

        );

        camera.position.lerp(

            safePosition,

            1-

            Math.exp(

                -5*dt

            )

        );

        camera.lookAt(

            cameraFocus

        );

        const targetFov=

        64+

        speedRatio*5;

        camera.fov=

        THREE.MathUtils.lerp(

            camera.fov,

            targetFov,

            .04

        );

        camera.updateProjectionMatrix();

    }

    else{

        /*

        FREE THIRD-PERSON CAMERA.

        */

        const horizontalDistance=

        5.8;

        const horizontal=

        Math.cos(

            walkCameraPitch

        )*

        horizontalDistance;

        const vertical=

        2.1+

        Math.sin(

            walkCameraPitch

        )*

        4.3;

        desiredCamera.set(

            player.position.x+

            Math.sin(

                walkCameraYaw

            )*

            horizontal,

            player.position.y+

            vertical,

            player.position.z+

            Math.cos(

                walkCameraYaw

            )*

            horizontal

        );

        cameraFocus.copy(

            player.position

        );

        cameraFocus.y=1.45;

        /*

        Camera cannot pass through buildings.

        */

        const safePosition=

        cameraCollision(

            cameraFocus,

            desiredCamera

        );

        camera.position.lerp(

            safePosition,

            1-

            Math.exp(

                -8*dt

            )

        );

        camera.lookAt(

            cameraFocus

        );

        camera.fov=

        THREE.MathUtils.lerp(

            camera.fov,

            64,

            .05

        );

        camera.updateProjectionMatrix();

    }

}

/* ======================================================

   MISSIONS

====================================================== */

const missionPoints=[

    new THREE.Vector3(

        180,0,-180

    ),

    new THREE.Vector3(

        -180,0,180

    ),

    new THREE.Vector3(

        270,0,90

    ),

    new THREE.Vector3(

        -270,0,-90

    )

];

let missionNumber=1;

let missionCooldown=false;

function updateMission(time){

    ring.rotation.z+=.01;

    ring.position.y=

    1.5+

    Math.sin(

        time*.003

    )*.28;

    const position=

    mode==="vehicle"

    ? car.position

    : player.position;

    const distance=

    position.distanceTo(

        checkpoint.position

    );

    if(!missionCooldown){

        missionText.textContent=

        "MISSION "+

        missionNumber+

        ": Reach checkpoint — "+

        Math.round(distance)+

        " m";

    }

    if(

        distance<7 &&

        !missionCooldown

    ){

        missionCooldown=true;

        missionText.textContent=

        "MISSION COMPLETE — $500";

        setTimeout(()=>{

            missionNumber++;

            checkpoint.position.copy(

                missionPoints[

                    (missionNumber-1)%

                    missionPoints.length

                ]

            );

            missionCooldown=false;

        },1600);

    }

}

/* ======================================================

   INITIAL CAMERA

====================================================== */

camera.position.set(

    0,

    5,

    10

);

camera.lookAt(

    car.position

);

/* ======================================================

   MAIN LOOP

====================================================== */

const clock=

new THREE.Clock();

function animate(time){

    requestAnimationFrame(

        animate

    );

    let dt=

    clock.getDelta();

    dt=

    Math.min(

        dt,

        .04

    );

    if(mode==="vehicle"){

        updateVehicle(dt);

    }else{

        updatePlayer(dt);

    }

    updateCamera(dt);

    updateMission(time);

    renderer.render(

        scene,

        camera

    );

}

requestAnimationFrame(

    animate

);

/* ======================================================

   RESIZE / SAFARI

====================================================== */

window.addEventListener(

    "resize",

    ()=>{

        camera.aspect=

        innerWidth/

        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(

            innerWidth,

            innerHeight

        );

    }

);

document.addEventListener(

    "gesturestart",

    e=>e.preventDefault()

);

document.addEventListener(

    "contextmenu",

    e=>e.preventDefault()

);
