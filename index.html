<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta

    name="viewport"

    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"

  />

  <meta name="theme-color" content="#111111" />

  <title>Utica Drive</title>

  <link rel="stylesheet" href="./style.css" />

</head>

<body>

  <div id="game"></div>

  <div id="loading">

    <div class="loadingCard">

      <div class="gameTitle">

        UTICA DRIVE

      </div>

      <div id="loadingText">

        Loading Utica...

      </div>

      <div class="loadingTrack">

        <div class="loadingBar"></div>

      </div>

    </div>

  </div>

  <div id="hud">

    <div class="hudCity">

      UTICA, NEW YORK

    </div>

    <div id="modeLabel">

      DRIVING

    </div>

    <div id="speedLabel">

      0 MPH

    </div>

  </div>

  <div id="message"></div>

  <!-- WALKING -->

  <div id="joystickArea">

    <div id="joystickBase">

      <div id="joystickKnob"></div>

    </div>

  </div>

  <!-- DRIVING -->

  <div id="steeringControls">

    <button

      id="leftBtn"

      class="gameButton roundButton"

    >

      ◀

    </button>

    <button

      id="rightBtn"

      class="gameButton roundButton"

    >

      ▶

    </button>

  </div>

  <div id="pedalControls">

    <button

      id="gasBtn"

      class="gameButton tallPedal"

    >

      GAS

    </button>

    <button

      id="brakeBtn"

      class="gameButton pedal"

    >

      BRAKE

    </button>

    <button

      id="reverseBtn"

      class="gameButton pedal"

    >

      REVERSE

    </button>

  </div>

  <div id="actionControls">

    <button

      id="enterExitBtn"

      class="gameButton actionButton"

    >

      EXIT

    </button>

    <button

      id="runBtn"

      class="gameButton actionButton"

    >

      RUN

    </button>

  </div>

  <script

    type="module"

    src="./app.js"

  ></script>

</body>

</html>
