<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

content="width=device-width,

initial-scale=1,

maximum-scale=1,

user-scalable=no,

viewport-fit=cover">

<title>Utica Open World 3D</title>

<style>

*{

    box-sizing:border-box;

    -webkit-user-select:none;

    user-select:none;

    -webkit-touch-callout:none;

}

html,body{

    width:100%;

    height:100%;

    margin:0;

    overflow:hidden;

    background:#111;

    touch-action:none;

    font-family:Arial,Helvetica,sans-serif;

}

canvas{

    display:block;

    width:100%;

    height:100%;

}

/* =========================

   HUD

========================= */

#hud{

    position:fixed;

    top:max(14px,env(safe-area-inset-top));

    left:15px;

    z-index:20;

    color:white;

    text-shadow:0 2px 6px #000;

    pointer-events:none;

}

#speed{

    font-size:28px;

    font-weight:900;

}

#status{

    font-size:13px;

    margin-top:2px;

}

#mission{

    margin-top:8px;

    font-size:13px;

    max-width:230px;

    line-height:1.3;

    background:rgba(0,0,0,.42);

    padding:8px 10px;

    border-radius:9px;

}

/* =========================

   JOYSTICK

========================= */

#stickArea{

    position:fixed;

    left:18px;

    bottom:max(24px,env(safe-area-inset-bottom));

    width:150px;

    height:150px;

    z-index:30;

    touch-action:none;

}

#stickBase{

    position:absolute;

    width:118px;

    height:118px;

    left:16px;

    top:16px;

    border-radius:50%;

    background:rgba(20,20,20,.38);

    border:3px solid rgba(255,255,255,.35);

    box-shadow:

    0 4px 12px rgba(0,0,0,.45),

    inset 0 0 20px rgba(255,255,255,.08);

}

#stick{

    position:absolute;

    width:58px;

    height:58px;

    left:46px;

    top:46px;

    border-radius:50%;

    background:rgba(255,255,255,.78);

    border:3px solid rgba(0,0,0,.45);

    box-shadow:0 4px 10px rgba(0,0,0,.4);

    pointer-events:none;

}

/* =========================

   VEHICLE BUTTONS

========================= */

#vehicleControls{

    position:fixed;

    right:15px;

    bottom:max(22px,env(safe-area-inset-bottom));

    width:180px;

    height:190px;

    z-index:30;

}

.gameButton{

    position:absolute;

    border:none;

    color:#fff;

    font-weight:900;

    touch-action:none;

    box-shadow:

    inset 0 0 0 2px rgba(255,255,255,.22),

    0 5px 12px rgba(0,0,0,.45);

}

#gas{

    width:88px;

    height:88px;

    border-radius:50%;

    right:0;

    bottom:0;

    background:rgba(22,170,69,.78);

    font-size:19px;

}

#brake{

    width:72px;

    height:72px;

    border-radius:50%;

    left:4px;

    bottom:4px;

    background:rgba(215,42,42,.82);

    font-size:13px;

}

#handbrake{

    width:83px;

    height:48px;

    right:2px;

    top:8px;

    border-radius:14px;

    background:rgba(30,30,30,.76);

    font-size:11px;

}

/* =========================

   WALK BUTTON

========================= */

#run{

    position:fixed;

    right:23px;

    bottom:max(38px,env(safe-area-inset-bottom));

    width:82px;

    height:82px;

    border:none;

    border-radius:50%;

    background:rgba(38,102,220,.80);

    color:white;

    font-weight:900;

    font-size:16px;

    display:none;

    z-index:30;

    touch-action:none;

    box-shadow:

    inset 0 0 0 2px rgba(255,255,255,.25),

    0 5px 12px rgba(0,0,0,.45);

}

/* =========================

   ACTION BUTTON

========================= */

#action{

    position:fixed;

    top:max(72px,calc(env(safe-area-inset-top) + 58px));

    right:15px;

    min-width:105px;

    height:48px;

    padding:0 14px;

    border:none;

    border-radius:14px;

    background:rgba(15,15,15,.72);

    color:white;

    font-weight:900;

    font-size:13px;

    z-index:30;

    touch-action:none;

    box-shadow:

    inset 0 0 0 2px rgba(255,255,255,.28),

    0 4px 12px rgba(0,0,0,.5);

}

/* =========================

   MINI LOGO

========================= */

#logo{

    position:fixed;

    top:max(16px,env(safe-area-inset-top));

    right:15px;

    color:white;

    font-size:11px;

    letter-spacing:1px;

    font-weight:bold;

    opacity:.72;

    z-index:10;

    pointer-events:none;

    text-shadow:0 2px 4px #000;

}

</style>

</head>

<body>

<div id="hud">

    <div id="speed">0 MPH</div>

    <div id="status">IN VEHICLE</div>

    <div id="mission">

        MISSION: Drive to the glowing checkpoint.

    </div>

</div>

<div id="logo">

    UTICA OPEN WORLD

</div>

<div id="stickArea">

    <div id="stickBase"></div>

    <div id="stick"></div>

</div>

<div id="vehicleControls">

    <button

    id="handbrake"

    class="gameButton">

        HANDBRAKE

    </button>

    <button

    id="brake"

    class="gameButton">

        BRAKE

    </button>

    <button

    id="gas"

    class="gameButton">

        GAS

    </button>

</div>

<button id="run">

RUN

</button>

<button id="action">

EXIT

</button>

<script type="module">

import * as THREE

from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =====================================================

   THREE.JS SETUP

===================================================== */

const scene =

new THREE.Scene();

scene.background =

new THREE.Color(0x89bce6);

scene.fog =

new THREE.Fog(

    0x89bce6,

    180,

    750

);

const camera =

new THREE.PerspectiveCamera(

    67,

    innerWidth / innerHeight,

    .1,

    1200

);

const renderer =

new THREE.WebGLRenderer({

    antialias:true,

    powerPreference:"high-performance"

});

renderer.setPixelRatio(

    Math.min(

        devicePixelRatio,

        1.6

    )

);

renderer.setSize(

    innerWidth,

    innerHeight

);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =

THREE.PCFSoftShadowMap;

document.body.prepend(

    renderer.domElement

);

/* =====================================================

   LIGHTING

===================================================== */

const hemi =

new THREE.HemisphereLight(

    0xcdeaff,

    0x566b42,

    2.0

);

scene.add(hemi);

const sun =

new THREE.DirectionalLight(

    0xffffff,

    2.3

);

sun.position.set(

    -150,

    220,

    100

);

sun.castShadow = true;

sun.shadow.mapSize.width = 1024;

sun.shadow.mapSize.height = 1024;

sun.shadow.camera.left = -180;

sun.shadow.camera.right = 180;

sun.shadow.camera.top = 180;

sun.shadow.camera.bottom = -180;

scene.add(sun);

/* =====================================================

   WORLD

===================================================== */

const WORLD_SIZE = 900;

/* GROUND */

const grass =

new THREE.Mesh(

    new THREE.PlaneGeometry(

        WORLD_SIZE,

        WORLD_SIZE

    ),

    new THREE.MeshStandardMaterial({

        color:0x63864a,

        roughness:1

    })

);

grass.rotation.x =

-Math.PI / 2;

grass.receiveShadow = true;

scene.add(grass);

/* =====================================================

   ROADS

===================================================== */

const roadMaterial =

new THREE.MeshStandardMaterial({

    color:0x343434,

    roughness:.95

});

function road(

    x,

    z,

    width,

    depth

){

    const r =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            width,

            .08,

            depth

        ),

        roadMaterial

    );

    r.position.set(

        x,

        .04,

        z

    );

    r.receiveShadow = true;

    scene.add(r);

    return r;

}

/*

Large grid of streets.

*/

for(

    let x = -360;

    x <= 360;

    x += 90

){

    road(

        x,

        0,

        24,

        850

    );

}

for(

    let z = -360;

    z <= 360;

    z += 90

){

    road(

        0,

        z,

        850,

        24

    );

}

/* =====================================================

   ROAD MARKINGS

===================================================== */

const lineMaterial =

new THREE.MeshBasicMaterial({

    color:0xf2d56b

});

function roadLine(

    x,

    z,

    width,

    depth

){

    const line =

    new THREE.Mesh(

        new THREE.PlaneGeometry(

            width,

            depth

        ),

        lineMaterial

    );

    line.rotation.x =

    -Math.PI / 2;

    line.position.set(

        x,

        .095,

        z

    );

    scene.add(line);

}

for(

    let x = -360;

    x <= 360;

    x += 90

){

    for(

        let z = -390;

        z <= 390;

        z += 20

    ){

        roadLine(

            x,

            z,

            .35,

            9

        );

    }

}

for(

    let z = -360;

    z <= 360;

    z += 90

){

    for(

        let x = -390;

        x <= 390;

        x += 20

    ){

        roadLine(

            x,

            z,

            9,

            .35

        );

    }

}

/* =====================================================

   BUILDINGS

===================================================== */

const buildingBoxes = [];

const colors = [

    0xb69c7c,

    0x978d83,

    0xb8b0a3,

    0x826e62,

    0x9c765e,

    0xa4a39c,

    0x786d64

];

function makeBuilding(

    x,

    z,

    w,

    d,

    h

){

    const color =

    colors[

        Math.floor(

            Math.random() *

            colors.length

        )

    ];

    const building =

    new THREE.Mesh(

        new THREE.BoxGeometry(

            w,

            h,

            d

        ),

        new THREE.MeshStandardMaterial({

            color:color,

            roughness:.92

        })

    );

    building.position.set(

        x,

        h / 2,

        z

    );

    building.castShadow = true;

    building.receiveShadow = true;

    scene.add(building);

    const box =

    new THREE.Box3().setFromObject(

        building

    );

    buildingBoxes.push(box);

    /*

    Rooftop detail.

    */

    if(h > 25){

        const unit =

        new THREE.Mesh(

            new THREE.BoxGeometry(

                w * .28,

                2.5,

                d * .28

            ),

            new THREE.MeshStandardMaterial({

                color:0x555555

            })

        );

        unit.position.set(

            x,

            h + 1.25,

            z

        );

        scene.add(unit);

    }

}

/*

Generate city blocks.

*/

for(

    let gx = -315;

    gx <= 315;

    gx += 90

){

    for(

        let gz = -315;

        gz <= 315;

        gz += 90

    ){

        /*

        Leave central starting block

        slightly more open.

        */

        if(

            Math.abs(gx) < 50 &&

            Math.abs(gz) < 50

        ){

            continue;

        }

        const count =

        2 +

        Math.floor(

            Math.random() * 3

        );

        for(

            let i = 0;

            i < count;

            i++

        ){

            const angle =

            i / count *

            Math.PI * 2;

            const radius =

            17 +

            Math.random() * 10;

            const bx =

            gx +

            Math.cos(angle) *

            radius;

            const bz =

            gz +

            Math.sin(angle) *

            radius;

            const w =

            17 +

            Math.random() * 18;

            const d =

            17 +

            Math.random() * 18;

            const centerDistance =

            Math.sqrt(

                bx * bx +

                bz * bz

            );

            const heightBoost =

            Math.max(

                0,

                1 -

                centerDistance / 400

            );

            const h =

            12 +

            Math.random() *

            (

                18 +

                heightBoost * 48

            );

            makeBuilding(

                bx,

                bz,

                w,

                d,

                h

            );

        }

    }

}

/* =====================================================

   TREES

===================================================== */

function tree(

    x,

    z

){

    const trunk =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .45,

            .6,

            4,

            8

        ),

        new THREE.MeshStandardMaterial({

            color:0x755136

        })

    );

    trunk.position.set(

        x,

        2,

        z

    );

    const crown =

    new THREE.Mesh(

        new THREE.SphereGeometry(

            2.6,

            10,

            8

        ),

        new THREE.MeshStandardMaterial({

            color:0x3f7339

        })

    );

    crown.position.set(

        x,

        5,

        z

    );

    trunk.castShadow = true;

    crown.castShadow = true;

    scene.add(

        trunk,

        crown

    );

}

for(

    let i = 0;

    i < 75;

    i++

){

    let x =

    (Math.random() - .5) *

    780;

    let z =

    (Math.random() - .5) *

    780;

    /*

    Keep trees away from

    main intersections.

    */

    const nx =

    Math.abs(

        x % 90

    );

    const nz =

    Math.abs(

        z % 90

    );

    if(

        nx > 18 &&

        nz > 18

    ){

        tree(

            x,

            z

        );

    }

}

/* =====================================================

   PLAYER CAR

===================================================== */

const car =

new THREE.Group();

/* main body */

const carBody =

new THREE.Mesh(

    new THREE.BoxGeometry(

        2.05,

        .72,

        4.35

    ),

    new THREE.MeshStandardMaterial({

        color:0xc71624,

        metalness:.18,

        roughness:.42

    })

);

carBody.position.y =

.82;

carBody.castShadow = true;

car.add(carBody);

/* cabin */

const cabin =

new THREE.Mesh(

    new THREE.BoxGeometry(

        1.7,

        .72,

        2.05

    ),

    new THREE.MeshStandardMaterial({

        color:0x202a31,

        metalness:.25,

        roughness:.2

    })

);

cabin.position.set(

    0,

    1.43,

    -.1

);

cabin.castShadow = true;

car.add(cabin);

/* front hood */

const hood =

new THREE.Mesh(

    new THREE.BoxGeometry(

        1.82,

        .24,

        1.25

    ),

    new THREE.MeshStandardMaterial({

        color:0xa9101c

    })

);

hood.position.set(

    0,

    1.02,

    -1.48

);

car.add(hood);

/* wheels */

const wheelMaterial =

new THREE.MeshStandardMaterial({

    color:0x111111,

    roughness:.95

});

function createWheel(

    x,

    z

){

    const wheel =

    new THREE.Mesh(

        new THREE.CylinderGeometry(

            .42,

            .42,

            .38,

            16

        ),

        wheelMaterial

    );

    wheel.rotation.z =

    Math.PI / 2;

    wheel.position.set(

        x,

        .47,

        z

    );

    wheel.castShadow = true;

    car.add(wheel);

    return wheel;

}

const frontLeft =

createWheel(

    -1.03,

    -1.35

);

const frontRight =

createWheel(

    1.03,

    -1.35

);

const rearLeft =

createWheel(

    -1.03,

    1.35

);

const rearRight =

createWheel(

    1.03,

    1.35

);

car.position.set(

    0,

    .02,

    0

);

scene.add(car);

/* =====================================================

   PLAYER CHARACTER

===================================================== */

const player =

new THREE.Group();

const playerBody =

new THREE.Mesh(

    new THREE.CapsuleGeometry(

        .42,

        1.15,

        5,

        8

    ),

    new THREE.MeshStandardMaterial({

        color:0x215ac7

    })

);

playerBody.position.y =

1.15;

playerBody.castShadow = true;

player.add(playerBody);

const playerHead =

new THREE.Mesh(

    new THREE.SphereGeometry(

        .35,

        12,

        8

    ),

    new THREE.MeshStandardMaterial({

        color:0xc99370

    })

);

playerHead.position.y =

2.18;

playerHead.castShadow = true;

player.add(playerHead);

player.visible = false;

scene.add(player);

/* =====================================================

   MISSION CHECKPOINT

===================================================== */

const checkpoint =

new THREE.Group();

const checkpointRing =

new THREE.Mesh(

    new THREE.TorusGeometry(

        4,

        .45,

        12,

        36

    ),

    new THREE.MeshStandardMaterial({

        color:0xffd62c,

        emissive:0xaa7600,

        emissiveIntensity:1.8

    })

);

checkpointRing.rotation.x =

Math.PI / 2;

checkpointRing.position.y =

1.2;

checkpoint.add(

    checkpointRing

);

const checkpointBeam =

new THREE.Mesh(

    new THREE.CylinderGeometry(

        3.7,

        3.7,

        11,

        28,

        1,

        true

    ),

    new THREE.MeshBasicMaterial({

        color:0xffdb3a,

        transparent:true,

        opacity:.15,

        side:THREE.DoubleSide

    })

);

checkpointBeam.position.y =

5.5;

checkpoint.add(

    checkpointBeam

);

checkpoint.position.set(

    180,

    0,

    -180

);

scene.add(

    checkpoint

);

/* =====================================================

   GAME STATE

===================================================== */

let mode =

"vehicle";

let heading =

0;

let speed =

0;

/*

meters per second

*/

const MAX_SPEED =

38;

const MAX_REVERSE =

11;

const ACCEL =

15;

const REVERSE_ACCEL =

10;

const BRAKE_POWER =

27;

const DRAG =

4.2;

let playerHeading =

0;

let missionComplete =

false;

/* =====================================================

   CONTROLS

===================================================== */

const controls = {

    joyX:0,

    joyY:0,

    gas:false,

    brake:false,

    handbrake:false,

    run:false

};

const stickArea =

document.getElementById(

    "stickArea"

);

const stick =

document.getElementById(

    "stick"

);

let stickPointer =

null;

const STICK_RADIUS =

43;

/* =====================================================

   JOYSTICK

===================================================== */

function moveStick(

    clientX,

    clientY

){

    const rect =

    stickArea.getBoundingClientRect();

    const cx =

    rect.left +

    rect.width / 2;

    const cy =

    rect.top +

    rect.height / 2;

    let dx =

    clientX - cx;

    let dy =

    clientY - cy;

    const distance =

    Math.sqrt(

        dx * dx +

        dy * dy

    );

    if(

        distance >

        STICK_RADIUS

    ){

        dx =

        dx /

        distance *

        STICK_RADIUS;

        dy =

        dy /

        distance *

        STICK_RADIUS;

    }

    controls.joyX =

    dx /

    STICK_RADIUS;

    controls.joyY =

    dy /

    STICK_RADIUS;

    stick.style.transform =

    `translate(${dx}px,${dy}px)`;

}

function resetStick(){

    controls.joyX = 0;

    controls.joyY = 0;

    stick.style.transform =

    "translate(0px,0px)";

}

stickArea.addEventListener(

    "pointerdown",

    e=>{

        e.preventDefault();

        if(

            stickPointer !== null

        ) return;

        stickPointer =

        e.pointerId;

        stickArea.setPointerCapture(

            e.pointerId

        );

        moveStick(

            e.clientX,

            e.clientY

        );

    }

);

stickArea.addEventListener(

    "pointermove",

    e=>{

        if(

            e.pointerId !==

            stickPointer

        ) return;

        e.preventDefault();

        moveStick(

            e.clientX,

            e.clientY

        );

    }

);

function stickEnd(e){

    if(

        e.pointerId !==

        stickPointer

    ) return;

    stickPointer =

    null;

    resetStick();

}

stickArea.addEventListener(

    "pointerup",

    stickEnd

);

stickArea.addEventListener(

    "pointercancel",

    stickEnd

);

/* =====================================================

   HOLD BUTTONS

===================================================== */

function holdButton(

    id,

    name

){

    const button =

    document.getElementById(

        id

    );

    button.addEventListener(

        "pointerdown",

        e=>{

            e.preventDefault();

            button.setPointerCapture(

                e.pointerId

            );

            controls[name] =

            true;

        }

    );

    const release =

    e=>{

        e.preventDefault();

        controls[name] =

        false;

    };

    button.addEventListener(

        "pointerup",

        release

    );

    button.addEventListener(

        "pointercancel",

        release

    );

}

holdButton(

    "gas",

    "gas"

);

holdButton(

    "brake",

    "brake"

);

holdButton(

    "handbrake",

    "handbrake"

);

holdButton(

    "run",

    "run"

);

/* =====================================================

   COLLISION

===================================================== */

const collisionPosition =

new THREE.Vector3();

function collidesWithBuilding(

    position,

    radius = 1.25

){

    const testBox =

    new THREE.Box3(

        new THREE.Vector3(

            position.x - radius,

            0,

            position.z - radius

        ),

        new THREE.Vector3(

            position.x + radius,

            3,

            position.z + radius

        )

    );

    for(

        const box of

        buildingBoxes

    ){

        if(

            testBox.intersectsBox(

                box

            )

        ){

            return true;

        }

    }

    return false;

}

/* =====================================================

   VEHICLE PHYSICS

===================================================== */

function updateVehicle(dt){

    /*

    ACCELERATION

    */

    if(

        controls.gas

    ){

        if(

            speed < 0

        ){

            speed +=

            BRAKE_POWER *

            dt;

        }else{

            speed +=

            ACCEL *

            dt;

        }

    }

    /*

    BRAKE / REVERSE

    */

    if(

        controls.brake

    ){

        if(

            speed > .8

        ){

            speed -=

            BRAKE_POWER *

            dt;

        }else{

            speed -=

            REVERSE_ACCEL *

            dt;

        }

    }

    /*

    COAST / DRAG

    */

    if(

        !controls.gas &&

        !controls.brake

    ){

        if(

            speed > 0

        ){

            speed -=

            DRAG *

            dt;

            if(

                speed < 0

            ) speed = 0;

        }

        else if(

            speed < 0

        ){

            speed +=

            DRAG *

            dt;

            if(

                speed > 0

            ) speed = 0;

        }

    }

    /*

    HANDBRAKE

    */

    if(

        controls.handbrake

    ){

        speed *=

        Math.pow(

            .12,

            dt

        );

    }

    speed =

    THREE.MathUtils.clamp(

        speed,

        -MAX_REVERSE,

        MAX_SPEED

    );

    /*

    STEERING

    */

    const speedAmount =

    Math.min(

        Math.abs(speed) /

        MAX_SPEED,

        1

    );

    let steerRate =

    THREE.MathUtils.lerp(

        1.85,

        .75,

        speedAmount

    );

    if(

        controls.handbrake

    ){

        steerRate *=

        2.15;

    }

    if(

        Math.abs(speed) >

        .25

    ){

        const direction =

        speed >= 0

        ? 1

        : -1;

        heading -=

        controls.joyX *

        steerRate *

        direction *

        dt;

    }

    /*

    FRONT WHEEL VISUAL

    */

    const wheelAngle =

    controls.joyX *

    .52;

    frontLeft.rotation.y =

    wheelAngle;

    frontRight.rotation.y =

    wheelAngle;

    /*

    MOVE

    */

    const direction =

    new THREE.Vector3(

        -Math.sin(heading),

        0,

        -Math.cos(heading)

    );

    const previous =

    car.position.clone();

    car.position.addScaledVector(

        direction,

        speed * dt

    );

    /*

    WORLD LIMIT

    */

    car.position.x =

    THREE.MathUtils.clamp(

        car.position.x,

        -425,

        425

    );

    car.position.z =

    THREE.MathUtils.clamp(

        car.position.z,

        -425,

        425

    );

    /*

    BUILDING COLLISION

    */

    if(

        collidesWithBuilding(

            car.position,

            1.35

        )

    ){

        car.position.copy(

            previous

        );

        speed *=

        -.16;

    }

    car.rotation.y =

    heading;

    /*

    BODY LEAN

    */

    car.rotation.z =

    THREE.MathUtils.lerp(

        car.rotation.z,

        controls.joyX *

        speedAmount *

        -.045,

        .09

    );

    car.rotation.x =

    THREE.MathUtils.lerp(

        car.rotation.x,

        controls.brake

        ? -.025

        : controls.gas

        ? .018

        : 0,

        .08

    );

    const mph =

    Math.abs(speed) *

    2.23694;

    document.getElementById(

        "speed"

    ).textContent =

    Math.round(mph) +

    " MPH";

}

/* =====================================================

   WALKING

===================================================== */

function updatePlayer(dt){

    const x =

    controls.joyX;

    const y =

    controls.joyY;

    const amount =

    Math.min(

        1,

        Math.sqrt(

            x*x +

            y*y

        )

    );

    if(

        amount > .08

    ){

        /*

        movement relative

        to camera direction

        */

        const cameraForward =

        new THREE.Vector3();

        camera.getWorldDirection(

            cameraForward

        );

        cameraForward.y = 0;

        cameraForward.normalize();

        const right =

        new THREE.Vector3(

            -cameraForward.z,

            0,

            cameraForward.x

        );

        const direction =

        new THREE.Vector3();

        direction

        .addScaledVector(

            right,

            x

        );

        direction

        .addScaledVector(

            cameraForward,

            -y

        );

        direction.normalize();

        const walkSpeed =

        controls.run

        ? 7.2

        : 3.8;

        const previous =

        player.position.clone();

        player.position

        .addScaledVector(

            direction,

            walkSpeed *

            amount *

            dt

        );

        if(

            collidesWithBuilding(

                player.position,

                .55

            )

        ){

            player.position.copy(

                previous

            );

        }

        playerHeading =

        Math.atan2(

            direction.x,

            direction.z

        );

        player.rotation.y =

        playerHeading;

        document.getElementById(

            "speed"

        ).textContent =

        controls.run

        ? "RUNNING"

        : "WALKING";

    }

    else{

        document.getElementById(

            "speed"

        ).textContent =

        "ON FOOT";

    }

    updateVehicleAction();

}

/* =====================================================

   ENTER / EXIT VEHICLE

===================================================== */

const vehicleControls =

document.getElementById(

    "vehicleControls"

);

const runButton =

document.getElementById(

    "run"

);

const actionButton =

document.getElementById(

    "action"

);

const statusText =

document.getElementById(

    "status"

);

function exitVehicle(){

    if(

        mode !==

        "vehicle"

    ) return;

    if(

        Math.abs(speed) >

        2.5

    ){

        actionButton.textContent =

        "SLOW DOWN";

        setTimeout(()=>{

            if(

                mode ===

                "vehicle"

            ){

                actionButton.textContent =

                "EXIT";

            }

        },700);

        return;

    }

    speed = 0;

    mode =

    "walking";

    /*

    driver's side

    */

    const side =

    new THREE.Vector3(

        -Math.cos(heading),

        0,

        Math.sin(heading)

    );

    player.position.copy(

        car.position

    );

    player.position

    .addScaledVector(

        side,

        2.1

    );

    player.position.y =

    0;

    player.rotation.y =

    heading;

    player.visible =

    true;

    vehicleControls.style.display =

    "none";

    runButton.style.display =

    "block";

    actionButton.style.display =

    "none";

    statusText.textContent =

    "ON FOOT";

    resetStick();

}

function enterVehicle(){

    if(

        mode !==

        "walking"

    ) return;

    const distance =

    player.position.distanceTo(

        car.position

    );

    if(

        distance >

        4.3

    ) return;

    mode =

    "vehicle";

    player.visible =

    false;

    vehicleControls.style.display =

    "block";

    runButton.style.display =

    "none";

    actionButton.style.display =

    "block";

    actionButton.textContent =

    "EXIT";

    statusText.textContent =

    "IN VEHICLE";

    resetStick();

}

function updateVehicleAction(){

    const distance =

    player.position.distanceTo(

        car.position

    );

    if(

        distance <=

        4.3

    ){

        actionButton.style.display =

        "block";

        actionButton.textContent =

        "ENTER CAR";

    }else{

        actionButton.style.display =

        "none";

    }

}

actionButton.addEventListener(

    "pointerdown",

    e=>{

        e.preventDefault();

        if(

            mode ===

            "vehicle"

        ){

            exitVehicle();

        }else{

            enterVehicle();

        }

    }

);

/* =====================================================

   CHASE CAMERA

===================================================== */

const cameraTarget =

new THREE.Vector3();

const desiredCamera =

new THREE.Vector3();

function updateCamera(dt){

    if(

        mode ===

        "vehicle"

    ){

        const backward =

        new THREE.Vector3(

            Math.sin(heading),

            0,

            Math.cos(heading)

        );

        desiredCamera.copy(

            car.position

        );

        desiredCamera

        .addScaledVector(

            backward,

            9.5

        );

        desiredCamera.y +=

        5.2;

        camera.position.lerp(

            desiredCamera,

            1 -

            Math.pow(

                .0015,

                dt

            )

        );

        cameraTarget.copy(

            car.position

        );

        cameraTarget.y =

        1.15;

        camera.lookAt(

            cameraTarget

        );

    }

    else{

        const behind =

        new THREE.Vector3(

            Math.sin(

                playerHeading

            ),

            0,

            Math.cos(

                playerHeading

            )

        );

        desiredCamera.copy(

            player.position

        );

        desiredCamera

        .addScaledVector(

            behind,

            5.4

        );

        desiredCamera.y +=

        3.6;

        camera.position.lerp(

            desiredCamera,

            1 -

            Math.pow(

                .003,

                dt

            )

        );

        cameraTarget.copy(

            player.position

        );

        cameraTarget.y =

        1.35;

        camera.lookAt(

            cameraTarget

        );

    }

}

/* =====================================================

   MISSION

===================================================== */

const missionText =

document.getElementById(

    "mission"

);

function updateMission(time){

    if(

        missionComplete

    ) return;

    checkpoint.rotation.y +=

    .012;

    checkpointRing.position.y =

    1.4 +

    Math.sin(

        time * .003

    ) * .35;

    const target =

    mode ===

    "vehicle"

    ? car.position

    : player.position;

    const distance =

    target.distanceTo(

        checkpoint.position

    );

    missionText.textContent =

    "MISSION: Drive to the yellow checkpoint — " +

    Math.round(distance) +

    " m";

    if(

        distance <

        7

    ){

        missionComplete =

        true;

        checkpoint.visible =

        false;

        missionText.textContent =

        "MISSION COMPLETE! $500";

        setTimeout(()=>{

            /*

            second checkpoint

            */

            checkpoint.position.set(

                -180,

                0,

                180

            );

            checkpoint.visible =

            true;

            missionComplete =

            false;

            missionText.textContent =

            "NEW MISSION: Reach the next checkpoint.";

        },2500);

    }

}

/* =====================================================

   INITIAL CAMERA

===================================================== */

camera.position.set(

    0,

    6,

    10

);

camera.lookAt(

    car.position

);

/* =====================================================

   GAME LOOP

===================================================== */

const clock =

new THREE.Clock();

function animate(time){

    requestAnimationFrame(

        animate

    );

    let dt =

    clock.getDelta();

    /*

    prevents giant physics

    jump after tab switching

    */

    dt =

    Math.min(

        dt,

        .04

    );

    if(

        mode ===

        "vehicle"

    ){

        updateVehicle(dt);

    }else{

        updatePlayer(dt);

    }

    updateCamera(dt);

    updateMission(time);

    renderer.render(

        scene,

        camera

    );

}

requestAnimationFrame(

    animate

);

/* =====================================================

   RESIZE

===================================================== */

window.addEventListener(

    "resize",

    ()=>{

        camera.aspect =

        innerWidth /

        innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(

            innerWidth,

            innerHeight

        );

    }

);

/* =====================================================

   STOP SAFARI GESTURES

===================================================== */

document.addEventListener(

    "gesturestart",

    e=>

    e.preventDefault()

);

document.addEventListener(

    "contextmenu",

    e=>

    e.preventDefault()

);

</script>
